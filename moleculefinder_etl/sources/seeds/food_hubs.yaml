    - {slug: calcium, presence: natural, presence_note: "A mineral of the milk the cheese is made from."}
    - {slug: sodium-chloride, presence: added, presence_note: "Salt the cheesemaker adds."}   # salt is a required step, not a seasoning
    - {slug: monosodium-glutamate, presence: formed, formed_when: aged, presence_note: "Free glutamate is released as the proteins break down in ageing."}   # free glutamate, which is why parmesan tastes savoury
    - {slug: tyramine, presence: formed, formed_when: aged, presence_note: "Formed as the proteins break down in ageing."}   # forms as the protein breaks down in ageing
