# The drawing-truth review's rulings and its classification (trust review 3, `mfetl review drawings`,
# moleculefinder_etl/review/drawings.py; brief ../TRUST-2-DRAWING-TRUTH-PROMPT.md, 2026-11-27).
#
# READ-ONLY DATA FOR THE REVIEW. Nothing here changes a drawing, a page or the snapshot: the review reads it to decide
# which of its findings a ruling already covers. An entry is added ONLY on a ruling (Garrett's, or Cowork's when Garrett
# has handed Cowork the chemistry), with its date and its reason; never to make a finding go away. How to add one, and
# who rules: docs/MAC-TRUST-REVIEWS.md, "Adding an allowlist entry".
#
# allow:   each list is one ruling: `date`, `by` (who ruled, and where), `what` (the ruling in a line), `covers` (the
#          review's facts it answers: metal-floating, lattice, fragments) and `records` {slug: reason}. A record on a
#          list is not a finding for the facts the list covers, and only for those. A later ruling of the same kind
#          (2026-11-27) joins a list under `later:` (its own date, by, what), and each record it adds is
#          {reason, date} with that ruling's date, so every entry still says which ruling put it there.
# survey:  the extended-solids survey's classification of every record its scope rule catches (scripts/
#          extended_solids_review.py SURVEY, 2026-11-26, copied verbatim; tests/test_review_drawings.py holds the two
#          equal). Group a extended solid, b salt of a discrete organic ion, c discrete inorganic molecule, d unclear or
#          another problem; `kind` (group a only) as the survey named it. Check 5 reports any in-scope record missing here.
# models:  the 3D model compound of each display structure that names a `model_cid` (structure_display.yaml), its
#          connectivity read from PubChem once (2026-11-27, PUG REST ConnectivitySMILES), so check 8 compares it with
#          the drawing without a request. A display entry whose model_cid is not here is itself a finding.
# pinned:  the live check's pages chosen by hand (check 9), each with its reason. Every structure_none, structure_display
#          (sugar and metal bonds) and repeat_units entry is pinned automatically on top of these.

