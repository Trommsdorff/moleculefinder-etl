# What it does (build plan everyday chemistry 2026-11, phase 4; rendered on the molecule page in phase 8,
# section 3). For a molecule with a curated mechanism: the sentences, each one sentence of a comparison
# paragraph found by its opening words and pinned to its text (12 hex of sha256, as the door seeds), and
# the name of a hand-made illustration, or none. A molecule with no entry has no "What it does" section.
# First entries: the molecules on the six door chains that have a mechanism sentence in our comparison
# notes. Not here, for want of one: paraxanthine, dextromethorphan, doxylamine, stevioside (its sentence
# speaks of "both"), limonene (its sentence overreaches: "the whole of citrus peel oil"), ammonia,
# sodium carbonate, maltol, furaneol. Illustrations are web assets (transform/doors.ILLUSTRATIONS).
