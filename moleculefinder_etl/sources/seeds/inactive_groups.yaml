# The inactive-ingredient groups the second finding counts on medicine labels (2026-11-22).
# HAND-MAINTAINED. A label ingredient joins a group ONLY by its UNII code, never by its name (the
# label-ingredient rule, ETL CLAUDE.md). A code in no group here, and in no colour of
# colour_additives.yaml, is counted as its own group under the FDA's name for it, so nothing a
# label lists is ever dropped from the count; grouping only ever joins codes.
#
# Every code below was read from the FDA's Global Substance Registration System (GSRS, the FDA's
# own registry of substances and their UNII codes; public domain) on 2026-11-22 through
#     https://gsrs.ncats.nih.gov/ginas/app/api/v1/substances(<UNII>)?view=full
# `gsrs_name` is the registry's preferred name, `gsrs_status` the record status it returned that
# day (FAILED is a validation flag on the registry record; the FDA's UNII table still lists the code
# under the name and labels use it, as with D&C Yellow No. 10's lake in colour_additives.yaml). The
# test checks every name against the FDA UNII table the build reads.
#
# THE RULE (a chemistry judgment, stated on the page). A group is one substance in the forms the
# labels name it: with or without water of crystallisation (hydrate and anhydrous), the grades of
# one material that differ by chain length, viscosity, molecular weight or particle size, the FDA's
# "unspecified" record for it, and for starch the plant it came from. Something made from a
# substance by changing it chemically is its own group: cross-linked, made into an ether, an ester
# or another salt, or a copolymer. The iron oxides are one group because the FDA lists them as one
# colour additive (21 CFR 73.1200, "any one or any combination of synthetically prepared iron
# oxides"); their members are shown. The colours come from colour_additives.yaml, each dye with
# its lake, so the two findings pages count a colour the same way.
# WHERE A GROUPING COULD BE ARGUED EITHER WAY, THE CODES ARE KEPT APART (`kept_apart`), with the
# reason, and the page lists them.
#
# `watch` (optional) is a pattern on a label ingredient's NAME used only to find a code that looks
# like a member but is in no group and not kept apart (`unrecognised`, logged and in the weekly
# summary): a person reads it. It never counts anything.
#
# `pages`: the groups with their own page (/findings/inactive-ingredients/<id>).

