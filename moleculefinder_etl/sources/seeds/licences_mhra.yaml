# UK licences read from the MHRA products database (products.mhra.gov.uk), for the medicines that
# Drugs@FDA and the EMA's medicines data do not cover (growth plan run B2, 2026-10-21).
#
# Checked BY HAND from the site's public substance pages, the way any visitor reads them: each entry
# names the substance exactly as MHRA's substance index spells it (the source page is built from it),
# one product listed on that page, and the date it was read. The database lists the product
# information (SmPC and leaflet) of medicines with a UK marketing authorisation.
#   - Licence numbers (PL ...) sit behind the site's disclaimer, which was not accepted on anyone's
#     behalf, so no entry carries one.
#   - The site's own search API needs a key and was not used.
# `combination: true` = no single-ingredient product is listed; the product contains the molecule.
# `mfetl licences` merges these, only for a medicine with no FDA or EMA record, into licences.yaml.
# Content: Crown copyright, Open Government Licence v3.0.

aluminium-hydroxide: {substance: ALUMINIUM HYDROXIDE, product: Maalox, combination: true, read: "2026-10-21"}
