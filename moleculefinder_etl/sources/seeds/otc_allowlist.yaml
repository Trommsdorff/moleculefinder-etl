# MoleculeFinder OTC allowlist  (hand-maintained)
# ------------------------------------------------------------------------------
# COPIED INTO THE ETL 2026-09-05 (build plan phase 2.2). It previously lived only at
# ../../otc-allowlist.yaml, outside either repo, so the pipeline could not read it:
# a GitHub Actions run checks out this repository alone. The groups below now also
# drive the kind:"use" hubs (/in/allergy, /in/cough-and-cold, ...) via
# transform/relationships.attach_otc_uses, so the grouping is no longer "for
# readability only".
# Over-the-counter "medicine-cabinet" molecules that belong in the EVERYDAY CORE,
# not the deferred prescription/recreational "drugs wing". Curated by hand on
# purpose: the OTC vs prescription line is fuzzy and country-dependent, so we
# decide it here rather than let a classifier guess. Add/remove freely.
#
# Rule of thumb for inclusion: a normal adult could buy it off a pharmacy or
# grocery shelf without a prescription (US/UK/EU), and would recognize it from
# their own bathroom cabinet.
#
# Group keys map to a hub slug + label in relationships.USE_GROUPS. A group with no
# mapping there is read as a plain allowlist entry and emits no hub.

analgesics_nsaids:      # pain / fever, OTC strengths
  - Diclofenac              # OTC as the Voltaren topical gel (tranche 2026-09-A)
  - Ibuprofen
  - Aspirin                 # acetylsalicylic acid
  - Paracetamol             # = acetaminophen
  - Naproxen
  - Acetaminophen           # alias of paracetamol; kept so either title matches

sleep_and_neuro:
  - Doxylamine              # OTC sleep aid / antihistamine
  - Diphenhydramine         # Benadryl / nighttime sleep aid

antihistamines:           # allergy, OTC
  - Levocetirizine          # Xyzal; the active half of cetirizine (tranche 2026-09-A)
  - Cetirizine
  - Loratadine
  - Fexofenadine
  - Chlorphenamine          # chlorpheniramine
  - Brompheniramine
  - Meclizine               # motion sickness
  - Cyclizine
  - Ketotifen
  - Budesonide              # tranche 2026-10-A
  - Mometasone              # tranche 2026-10-A
  - Fluticasone propionate  # tranche 2026-10-A
  - Azelastine              # tranche 2026-10-A

antacids_and_gi:          # heartburn / stomach, OTC
  - Calcium carbonate       # Tums (also a mineral; OTC use keeps it in core)
  - Magnesium hydroxide     # milk of magnesia
  - Aluminium hydroxide
  - Famotidine
  - Cimetidine
  - Omeprazole              # OTC in many markets
  - Esomeprazole
  - Bismuth subsalicylate   # Pepto-Bismol
  - Loperamide              # Imodium
  - Simethicone
  - Docusate                # stool softener
  - Bisacodyl               # laxative
  - Hyoscine butylbromide   # tranche 2026-10-A

cough_cold_decongestant:  # OTC
  - Dextromethorphan
  - Guaifenesin
  - Pseudoephedrine
  - Phenylephrine
  - Oxymetazoline
  - Ephedrine               # borderline (behind-counter); keep, easy to drop
  - Levomethamphetamine     # tranche 2026-10-A

topical_and_skin:         # OTC
  # Added with tranche 2026-09-A. All four are sold without a prescription somewhere in
  # US/UK/EU in a topical form, which is the allowlist's stated test; each also has
  # prescription forms, and the allowlist does not distinguish strengths.
  - Ketoconazole            # Nizoral anti-dandruff shampoo
  - Terbinafine             # Lamisil AT cream
  - Minoxidil               # Rogaine
  - Lidocaine               # numbing creams and patches
  - Hydrocortisone
  - Benzoyl peroxide
  - Salicylic acid          # acne / wart (also a plant compound)
  - Clotrimazole            # antifungal
  - Miconazole
  - Zinc oxide              # diaper cream / sunscreen
  - Calamine
  - Benzocaine              # tranche 2026-10-A
  - Adapalene               # tranche 2026-10-A

# Recorded as an OTC decision but deliberately NOT mapped to a hub in
# relationships.USE_GROUPS: naloxone is the only member, and a one-molecule /in/ page is
# exactly the thin content the 2026-09 build plan exists to remove. The file's own rule
# covers this: a group with no USE_GROUPS mapping is a plain allowlist entry.
emergency_otc:            # added with tranche 2026-09-A
  - Naloxone                # Narcan nasal spray, OTC in the US since 2023
  - Levonorgestrel          # tranche 2026-10-A

# Recorded as OTC decisions, deliberately NOT mapped to a hub in relationships.USE_GROUPS (phase 3B of the
# everyday chemistry plan, 2026-11-14): the four sunscreen filters sold under the FDA's OTC Monograph M020. Their
# hub is the curated sunscreen list (product_hubs.yaml), so they do not also join /in/skin-and-topical.
sunscreen_filters:        # phase 3B, batch 2026-11-care
  - Avobenzone
  - Homosalate
  - Octisalate
  - Octocrylene
  - Octinoxate              # batch 2026-12-care
  - Oxybenzone              # batch 2026-12-care
vitamins_supplements_otc: # sold as supplements; many also nutrients
  - Dimenhydrinate          # Dramamine (note: technically a salt/mixture)

antiseptics:              # wound / surface disinfectants, OTC (also everyday-chemistry)
  - Povidone-iodine         # Betadine (tranche 2026-09-A)
  - Hydrogen peroxide
  - Isopropyl alcohol       # = rubbing alcohol
  - Iodine                  # tincture of iodine (molecular I2)
  - Chlorhexidine           # antiseptic mouthwash / skin prep

urinary_otc:               # urinary pain relief, OTC (tranche 2026-10-A); one member, so no hub
  - Phenazopyridine         # tranche 2026-10-A

# ── uses_only (the status rule, 2026-11-27; transform/medicine_status.py) ─────────────────────────────────────────
# THIS LIST IS NOT EVIDENCE BY ITSELF. Every molecule named above must have an over-the-counter basis in its record (an
# FDA OTC licence, an OTC monograph, a current OTC label under an NDA, ANDA or monograph, or a basis recorded in
# status_bases.yaml), or the build stops and names it. The molecules below have none, so they are NOT on the OTC list:
# they are named here only for what they are taken for, which keeps them in their use hub (relationships.USE_GROUPS),
# and their records say is_otc false. Each was looked for on 2026-11-27 in the Drugs@FDA data files and on DailyMed.
uses_only:
  sleep_and_neuro:
    - Melatonin             # sold in the US as a dietary supplement; Drugs@FDA lists no melatonin product
  antacids_and_gi:
    - Lactulose             # every Drugs@FDA lactulose product is prescription (14 ANDAs); no OTC licence in the record
  cough_cold_decongestant:
    - Acetylcysteine        # every Drugs@FDA acetylcysteine product is prescription; its EU OTC licences are not in the record
  vitamins_supplements_otc:
    - Glucosamine           # sold in the US as a dietary supplement; Drugs@FDA lists no glucosamine product
