# What MoleculeFinder told people outside, figure by figure (trust review 5, findings arithmetic; brief
# ../TRUST-4-FINDINGS-ARITHMETIC-PROMPT.md, 2026-11-28). `mfetl review findings` checks every figure here against the
# live data.json and the live page every day; a figure that no longer holds is the class "a pitched number moved",
# reported the first day it is seen, at the top of the report and in QUEUE.md.
#
# Each figure: `value` (and `of`, its denominator) as it was told; `data`/`of_data`, where it lives in the finding's
# totals; `confirmed`, whether a FILE holds the figure as sent (never guessed), with the `evidence`. The emails' own text
# is not in any file in the folder (they were written in Gmail): a figure the tracker does not name is recorded as the
# number the linked page printed that morning, and marked unconfirmed. `baseline` is the labels as they stood when the
# emails went out, so a moved number can be explained label by label.
#
# The contacts themselves (names, addresses) stay in the private tracker, ../outreach/moleculefinder-backlink-outreach.xlsx
# (sheet Tracker, rows 37 to 41, items #36 to #40). This repository is public: outlets only here.
# Add a pitch when one is sent; never edit a sent figure.
