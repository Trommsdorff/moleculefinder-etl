      Written from the record's SMILES (CID 16212801) by scripts/cobalamin_layout.py: the cobalt bonded to the four
      corrin nitrogens, the benzimidazole's free nitrogen and the cyanide's carbon, the record's own double bonds and
      N- kept where it writes them. Coordinates by hand, one layout for all four cobalamins (hydroxocobalamin's
      skeleton laid out once; the other three take its coordinates atom for atom): the four Co-N bonds equal, the
      bond to the benzimidazole crossing the ring's edge once (C14-C15), the top group inside the ring.
    basis: >-
      A cobalamin is a corrin ring with cobalt(III) at its centre, bonded to the ring's four nitrogens, to the free
      nitrogen of the 5,6-dimethylbenzimidazole on the nucleotide loop below the ring and to one group above it.
      PubChem's one-line structure writes the cobalt, the ring and the top group as separate pieces. The bond rule as
      for the other entries: the ring's N- and the top group (charged negative in the record) share plain bonds with
      the cobalt, so Co3+ is drawn Co+; the three neutral ring nitrogens and the benzimidazole nitrogen give dative
      arrows. Its record specifies 13 of the 14 carbon centres, every one the same as hydroxocobalamin's; the
