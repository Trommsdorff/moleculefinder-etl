# ── 137 NETWORK FRESHNESS WATCHDOG (added 2026-08-08) ────────────────────────
#
# WHY THIS LIVES IN THIS REPO, WHICH IS OTHERWISE NOTHING TO DO WITH IT:
# because moleculefinder-etl is the ONLY PUBLIC repo in the 137 network, and
# public repos bill ZERO GitHub Actions minutes. Every other 137 repo is private
# and draws on one shared 2,000-minute monthly allowance.
#
# That distinction is the entire point. The failure this watchdog exists to catch
# is MINUTES EXHAUSTION: when the allowance runs out, scheduled jobs in the
# private repos do not fail loudly — they are never scheduled at all. The run
# appears, lasts 1-11 seconds, has an EMPTY STEP LIST, and dies. Nothing inside
# the starved repo can report it, because nothing inside the starved repo runs.
# GravityFinder died this way for 25 consecutive nights (2026-07-07..31) and its
# data was frozen the entire time with nobody aware.
#
# So the alarm has to come from outside the budget. Running here, it cannot be
# starved by the thing it is watching. DO NOT "tidy" this into the private repos.
#
# WHAT IT ASKS: not "does the site look fresh?" — the five sites expose five
# different and partly absent freshness signals (measured 2026-08-08: TFF prints
# a real data date, GravityFinder a build sha, JudicialFinder only a sitemap
# lastmod, MoleculeFinder nothing). A parser over five inconsistent signals is a
# watchdog that quietly reports green forever. It asks the ONE uniform question
# the Actions API answers for every repo: WHEN DID THIS REFRESH LAST SUCCEED?
#
# FAIL-LOUD: an unreachable API, a missing workflow, or a repo it cannot read is
# an ALARM, not a pass. A watchdog that treats "I could not check" as "fine" is
# worse than no watchdog, because it manufactures confidence.
#
# ── 2026-09-09: QUIETER, NOT WEAKER ──────────────────────────────────────────
# The rules above are unchanged. What changed is HOW OFTEN a live problem mails
# Garrett. Until today every daily run of an ongoing problem exited 1, so an
# episode that lasted 24 days sent 24 identical "All jobs have failed" emails
# (TheFiscalFinder, 2026-08-16 onward) — and a watchdog whose mail you have
# learned to delete is not a watchdog. The job now emails at the START of an
# episode and then goes quiet, while still writing the daily evidence:
#
#   1. NEW staleness, no open issue      -> open the issue, exit 1  (email)
#   2. SAME staleness, issue already open -> comment, exit 0        (silent)
#   3. EVERYTHING back in its window      -> comment "recovered", close, exit 0
#   4. COULD NOT CHECK                    -> alarm EVERY day, exit 1  (email)
#
# (4) is deliberately exempt. Could-not-check is the starvation case this file
# exists for, and it is exactly the case where an issue sitting open must NOT
# buy silence — the day the allowance runs out is the day you want the mail.
#
# The report logic moved to .github/watchdog/network_freshness.py so it can be
# tested offline against a stubbed API (tests/test_watchdog_report.py drives all
# four states above, plus the monthly carve-out). It could not be exercised in
# place: to see the "recovered" branch you would have to break a sibling site.
#
# ── OWNER SETUP (one-time, required — without it this workflow only alarms) ──
#   The default GITHUB_TOKEN is scoped to THIS repo only, so it cannot read the
#   private repos' run history. Create a fine-grained PAT and add it here:
#     GitHub → Settings → Developer settings → Personal access tokens →
#       Fine-grained tokens → Generate new token
#       Resource owner: Trommsdorff
#       Repository access: Only select repositories →
#         judicialfinder, thefiscalfinder, gravityfinder, moleculefinder-etl
#       Permissions → Repository → Actions: READ-ONLY
#                     Repository → Issues:  READ-ONLY   (added 2026-09-09; see
#                       the monthly carve-out below. WITHOUT IT NOTHING BREAKS —
#                       the watchdog just reports a known monthly failure as
#                       plain staleness and says so in the issue.)
#       Expiration: set a date you will accept, or "No expiration"
#     Then: gh secret set NETWORK_READ_TOKEN --repo Trommsdorff/moleculefinder-etl
#   Read-only. It cannot deploy, push, or read source.
#
# ── THE MONTHLY CARVE-OUT (2026-09-09) ───────────────────────────────────────
# TheFiscalFinder refreshes on the 1st of the month. When its 2026-09-01 run
# failed, the watchdog had no way to say anything but "stale for 66 days and
# counting", every day, until 2026-10-01 — which reads like a lost cron when it
# is really a known failure with a known next attempt. So: a MONTHLY target
# whose last scheduled run failed, whose own repo carries an open issue about
# that failure, and whose next scheduled run has not yet come due, is reported
# as "known, waiting" and does not alarm. It becomes a full alarm the moment
# that next run also fails, or does not appear at all. Three conditions, all
# required, all falsifiable — this is a narrower claim than "stale", not a
# softer one.

name: Network freshness watchdog

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC (~9am US Eastern) — free, public repo
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read # the job now checks out, for the report module only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read before deciding: the decision table needs to know whether this is
      # day one of an episode or day twenty.
      - name: Find the open episode issue
        id: episode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --label network-staleness --state open \
                --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "Open episode issue: ${n:-none}"

      - name: Check every refresh cron across the network
        id: check
        env:
          TOKEN: ${{ secrets.NETWORK_READ_TOKEN }}
          ISSUE: ${{ steps.episode.outputs.number }}
        run: |
          # A missing token is the could-not-check case, so it alarms every day —
          # but it must still respect an open episode, or it opens a fresh issue
          # daily. Same rule the decision table applies.
          if [ -z "$TOKEN" ]; then
            {
              echo "action=$([ -n "$ISSUE" ] && echo comment || echo create)"
              echo "exit_code=1"
              echo "report<<WATCHDOG_REPORT"
              echo "- **all four targets** — COULD NOT CHECK: the NETWORK_READ_TOKEN secret is not"
              echo "  set, so nothing was verified. See the setup block in .github/workflows/watchdog.yml."
              echo "WATCHDOG_REPORT"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import datetime, json, os, sys, urllib.request
          sys.path.insert(0, ".github/watchdog")
          import network_freshness as nf

          TOKEN = os.environ["TOKEN"]

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          report = nf.build_report(api, datetime.datetime.now(datetime.timezone.utc))
          decision = nf.decide(report, issue_open=bool(os.environ.get("ISSUE")))

          for f in report.findings:
              print(f"{f.state.upper():<14} {f.line.splitlines()[0]}")
          print(f"\n-> {decision.action} (exit {decision.exit_code}): {decision.why}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"action={decision.action}\n")
              fh.write(f"exit_code={decision.exit_code}\n")
              fh.write(f"why={decision.why}\n")
              fh.write("report<<WATCHDOG_REPORT\n" + report.detail() + "\nWATCHDOG_REPORT\n")
          PY

      # `always()` because the step above must be able to crash without this one
      # being skipped. A crash leaves `action` empty, which is treated as an
      # alarm below — the watchdog's own failure is never silent.
      - name: Act on the verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ REQUIRED, even though this job now checks out. The alarm must not
          # depend on a .git being present: on 2026-08-09 this workflow had no
          # checkout, `gh` could not infer the repo, and every command here died
          # with "failed to run git: fatal: not a git repository". The check had
          # worked perfectly and caught JudicialFinder at 33 days stale — and the
          # step meant to REPORT it failed, so the alarm was silent. An alarm
          # that cannot raise itself is the failure mode this whole file exists
          # to prevent. GH_REPO supplies the context unconditionally.
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.check.outputs.action }}
          EXIT: ${{ steps.check.outputs.exit_code }}
          REPORT: ${{ steps.check.outputs.report }}
          ISSUE: ${{ steps.episode.outputs.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          today=$(date -u +%F)

          if [ -z "${ACTION:-}" ]; then
            # The check step crashed. That is a could-not-check about all four
            # targets, so it alarms — onto the open episode if there is one.
            ACTION=$([ -n "${ISSUE:-}" ] && echo comment || echo create); EXIT=1
            REPORT="- **the watchdog itself** — COULD NOT CHECK: its check step did not finish.
            Nothing about the four refresh crons was verified."
          fi

          detail="${REPORT:-(no detail captured — see the run log)}"

          body="A 137 network data refresh has stopped running.

          $detail

          What this means: the affected site is still UP and serving its last good
          build. Its DATA is frozen as of the date above.

          Most likely causes, in order:
          1. The shared 2,000-minute GitHub Actions allowance is exhausted. Check
             github.com/settings/billing. Starved runs last 1-11 seconds and have
             an empty step list.
          2. The workflow was disabled by hand and not re-enabled.
          3. The refresh is genuinely failing — check that repo's own issues.

          Watchdog run: $RUN

          This issue will close itself when every target is back inside its window.
          While it is open the watchdog comments here daily and does NOT email, so
          that one episode is one email. A target it CANNOT CHECK still emails every
          day — that is the starvation case, and silence there is the bug."

          case "$ACTION" in
            none)
              echo "Nothing to do: every target is inside its window and no episode is open."
              ;;
            create)
              gh label create network-staleness --color B60205 \
                --description "A 137 site's data refresh has stalled" 2>/dev/null || true
              gh issue create --label network-staleness \
                --title "137 network: a data refresh has stalled" --body "$body"
              ;;
            comment)
              gh issue comment "$ISSUE" --body "Still open as of $today.

          $detail

          Watchdog run: $RUN"
              ;;
            close)
              gh issue comment "$ISSUE" --body "Recovered as of $today. Every refresh cron is back
          inside its freshness window.

          $detail

          Watchdog run: $RUN

          Closing. The watchdog will open a new issue if anything falls behind again."
              gh issue close "$ISSUE"
              ;;
            *)
              echo "::error::unknown action '$ACTION'"; exit 1
              ;;
          esac

          exit "${EXIT:-1}"
