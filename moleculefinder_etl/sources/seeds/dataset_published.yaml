# The MoleculeFinder dataset as published (Garrett uploaded version 2026.10 on 2026-10-23, Zenodo
# dates it 2026-10-24; version 2026.10.1 on 2026-10-24). Every package `mfetl dataset` builds
# carries these, and it REFUSES to build if any field is empty: a package that cannot say where it
# is published is not shipped. The citation is always the concept DOI; each version's own DOI goes
# beside it. Versions are listed oldest first; the last is the latest, and zenodo_record is its page.
# A new version: `mfetl dataset --version <v> --doi <its Zenodo DOI>` appends it here and moves
# zenodo_record (never edit by hand); then the web repo's lib/dataset.ts gets the same line.
concept_doi: 10.5281/zenodo.23605767    # Zenodo's "Cite all versions" DOI: always the latest version
zenodo_record: https://zenodo.org/records/23620892
kaggle: trommsdorff/moleculefinder-molecules-in-everyday-products
versions:                                # each published version's own DOI
  "2026.10": 10.5281/zenodo.23605768
  "2026.10.1": 10.5281/zenodo.23620892
