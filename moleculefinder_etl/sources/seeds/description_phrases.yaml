  # Elements, materials and the household-chemistry families the tranche adds.
  alkane:               {article: an, phrase: alkane, hub: Alkanes}
  alkyne:               {article: an, phrase: alkyne, hub: Alkynes}
  aromatic:             {article: an, phrase: aromatic hydrocarbon, hub: Aromatic hydrocarbons}
  element:              {article: a, phrase: chemical element, hub: Chemical elements}
  mineral:              {article: a, phrase: hard mineral solid, hub: Hard mineral solids}
  organohalogen:        {article: an, phrase: organohalogen, hub: Organohalogens}
  polymer:              {article: a, phrase: polymer, hub: Polymers}
  # "other" is the catch-all the Scope B CSV uses when no family fits (87 rows).
  # Deliberately vague rather than wrong; the bucket clause carries the meaning.
  other:                {article: a, phrase: compound, hub: Other compounds}

# ── buckets: scope_bucket -> the clause that follows the family phrase ────────
buckets:
  body-endogenous:    that occurs naturally in the human body
  everyday-chemistry: used in everyday household chemistry
  food-flavor:        found in everyday food and flavor
  nutrient-vitamin:   counted among the everyday nutrients
  otc-medicine:       sold over the counter
  plant-compound:     made by plants
  scent-aroma:        carried in everyday scent and aroma
  sweetener:          used to sweeten food and drink
  # Added with catalog tranche 2026-09-A. The prescription clause deliberately says
  # only where the thing is dispensed from, never what it treats or how it is used.
  prescription-medicine: dispensed on prescription
  element-material:      met as a pure element or an engineered material

# ── GHS pictogram -> the plain-English hazard word for the label clause ───────
# Ordered by how much a reader cares; build_description names at most two.
ghs_pictograms:
  GHS01: explosive
  GHS06: acutely toxic
  GHS05: corrosive
  GHS02: flammable
  GHS08: a health hazard
  GHS03: oxidizing
  GHS04: a compressed gas
  GHS09: hazardous to the environment
  GHS07: an irritant

# ── functional group -> the phrase used in the "its structure carries" clause ─
functional_groups:
  alcohols:          a hydroxyl group
  aldehydes:         an aldehyde group
  amides:            an amide bond
  amines:            an amine group
  aromatics:         an aromatic ring
  carboxylic-acids:  a carboxylic acid group
  esters:            an ester group
  ethers:            an ether linkage
  halogenated:       a halogen atom
  ketones:           a ketone group
  phenols:           a phenol group
  phosphates:        a phosphate group
  thiols:            a thiol group
