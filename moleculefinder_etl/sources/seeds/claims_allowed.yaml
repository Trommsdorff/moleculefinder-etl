# Lines that keep a claim word, and why each stands (build plan everyday chemistry 2026-11, phase 2,
# the copy sweep; the rule is in transform/claims.py).
#
# A curated line may say "only", "first", "most", "leading", "largest", "world's", "never" or "always"
# when (a) our own data shows it and the build asserts it (basis: data, with the check that asserts
# it), (b) it is a standard, datable fact of chemistry, biology or history (basis: science or
# history), or (c) the word ranks nothing (basis: ordinary). A comparison answer line is never edited
# by the sweep; one that overreaches is held (basis: held) and listed for Garrett.
#
# Each entry pins its line by `line`, the first 12 hex digits of sha256 over the line's text with its
# whitespace collapsed. A new line carrying a claim word, or an edit to a line that carries one, has
# no matching entry and stops the build (claims.check_lines, start of stage_transform; and pytest).
# To fix: check the claim, then add or update the entry here with its basis and the new `line`
# (the error message prints it). Entries for lines that no longer carry a word fail too.
#
# Covers why_it_matters.yaml, every curated editorial, comparisons.yaml's paragraphs (comparison) and
# its answer lines (answer).

