# Repeat units (everyday chemistry phase 5A, 2026-11-12; Garrett's ruling 5 of 2026-11-09): for a
# hand-modelled polymer with no single structure, a curated fragment of its chain, drawn by the ETL
# with the linkage highlighted and labelled as part of a chain, never as the whole molecule.
# Compiled by transform/drawings.py into `structure_repeat_unit` on the record.
# Full guide (and which other polymers suit one): docs/DRAWING-RECIPES.md.
#
# Each unit: smiles (the fragment; `*` marks where the chain carries on), linkage (what the joint
# is, as data), linkage_smarts (finds the joint; must match exactly `linkages` times), units, label.
#
# Starch: two alpha-D-glucopyranose units joined 1->4, the joint of amylose and of amylopectin's
# chains. Derived from the catalog's maltose (PubChem's maltose, 4-O-alpha-D-glucopyranosyl-
# D-glucose): its linkage kept as PubChem draws it, its reducing end set to the same alpha
# configuration, and both chain ends opened to `*`. Cellulose: the same two units with both
# anomeric carbons inverted, beta-1,4. The proof is a pattern, not a CIP label (a `*` end and the
# neighbouring ring both move CIP priorities): the alpha-glucosyl unit cut from that maltose
# matches both units of starch and neither of cellulose; its inverse, the reverse; starch with
# hydrogen for `*` is that maltose, stereo included; the catalog's amylose model matches the alpha
# unit twice (tests/test_drawings.py).
units:
  starch:
    smiles: "*O[C@H]1O[C@H](CO)[C@@H](O[C@H]2O[C@H](CO)[C@@H](O*)[C@H](O)[C@H]2O)[C@H](O)[C@H]1O"
    linkage: alpha-1,4
    linkage_smarts: "[#6;R]-[#8;!R]-[#6;R]"
    linkages: 1
    units: 2
    label: Two units of the chain
  cellulose:
    smiles: "*O[C@@H]1O[C@H](CO)[C@@H](O[C@@H]2O[C@H](CO)[C@@H](O*)[C@H](O)[C@H]2O)[C@H](O)[C@H]1O"
    linkage: beta-1,4
    linkage_smarts: "[#6;R]-[#8;!R]-[#6;R]"
    linkages: 1
    units: 2
    label: Two units of the chain
  # Carboxymethyl cellulose (phase 3B, Garrett's ruling of 2026-11-14 on the phase 3A review, (b)): drawn as a repeat
  # unit IN PLACE OF its PubChem record's drawing, a deliberate, reviewed remake the drawing guard lists. PubChem's
  # CID 24748 is two small molecules (open-chain glucose and acetic acid), not the polymer. The unit is cellulose's
  # (two beta-D-glucopyranose units joined 1->4, above) with a carboxymethyl group, -CH2-COOH, on one unit's C6
  # oxygen: with that group taken off it is cellulose's unit, stereo included (tests/test_phase3b.py). Which
  # hydroxyls carry the group (C2, C3 or C6) and how many vary along a real chain; C6 is shown. The line's basis:
  # the degree of substitution, the average number of carboxymethyl groups per glucose unit, is what sets a grade
  # apart (JECFA's specification for sodium carboxymethyl cellulose, INS 466, allows 0.20 to 1.50).
  carboxymethyl-cellulose:
    smiles: "*O[C@@H]1O[C@H](COCC(=O)O)[C@@H](O[C@@H]2O[C@H](CO)[C@@H](O*)[C@H](O)[C@H]2O)[C@H](O)[C@H]1O"
    linkage: beta-1,4
    linkage_smarts: "[#6;R]-[#8;!R]-[#6;R]"
    linkages: 1
    group: carboxymethyl
    group_smarts: "[#8;!R]-[CH2;!R]-C(=O)[OX2H1]"
    group_light: [1, 2, 3, 4]
    groups: 1
    units: 2
    label: Two units of the chain
    line: One carboxymethyl group is shown. How many the chain carries, on average per glucose unit, varies from one grade to another.
    replaces: PubChem's record of it, CID 24748, is two small molecules, open-chain glucose and acetic acid, not the polymer.
  # Simeticone (the wrong-drawings pass, 2026-11-26; Garrett's word: drawn as a repeat unit, not the panel). Drawn IN
  # PLACE OF its PubChem record's drawing, as carboxymethyl cellulose is (phase 3B): a deliberate, reviewed remake the
  # drawing guard lists, and with `replaces` the record drops everything derived from PubChem's structure (formula,
  # weight, SMILES, InChI, computed descriptors, 3D, functional groups, similarity edges, the weight boards;
  # assemble._replaced_by_unit). PubChem's CID 6433516 is a short trisiloxane plus a lone O=Si=O molecule, which
  # describes neither the polymer nor the mixture. The unit: two dimethylsiloxane units, -Si(CH3)2-O-, joined by a
  # siloxane (Si-O-Si) linkage. With its two ends joined it is a ring in which every silicon carries two methyls and
  # two oxygens and silicon and oxygen alternate, as in polydimethylsiloxane (tests/test_wrong_drawings.py). The silica
  # is not drawn. The silica share (the USP monograph's 4.0 to 7.0 percent) is left out of the line: no source the
  # licence rule allows (registry.py) states it.
  simeticone:
    smiles: "*[Si](C)(C)O[Si](C)(C)O*"
    linkage: siloxane
    linkage_smarts: "[Si]-[O]-[Si]"
    linkages: 1
    units: 2
    label: Two units of the chain
    line: >-
      Simeticone is polydimethylsiloxane, a silicone chain of alternating silicon and oxygen with two methyl groups
      on each silicon, mixed with a small share of finely divided silica.
    replaces: >-
      PubChem's record of it, CID 6433516, is a short siloxane and a lone O=Si=O molecule, not the polymer.
