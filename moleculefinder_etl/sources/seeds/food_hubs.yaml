    - {slug: catechin, presence: natural, presence_note: "A flavanol of the tea leaf."}
    - {slug: gallic-acid, presence: natural, presence_note: "In the tea leaf, and freed from the catechin gallates in processing."}
    - {slug: tannic-acid, presence: none, presence_note: "not yet checked"}   # the dry grip of strong tea
    - {slug: quercetin, presence: natural, presence_note: "A flavonol of the tea leaf, mostly as its glycosides."}
    - {slug: water, presence: added, presence_note: "The brewing water."}
    - {slug: manganese, presence: natural, presence_note: "The tea plant takes it up from the soil and holds it in the leaf."}   # tea leaves concentrate it; a notable dietary source

