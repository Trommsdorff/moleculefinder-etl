# Licence basis for medicines admitted under a ruling (Garrett, 2026-10-18).
#
# THE RULE: a molecule qualifies as an approved medicine when it holds a CURRENT marketing
# authorisation for human use from the FDA, the MHRA, the EMA, or the national regulator of any
# single EU member state. One national licence is enough. It applies the same way to new rows and to
# pages already live; rows that fail it go to deferred_rows.csv.
#
# Each entry is carried onto the molecule's record as `approval` (relationships.attach_approvals),
# so the basis travels with the data. `source` is filled only where the authorisation was confirmed
# from the regulator's own record; a ruling without one says so in `basis`.

orforglipron:
  regulator: US Food and Drug Administration
  product: Foundayo
  application: NDA 220934
  authorised: "2026-04-01"
  basis: Original approval for chronic weight management, confirmed 2026-10-18 from Drugs@FDA and the DailyMed label.
  source: https://www.accessdata.fda.gov/scripts/cder/daf/index.cfm?event=overview.process&ApplNo=220934
  label: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8ac446c5-feba-474f-a103-23facb9b5c62

meldonium:
  regulator: State Agency of Medicines of Latvia
  product: Mildronate
  basis: Latvian national licence (Garrett ruling, 2026-10-18).

phenibut:
  regulator: State Agency of Medicines of Latvia
  basis: Latvian national licence; stays live exactly as meldonium qualifies (Garrett ruling, 2026-10-18). Not to be raised again.
  exception:   # a ruled exception (see the note above phenazopyridine below): the source review's check 3 does not report it
    ruled: "2026-10-18"
    by: Garrett (the approved-medicine rule's ruling; CLAUDE.md "Phenibut and flunitrazepam stay")
    why: Stays live on its Latvian national licence, which no regulator's data file the review reads can confirm. Not to be raised again.

clenbuterol:
  regulator: National regulators of EU member states
  product: Spiropent
  basis: National licences in EU member states (Garrett ruling, 2026-10-18).

clostebol:
  regulator: Italian Medicines Agency (AIFA)
  product: Trofodermin
  basis: Italian national licence (Garrett ruling, 2026-10-18).

flunitrazepam:
  regulator: Italian Medicines Agency (AIFA)
  product: Roipnol (Cheplapharm Arzneimittel GmbH)
  application: AIC 023328 (pack 023328077, 1 mg film-coated tablets)
  authorised: "2000-12-11"
  basis: Italian national licence, administrative status A (authorised), marketed, not revoked or suspended, special prescription (RMR); confirmed 2026-10-18 from AIFA's medicines database. Spain's AEMPS register (CIMA) lists no flunitrazepam product.
  source: https://api.aifa.gov.it/aifa-bdf-eif-be/1.0.0/formadosaggio/ricerca?query=flunitrazepam
  label: https://medicinali.aifa.gov.it/
  exception:
    ruled: "2026-10-18"
    by: Garrett (the approved-medicine rule's ruling; CLAUDE.md "Phenibut and flunitrazepam stay")
    why: Stays live on its Italian national licence (AIFA), read by hand on 2026-10-18; not to be raised again.

# ── RULED EXCEPTIONS (one place). An `exception:` on an entry records a molecule Garrett ruled stays live although
# the approved-medicine rule's check cannot confirm a current authorisation from a regulator's data file: phenibut and
# flunitrazepam (2026-10-18) above, phenazopyridine (2026-11-28) below. The approved-medicine rule, the status rule
# (transform/medicine_status.py) and the source review's check 3 (review/sources.py) read them through
# relationships.ruled_exceptions(); none reports one as a finding. `marketed: unapproved` (with the label it is sold
# under, its marketing category quoted as the label states it) gives the page the fourth status line, "Sold in the
# United States without FDA approval.", and is allowed only on an entry that holds no licence.
phenazopyridine:
  exception:
    ruled: "2026-11-28"
    by: Garrett (brief TRUST-5-SOURCE-CHECK-PROMPT.md, section D)
    why: No marketing authorisation from any regulator the approved-medicine rule names (Drugs@FDA, the EMA and the MHRA list none); its one DailyMed label, Pyridium, is an unapproved drug's. The page stays, as a ruled exception, and says so truthfully.
    marketed: unapproved
    label: {product: Pyridium, setid: 165d01d4-a9f7-2293-e054-00144ff8d46c, version: 15, category: unapproved drug other, read: "2026-11-28"}

# ── Phase 3B, the personal-care tranche (batch 2026-11-care; Garrett's ruling, 2026-11-09, question 6 of the
# everyday chemistry plan: an FDA OTC monograph counts as a current authorisation). Products with these actives are
# marketed in the United States under an OTC monograph, without an individual application, so Drugs@FDA holds no
# record. Each entry was checked on 2026-11-14 against the FDA's own final administrative order on the OTC
# Monographs@FDA portal (https://www.accessdata.fda.gov/scripts/cder/omuf/index.cfm), the ingredient read from the
# order's active-ingredient section, and the portal's list of orders read for any later order removing it.
