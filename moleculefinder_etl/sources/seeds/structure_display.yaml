    top: "[#6]#[#7]"
    stereo_from: hydroxocobalamin
    bonded:
      - {smarts: "[#7;r5;!a]", count: 4}
      - {smarts: "[n;!$(n-[#6;!a])]", count: 1}
      - {smarts: "[#6]#[#7]", count: 1}
