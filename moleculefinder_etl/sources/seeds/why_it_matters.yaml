# "Why it matters" — a curated, one-sentence, plain-language line per molecule (build spec
# follow-up #1). Written experientially: what the molecule does for a person or why it is
# interesting, NOT a chemical definition. The world-detail SELECTED panel shows this instead of
# PubChem's generic description (which makes many molecules read as "chemical compound"); it
# falls back to that description only when no curated line exists here.
#
# Scope: every molecule reachable while roaming the 10 worlds (their members + the affects/
# becomes targets + journey steps). Each line is neutral and non-advice (no health claims, no
# "you should"), no em-dashes (house rule). Confidence is stamped from_source / MoleculeFinder
# curated in code. The compiler validates every slug against the snapshot and fails loudly on a
# typo, so this file can never ship a dangling reference.

# ── Morning coffee ─────────────────────────────────────────────────────────────
caffeine: "The molecule behind coffee's lift: it keeps you feeling alert by getting in the way of your brain's own sleepiness signal."
chlorogenic-acid: "A big part of coffee's tang and brown color, and one of the most abundant antioxidants in a typical cup."
theobromine: "Chocolate's gentle stimulant, a milder cousin of caffeine that gives cocoa its lingering lift and faint bitterness."
niacin: "Vitamin B3, which your cells use to turn food into usable energy; roasting even creates a little of it in coffee."
paraxanthine: "The main thing caffeine turns into inside you, and much of what actually keeps you feeling awake after a cup."
adenosine: "The 'time to rest' signal that slowly builds up while you are awake; caffeine works by blocking it."
theophylline: "A close relative of caffeine that turns up in tea, and a mild stimulant of its own."

# ── A spicy dinner ─────────────────────────────────────────────────────────────
capsaicin: "The molecule that makes chili peppers hot; it trips the same nerves that sense heat, so your mouth reads a burn that is not really there."
piperine: "The bite of black pepper, a gentler relative of chili heat that gives pepper its sharp, warming kick."
gingerol: "The fresh, peppery heat of raw ginger."
shogaol: "What ginger's heat becomes once it is dried or cooked, giving dried ginger a sharper, warmer bite."
allicin: "The pungent molecule that forms the instant you crush or chop garlic, behind its sharp smell and bite."
allyl-isothiocyanate: "The sinus-clearing sting of mustard, horseradish, and wasabi."

# ── Chocolate ──────────────────────────────────────────────────────────────────
phenethylamine: "A trace molecule in chocolate and a natural messenger in the brain, sometimes linked to the flutter of excitement."
anandamide: "Nicknamed the bliss molecule, one of the body's own signals for a calm, contented feeling; it also turns up in tiny amounts in chocolate."
tryptophan: "An amino acid from everyday protein foods that your body converts, step by step, into the mood and sleep molecules serotonin and melatonin."
tyramine: "A molecule that builds up in aged cheese, cured meats, and chocolate as they ripen."

# ── The smell after rain ───────────────────────────────────────────────────────
geosmin: "The earthy smell of fresh soil and the first drops of rain; people can pick it out at astonishingly tiny amounts."
dimethyl-sulfide: "A savory, sea-air, cooked-vegetable note that carries in the scent of the coast and of rain."
methanethiol: "One of the smelliest molecules there is, behind the sulfur edge in breath, ripe cheese, and damp air."
2-nonenal: "A cucumber-and-paper smell familiar from stale beer and the scent of old books."

# ── Falling asleep ─────────────────────────────────────────────────────────────
melatonin: "The body's own nightfall signal, released as it gets dark to say the day is winding down."
gamma-aminobutyric-acid: "The brain's main calm-down messenger, quieting nervous activity so things can settle."
glycine: "The simplest amino acid, a building block of protein and collagen that also acts as a calming signal in the nervous system."
serotonin: "A messenger tied to mood and steadiness, and the in-between step your body uses to make the sleep molecule melatonin."
5-hydroxytryptophan: "The halfway point as your body turns tryptophan from food into serotonin."

# ── A glass of wine ────────────────────────────────────────────────────────────
ethanol: "The alcohol in wine, beer, and spirits, and what the body reads as intoxicating."
resveratrol: "A plant molecule in red grape skins and red wine, much studied and much debated."
tannic-acid: "The dry, puckery grip of red wine and strong tea, the feel of tannins on your tongue."
tartaric-acid: "The sharp fruit acid of grapes that gives wine much of its crisp tartness."
malic-acid: "The green-apple sourness found in apples, grapes, and many other fruits."
cyanidin: "The deep red-purple pigment that colors red grapes, berries, and red wine."

# ── Fresh-baked bread ──────────────────────────────────────────────────────────
maltol: "The warm, toasty, caramel smell of fresh bread crust and baked goods."
ethyl-maltol: "A sweeter, more intense cousin of the bread-crust molecule, used to give foods a cotton-candy warmth."
furaneol: "A ripe-strawberry, cooked-sugar aroma that also forms as bread bakes."
hydroxymethylfurfural: "A signature of browning that builds up as sugars are heated in baking and in honey."
acetic-acid: "The sour molecule that makes vinegar vinegar, and a tang in sourdough."
acrylamide: "A molecule that forms when starchy foods are toasted or fried to a deep brown."

# ── Sunscreen and summer skin ──────────────────────────────────────────────────
zinc-oxide: "The white mineral in many sunscreens; it sits on the skin and bounces sunlight away."
melanin: "Your body's own sunshade, the pigment that colors skin and hair and soaks up UV light."
cholecalciferol: "The form of vitamin D your skin makes when sunlight lands on it."
retinol: "A form of vitamin A, familiar from skincare for its part in skin renewal."
salicylic-acid: "A plant-derived acid, a chemical relative of aspirin, familiar in skincare for clearing pores."
hyaluronic-acid: "A water-holding molecule the body makes to keep skin and joints plump and cushioned."

# ── Citrus ─────────────────────────────────────────────────────────────────────
limonene: "The bright citrus scent locked in orange and lemon peel."
citral: "The unmistakable lemon smell, and the heart of lemongrass."
ascorbic-acid: "Vitamin C, the tart brightness of citrus and a nutrient your body cannot make on its own."
citric-acid: "The mouth-watering sourness of lemons, limes, and oranges."
hesperidin: "A flavonoid concentrated in orange peel and the white pith of citrus."
naringin: "The molecule behind grapefruit's characteristic bitterness."

# ── Your workout ───────────────────────────────────────────────────────────────
adenosine-triphosphate: "The tiny rechargeable battery your cells spend for almost every bit of work they do."
creatine: "A molecule your muscles keep on hand to recharge energy fast during short, hard effort."
lactic-acid: "What builds up in hard-working muscles, and the tang in sour milk and yogurt."
beta-hydroxybutyric-acid: "A backup fuel the liver makes from fat when carbohydrates run low, as in fasting or long exercise."
epinephrine: "Adrenaline, the surge that readies your body for a burst of action."
carnitine: "A shuttle molecule that carries fat into the part of the cell that burns it for energy."

# ── Roaming targets (affects / becomes, not world members) ─────────────────────
acetaldehyde: "What alcohol first turns into as the body breaks it down, and a large part of a hangover."
dopamine: "A brain messenger tied to motivation and reward, the feeling of wanting and anticipation."
cortisol: "The body's main stress hormone, and part of the natural rhythm that helps you wake in the morning."

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD PLAN 2026-09-05, PHASE 1 LAYER B — a written line for every molecule.
#
# Until 2026-09 only the 59 roamable molecules above had one, so 439 pages fell
# back to Wikidata's description, which for 292 of them is the string "chemical
# compound". These lines are written from the STRUCTURED RECORD ONLY (name,
# synonyms, formula, family, bucket, functional groups, GHS, LD50, foods, hooks,
# Wikidata description). No Wikipedia prose. Same rules as the block above, plus:
# say what it is and one concrete place a reader meets it; for a medicine, its
# class and what it treats in one clause and nothing more; for a hazard, one
# factual clause. Never advice, never a dose.
#
# Ordered by Wikipedia pageviews (most-sought first) and written in batches of
# 100 so a reviewer can read a diff.
# ── batch 1 of 5 ──────────────────────────────────────────────────────────────
acetaminophen: "The pain and fever reliever sold as Tylenol and Panadol, and the most-visited page on MoleculeFinder. Outside the US it is usually called paracetamol."
water: "The one molecule everything else on this site dissolves in, freezes in, or is carried by. Two hydrogens and an oxygen, bent at about 104 degrees."
diphenhydramine: "The antihistamine in Benadryl, used for allergy symptoms and, because it causes drowsiness, in nighttime sleep aids."
ibuprofen: "The anti-inflammatory painkiller sold as Advil and Motrin, one of the handful of drugs most households keep in a cabinet."
cetirizine: "The non-drowsy allergy antihistamine sold as Zyrtec, taken for hay fever and hives."
monosodium-glutamate: "MSG, the sodium salt of glutamic acid and the purest form of savory taste. It is what the tongue is detecting when food reads as umami."
omeprazole: "A proton pump inhibitor that reduces stomach acid production, sold as Prilosec for heartburn and reflux."
aspirin: "Acetylsalicylic acid, the original synthetic painkiller, made by acetylating the willow-bark compound salicylic acid in 1897."
sodium-bicarbonate: "Baking soda. It releases carbon dioxide when it meets an acid, which is why it lifts a cake and why it fizzes in a glass of vinegar."
hydrogen-peroxide: "The pale blue liquid sold as a 3 percent solution for cleaning cuts and bleaching hair. It breaks down into water and oxygen, which is the fizzing."
ammonia: "The sharp, eye-watering smell of window cleaner and cat litter, and one of the most-manufactured chemicals on earth because it becomes fertilizer."
naproxen: "A longer-acting anti-inflammatory painkiller sold as Aleve, used for pain, fever, and inflammation."
nitrous-oxide: "Laughing gas, used as a dental anesthetic and as the propellant that whips cream out of a canister."
dextromethorphan: "The cough suppressant marked DM on cold medicine boxes, related to morphine in structure but not in its effect on pain."
nicotine: "The stimulant alkaloid the tobacco plant makes as an insecticide, and the reason tobacco and vaping products are habit-forming."
vitamin-b12: "Cobalamin, the only vitamin built around a cobalt atom. It comes almost entirely from animal foods, which is why it is the vitamin vegans watch."
carbon-dioxide: "The gas you exhale, the fizz in a soda, and the molecule plants pull out of the air to build themselves."
urea: "The body's way of packaging nitrogen for disposal in urine. Its 1828 synthesis from inorganic salts was the first proof that life's molecules obey ordinary chemistry."
glucose: "Blood sugar. The molecule nearly every cell in your body burns for energy, and the unit that starch, cellulose, and table sugar are built from."
testosterone: "The main androgen, made mostly in the testes and in smaller amounts by the ovaries and adrenal glands. It drives muscle, bone, and hair development."
pseudoephedrine: "The decongestant in Sudafed, kept behind the pharmacy counter in the US because it can be converted into methamphetamine."
tetrahydrocannabinol: "THC, the compound in cannabis responsible for the high. It is a terpenoid, structurally closer to a pine resin than to any classic drug."
quinine: "The bitter alkaloid of cinchona bark that gives tonic water its taste, and the compound that made gin and tonic a colonial habit."
magnesium-glycinate: "Magnesium bound to two glycine molecules, a form sold as a supplement because the amino acid carrier makes it gentler on the stomach than magnesium oxide."
isopropyl-alcohol: "Rubbing alcohol. The 70 percent solution in a first aid kit and the solvent that cleans electronics without leaving a film."
formaldehyde: "The simplest aldehyde, the smell of a biology lab, and the preservative in embalming fluid. It is also a normal trace product of your own metabolism."
sodium-chloride: "Table salt. Sodium and chloride ions in a cubic lattice, and the only rock people eat on purpose."
oxytocin: "A nine-amino-acid hormone released during birth, breastfeeding, and touch, which is why it gets called the bonding hormone."
glycerol: "The sweet, syrupy backbone that three fatty acids hang from in every fat. On its own it keeps toothpaste, frosting, and skin cream from drying out."
methanol: "Wood alcohol. Chemically the smallest alcohol and industrially useful, but the body converts it into formic acid, which is why it is poisonous to drink."
aspartame: "The sweetener in blue packets and most diet sodas, about 200 times sweeter than sugar. It is a dipeptide, so it carries a phenylalanine warning label."
nicotinamide-adenine-dinucleotide: "NAD, the electron shuttle at the center of metabolism. Nearly every reaction that extracts energy from food hands its electrons to this molecule."
insulin: "The pancreatic hormone that tells cells to take glucose out of the blood, and the first human protein ever made by genetically engineered bacteria."
taurine: "An amino sulfonic acid abundant in the heart and retina, and the ingredient energy drinks put on the front of the can."
acetone: "Nail polish remover, and the solvent smell of a hardware store. Your own body makes it in small amounts when it burns fat for fuel."
cholesterol: "The waxy sterol every animal cell membrane is stiffened with, and the starting material your body builds vitamin D and the sex hormones from."
coenzyme-q10: "Ubiquinone, the carrier that ferries electrons along the inner membrane of your mitochondria. Sold as a supplement under the CoQ10 name."
allura-red-ac: "Red 40, the most-used red food dye in the United States. It colors sports drinks, candy, and breakfast cereal."
erythritol: "A sugar alcohol about 70 percent as sweet as sugar that the body absorbs and excretes largely unchanged, which is why it carries almost no calories."
famotidine: "A stomach acid reducer sold as Pepcid. It blocks the histamine receptor that tells the stomach lining to secrete acid."
loratadine: "The non-drowsy allergy antihistamine sold as Claritin, taken for hay fever and hives."
calcium-carbonate: "Chalk, limestone, eggshell, and seashell, all the same compound. Ground up, it is the calcium in an antacid tablet and the white in white paint."
sucrose: "Table sugar: one glucose joined to one fructose. It is the reference point the whole sweetness scale is measured against, at exactly 1 times sweet."
sodium-hypochlorite: "Household bleach. In water it releases hypochlorous acid, which destroys the pigments in a stain and the proteins in a microbe."
cannabidiol: "CBD, the cannabis compound that is not intoxicating, sold in oils and gummies and approved as a prescription drug for two rare seizure disorders."
fexofenadine: "The non-drowsy allergy antihistamine sold as Allegra. It was developed as the safer replacement for terfenadine."
sucralose: "The sweetener in yellow packets, sold as Splenda. It is table sugar with three chlorine atoms swapped in, which makes it 600 times sweeter and indigestible."
ephedrine: "A stimulant alkaloid from the ephedra plant, used as a decongestant and bronchodilator. Its sale is restricted in many countries."
camphor: "The penetrating smell of Vicks VapoRub and mothballs, tapped from the camphor laurel tree and now mostly made from turpentine."
propylene-glycol: "The carrier liquid in vape juice, fog machines, and many liquid medicines. It holds water, so it keeps things moist without being sweet."
norepinephrine: "Noradrenaline. Both a hormone and a neurotransmitter, released in the fight-or-flight response to raise heart rate and sharpen attention."
loperamide: "The antidiarrheal sold as Imodium. It is an opioid that acts on the gut but barely reaches the brain."
magnesium-sulfate: "Epsom salt, the bitter crystal dissolved in a bath. It is also what makes a hard-water stain and, in agriculture, a magnesium fertilizer."
doxylamine: "A sedating antihistamine used as an over-the-counter sleep aid and, combined with vitamin B6, for nausea in pregnancy."
xylitol: "The sugar alcohol in sugar-free gum, as sweet as sugar but not fermentable by mouth bacteria, which is why dentists like it. It is toxic to dogs."
theanine: "An amino acid found almost nowhere but tea leaves, credited with the calm, focused quality of a cup of green tea."
potassium-chloride: "The main ingredient in salt substitutes like NoSalt, used to cut sodium. It tastes salty with a metallic, slightly bitter edge."
folic-acid: "Vitamin B9, needed to build DNA. It is added to flour in many countries because a shortage early in pregnancy causes neural tube defects."
glutathione: "The body's master antioxidant, a small peptide of three amino acids that your liver uses to neutralize reactive molecules and process drugs."
acetylcholine: "The first neurotransmitter ever identified. It is the signal every nerve uses to tell a muscle to contract, including your diaphragm."
thiamine: "Vitamin B1. Its absence causes beriberi, the disease that appeared when milling stripped the husk off rice and took the vitamin with it."
nitric-oxide: "A gas your blood vessel linings release to make themselves relax and widen. Nitroglycerin and Viagra both work through this molecule."
oxalic-acid: "The sharp, chalky compound in rhubarb leaves, spinach, and star fruit. It binds calcium, which is why it forms the most common kind of kidney stone."
bilirubin: "The yellow-orange pigment left over when worn-out red blood cells are broken down. It is what makes a bruise turn yellow and what makes jaundice yellow."
chitin: "The tough polymer that makes up insect shells, crab shells, and fungal cell walls. After cellulose it is the second most abundant biopolymer on earth."
biotin: "Vitamin B7, sold in high doses as a hair and nail supplement. Raw egg white blocks its absorption, which is how it was discovered."
menthol: "The cold feeling of peppermint, chewing gum, and cough drops. It does not lower the temperature, it opens the same nerve channel that real cold does."
nicotinamide: "The amide form of vitamin B3, used in skin creams as niacinamide. Unlike niacin it does not cause the flushing that a large dose of B3 can bring on."
clotrimazole: "An antifungal sold as Lotrimin and Canesten, used on athlete's foot, ringworm, and yeast infections."
berberine: "The bright yellow alkaloid of goldenseal and barberry root, used for centuries as a dye and now sold widely as a supplement."
sodium-nitrite: "The curing salt that keeps bacon, ham, and hot dogs pink and blocks botulism. In cured meat it can form nitrosamines, which is why its use is limited."
bismuth-subsalicylate: "The pink liquid in Pepto-Bismol, taken for upset stomach and diarrhea. The bismuth can temporarily turn the tongue and stool black."
deet: "The active ingredient in most insect repellents. It does not kill mosquitoes, it jams the receptors they use to smell you."
phenylephrine: "The decongestant that replaced pseudoephedrine on open pharmacy shelves, and the one US regulators concluded does not work when swallowed."
histamine: "The molecule your immune cells dump during an allergic reaction, causing the itch, the swelling, and the runny nose that antihistamines are named for."
estradiol: "The main estrogen, made mostly in the ovaries. It drives the menstrual cycle and, along with testosterone, is one of the two headline sex hormones."
phenylalanine: "An essential amino acid from ordinary protein food, and the raw material your body builds tyrosine, dopamine, and adrenaline from."
progesterone: "The hormone that prepares and maintains the uterine lining after ovulation, and the one a pregnancy test's cousin, an ovulation test, is timed against."
phosphoric-acid: "The tartness in cola, and the reason a can of dark soda tastes sharp rather than merely sweet. Industrially it is also a rust converter."
calcium-chloride: "The salt spread on winter roads that melts ice well below the point where rock salt gives up. In food it firms up canned vegetables and tofu."
ethyl-acetate: "The smell of nail polish remover and pear drops, and the solvent used to strip caffeine out of coffee beans in the naturally decaffeinated process."
fructose: "Fruit sugar, the sweetest of the common sugars. Half of table sugar and most of high-fructose corn syrup is this molecule."
uric-acid: "The end of the line for purines from food and worn-out DNA. When it crystallizes in a joint it causes gout, classically in the big toe."
ethylene: "The plant hormone that ripens fruit. One ripe banana releases enough of it to ripen everything else in the bowl, which is the science behind the paper bag trick."
choline: "An essential nutrient found in egg yolks and liver, used to build cell membranes and to make the neurotransmitter acetylcholine."
dimenhydrinate: "The motion sickness medicine sold as Dramamine, used before a boat or car trip. It is diphenhydramine paired with a mild stimulant."
guaifenesin: "The expectorant in Mucinex and many cough syrups, taken to loosen chest congestion."
lysine: "An essential amino acid your body cannot make. Grains are short of it and beans are rich in it, which is why the two are eaten together the world over."
potassium-iodide: "The iodine added to table salt to prevent goiter, and the tablet stockpiled near nuclear plants to saturate the thyroid in an emergency."
dihydrotestosterone: "DHT, a more potent androgen the body makes from testosterone. It is the hormone behind male pattern baldness and prostate growth."
creatinine: "The waste product muscles make from creatine at a steady daily rate. Because the rate is steady, its level in blood is the standard test of kidney function."
arginine: "An amino acid from protein food and the direct source of nitric oxide, the molecule that widens blood vessels."
inulin: "The soluble fiber in chicory root, onions, and Jerusalem artichokes. Human enzymes cannot digest it, so gut bacteria ferment it instead."
vasopressin: "Antidiuretic hormone, the signal that tells the kidneys to hold on to water. Alcohol suppresses it, which is why drinking makes you urinate more."
riboflavin: "Vitamin B2, the pigment that makes a B-complex vitamin bright yellow and, taken in excess, turns urine fluorescent yellow-green."
chlorphenamine: "A sedating antihistamine, better known in the US as chlorpheniramine, found in combination cold and allergy tablets."
ammonium-chloride: "The salty, tongue-numbing bite of Nordic salmiakki liquorice. In industry it is the electrolyte paste inside a classic dry cell battery."
carmine: "The deep red food dye made from crushed cochineal insects. It colors yogurt, lipstick, and Campari, and it is why some products are not vegan."
curcumin: "The yellow of turmeric, and the pigment that stains a wooden spoon. It is also a traditional dye and a pH indicator that turns red in alkali."
inositol: "A sugar-shaped molecule your cells use to build the signaling lipids in their membranes. It was once called vitamin B8 before it was found the body makes its own."

# ── batch 2 of 5 ──────────────────────────────────────────────────────────────
saccharin: "The oldest artificial sweetener, sold in pink packets since 1879. About 300 times sweeter than sugar, with a metallic aftertaste at higher concentrations."
solanine: "The bitter glycoalkaloid a potato makes when it greens in the light. It is concentrated in the skin and sprouts, which is why cooks cut those away."
butyric-acid: "The smell of vomit and rancid butter, and also the compound your gut bacteria make from fiber to feed the cells lining your colon."
tyrosine: "The amino acid your body builds dopamine, adrenaline, thyroid hormone, and melanin from. It comes from ordinary protein food and from phenylalanine."
lactose: "Milk sugar, glucose joined to galactose. Most adults worldwide stop making the enzyme that splits it, which is what lactose intolerance is."
sorbitol: "The sugar alcohol in sugar-free gum and diet candy. It is poorly absorbed, which is why the label warns that excess may have a laxative effect."
coumarin: "The smell of fresh-cut hay, sweet clover, and tonka bean. It is banned as a food additive in the US because high doses damage the liver in animals."
lithium-orotate: "Lithium paired with orotic acid and sold as a supplement, at a tiny fraction of the lithium in the prescription mood stabilizer lithium carbonate."
quercetin: "A flavonoid pigment in onion skins, capers, and apple peel, and one of the most common polyphenols in an ordinary diet."
sodium-nitrate: "Chile saltpeter, the original curing salt for meat and, before synthetic ammonia, the world's main nitrogen fertilizer and gunpowder oxidizer."
safrole: "The root beer and sassafras aroma, banned as a food additive in 1960. It is also a precursor to MDMA, so its sale is watched."
benzoic-acid: "A preservative found naturally in cranberries and cinnamon and added to sodas and pickles to stop yeast and mold from growing."
glutamic-acid: "The most abundant excitatory neurotransmitter in the brain, and the amino acid whose sodium salt, MSG, tastes savory."
vanillin: "The single molecule that carries the smell of vanilla. Most of the world's supply is made from wood pulp or petrochemicals, not from the orchid pod."
oleic-acid: "The monounsaturated fat that makes up most of olive oil, and the reason olive oil stays liquid in the fridge where butter goes hard."
glycogen: "The branched chain of glucose your liver and muscles store sugar as. Running it down is what carb-loading before a race is meant to prevent."
acesulfame-potassium: "Ace-K, a sweetener about 200 times sweeter than sugar. It is usually blended with sucralose or aspartame because each masks the other's aftertaste."
potassium-bitartrate: "Cream of tartar, the acid crystal that forms on the inside of a wine barrel. In a kitchen it stabilizes egg whites and keeps sugar from crystallizing."
sodium-benzoate: "A preservative in soft drinks and salad dressings. Combined with vitamin C in the same bottle it can slowly form traces of benzene."
purine: "The two-ring skeleton behind adenine, guanine, caffeine, and uric acid. A purine-rich diet is the one gout sufferers are told to watch."
oxymetazoline: "The nasal spray decongestant in Afrin. It narrows blood vessels in the nose, and using it for more than a few days causes rebound congestion."
amygdalin: "The cyanide-releasing compound in apricot kernels and bitter almonds, marketed under the name laetrile as a cancer cure it was never shown to be."
brilliant-blue-fcf: "Blue 1, the blue in sports drinks and blue raspberry candy. Very little is absorbed, so a large amount tints the stool blue-green."
mannitol: "A sugar alcohol found in seaweed and mushrooms, used as a dusting powder on chewing gum and, in medicine, to draw water out of swollen tissue."
cysteine: "The amino acid whose sulfur atoms form the disulfide bridges that hold a protein's shape. It is what a perm breaks and re-forms in hair."
esomeprazole: "The single-mirror-image version of omeprazole, sold as Nexium. It reduces stomach acid production for heartburn and reflux."
cyanocobalamin: "The stable, cheap form of vitamin B12 used in supplements and fortified foods. The body converts it into the two forms it actually uses."
sodium-acetate: "The salt behind salt-and-vinegar crisps, and the compound in a reusable hand warmer that crystallizes and gives off heat when you click the disc."
dehydroepiandrosterone: "DHEA, the most abundant steroid in the human bloodstream and the raw material the body converts into testosterone and estrogen."
glucosamine: "An amino sugar in cartilage, sold as a joint supplement and usually made from shellfish shells."
linoleic-acid: "The essential omega-6 fat your body cannot make, abundant in sunflower, corn, and soybean oil."
magnesium-oxide: "The cheapest magnesium supplement and a strong antacid. Poorly absorbed, so much of it stays in the gut and acts as a laxative."
astaxanthin: "The red-pink pigment that makes salmon, shrimp, and flamingos their color. Farmed salmon is fed it to match the wild fish."
nicotinamide-mononucleotide: "NMN, one step away from NAD in the cell, sold as a supplement on the strength of NAD's role in metabolism and aging research."
bicarbonate: "The buffer that keeps your blood at pH 7.4. Lungs adjust the carbon dioxide side of it and kidneys adjust this side."
butylated-hydroxytoluene: "BHT, the antioxidant added to cereal packaging and processed fats to stop them going rancid."
benzoyl-peroxide: "The acne treatment that kills the bacteria in a pore by releasing oxygen. It bleaches fabric, which is why it ruins pillowcases and towels."
glucagon: "Insulin's opposite number from the pancreas: the hormone that tells the liver to release stored glucose when blood sugar falls."
methylsulfonylmethane: "MSM, a sulfur compound found in small amounts in green vegetables and sold as a joint supplement. It is the oxidized cousin of DMSO."
stearic-acid: "The saturated fat that makes beef tallow and cocoa butter solid, and the compound that gives a bar of soap and a candle their body."
methionine: "An essential sulfur-containing amino acid, and the one every protein starts with when a ribosome begins translating."
methyl-salicylate: "Oil of wintergreen, the smell of muscle rubs like Bengay and of root beer. It is chemically close to aspirin and absorbs through skin."
tartrazine: "Yellow 5, the yellow in mustard, soft drinks, and macaroni cheese. It carries a label warning in the EU for its possible effect on children's attention."
sodium-metabisulfite: "The sulfite that preserves dried fruit, wine, and shrimp. It is the reason a wine bottle says contains sulfites, and it can trigger asthma."
glutamine: "The most abundant free amino acid in blood and muscle, and the fuel gut and immune cells prefer over glucose."
indole: "Faecal in concentration and floral when dilute. Jasmine and orange blossom absolutes both contain it, which is what gives them their animal edge."
polysorbate-80: "The emulsifier that keeps ice cream smooth and stops the oil separating in a salad dressing or a vaccine suspension."
aldosterone: "The adrenal hormone that tells the kidneys to keep sodium and let go of potassium, which is how the body defends its blood pressure."
maltitol: "The sugar alcohol used to make sugar-free chocolate, because it melts and behaves in the mouth much like real sugar."
lycopene: "The red of tomatoes, watermelon, and pink grapefruit. Cooking a tomato in oil makes it easier for the body to absorb."
leucine: "A branched-chain amino acid and the one that most directly switches on muscle protein synthesis, which is why it heads the BCAA label."
lipoic-acid: "A sulfur-containing cofactor your mitochondria need to burn pyruvate, and one of the few antioxidants that works in both water and fat."
benzaldehyde: "The smell of almond extract, marzipan, and cherry candy. It is the harmless part of what bitter almonds release when crushed."
pantothenic-acid: "Vitamin B5, the building block of coenzyme A. Its name comes from the Greek for everywhere, because it is in nearly every food."
eugenol: "The smell and numbing bite of clove. Dentists have used clove oil on toothache for centuries because of it."
magnesium-citrate: "Magnesium bound to citric acid, absorbed better than the oxide form. In larger amounts it is the bowel preparation drunk before a colonoscopy."
thujone: "The compound in wormwood blamed for absinthe's supposed madness, though the alcohol was almost certainly the real culprit. It is also in sage and tansy."
benzyl-alcohol: "A mild floral solvent found in jasmine and ylang-ylang, used as a preservative in cosmetics and injectable medicines."
magnesium-chloride: "The magnesium salt in nigari, the seawater extract that sets soy milk into tofu. It is also a road de-icer and a dust suppressant."
potassium-sorbate: "The mold inhibitor in cheese, wine, and baked goods, and one of the most widely used food preservatives in the world."
palmitic-acid: "The most common saturated fat in the human body and in the food supply, and the main fat in palm oil, which is where the name comes from."
iron-ii-sulfate: "Ferrous sulfate, the standard iron tablet for anemia and the iron added to fortified flour and cereal."
bisacodyl: "A stimulant laxative sold as Dulcolax, which works by prompting the muscles of the bowel wall to contract."
adenine: "One of the four letters of DNA, the A in the genetic code. It also sits at the heart of ATP, the cell's energy currency."
chitosan: "Chitin with its acetyl groups stripped off, made from crab and shrimp shells and used in wound dressings, water treatment, and seed coatings."
spermidine: "A polyamine first isolated from semen, hence the name, and found in wheat germ, aged cheese, and soybeans. Cells need it to grow and recycle themselves."
acetyl-coa: "The junction of metabolism. Sugar, fat, and protein all converge on this molecule before their carbon enters the citric acid cycle to be burned."
magnesium-hydroxide: "Milk of magnesia, taken as an antacid at small doses and as a laxative at larger ones. It is also the white filler in some deodorants."
proline: "The one amino acid whose side chain loops back onto its own backbone, which kinks a protein chain. Collagen is unusually full of it."
galactose: "The other half of milk sugar. Babies split lactose into this and glucose, and a rare inability to process it is screened for at birth."
meclizine: "The antihistamine sold as Bonine and in Dramamine Less Drowsy, taken for motion sickness and vertigo."
alanine: "The simplest amino acid after glycine, and the form muscle uses to ship nitrogen to the liver during hard exercise."
citrulline: "An amino acid first isolated from watermelon, hence the name from Citrullus. The body turns it into arginine and then nitric oxide."
docosahexaenoic-acid: "DHA, the long omega-3 fat that makes up a large share of the brain and the retina. Oily fish and algae are the dietary sources."
maltose: "Malt sugar, two glucoses joined. It is what starch becomes when it is broken down, which is the sweetness in malted barley and in beer wort."
methylcobalamin: "The form of vitamin B12 the body uses directly in the methylation cycle, sold as an alternative to cyanocobalamin in supplements."
cannabigerol: "CBG, the cannabis compound that the plant converts into THC and CBD as it matures, so mature plants contain very little of it."
leptin: "The hormone fat cells release to tell the brain how much fat is stored. Its discovery in 1994 rewrote how appetite was understood."
aspartic-acid: "An amino acid and an excitatory signal in the brain, and one of the two amino acids that make up aspartame."
histidine: "An essential amino acid and the direct source of histamine, the molecule behind allergic itching and stomach acid release."
carboxymethyl-cellulose: "The thickener that stops ice cream growing crystals and keeps toothpaste from separating. It is cellulose made water-soluble."
tocopherol: "The family of compounds sold as vitamin E, added to oils and cosmetics because it stops fats from oxidizing and turning rancid."
propionic-acid: "The mold inhibitor in packaged bread, and one of the short-chain fatty acids your gut bacteria make from fiber."
citicoline: "A choline-carrying molecule the body uses to build cell membranes, sold as a nootropic supplement and used as a stroke medicine in some countries."
guanine: "The G of the genetic code, and the crystal that makes fish scales and some nail polishes iridescent."
ghrelin: "The hunger hormone, released by an empty stomach to tell the brain it is time to eat. It rises before meals and falls after them."
beta-carotene: "The orange of carrots and sweet potatoes, and the form of vitamin A plants supply. Eating a great deal of it can tint the skin orange."
arachidonic-acid: "The omega-6 fat stored in cell membranes and released to make the prostaglandins behind inflammation, fever, and pain. Aspirin acts on that pathway."
succinic-acid: "A step in the citric acid cycle and the sour note in unripe fruit, aged wine, and cheese. Amber gives off its fumes when heated, hence its old name."
ketotifen: "An antihistamine used mostly as an eye drop for itchy allergic eyes, sold as Zaditor and Alaway."
s-adenosyl-methionine: "SAMe, the body's universal methyl donor. Nearly every methylation reaction in a cell, from DNA to neurotransmitters, takes its methyl group from this."
linalool: "The floral, slightly citrus note of lavender and coriander seed. It is one of the most common fragrance ingredients in soap and shampoo."
tryptamine: "The bare skeleton that serotonin, melatonin, and psilocybin are all built on, found in trace amounts in plants and in the body."
trisodium-citrate: "The salt that gives club soda its round taste and keeps donated blood from clotting. In cooking it makes processed cheese melt smoothly."
deoxyribose: "The five-carbon sugar in the backbone of DNA. The missing oxygen the name refers to is what makes DNA more stable than RNA."
cinnamaldehyde: "The molecule that is cinnamon. It is most of the essential oil of cassia bark and the reason cinnamon feels warm as well as smelling sweet."
tetrahydrocannabinolic-acid: "What THC is in the raw plant. It is not intoxicating until heat drives off a carbon dioxide, which is why cannabis is smoked, vaped, or baked."
allulose: "A rare sugar found in figs and raisins that tastes like sugar and browns like sugar, but passes through the body largely unmetabolized."
pyruvic-acid: "The end of glycolysis. Every glucose molecule your cells break down becomes two of these, which then either enter the mitochondria or become lactate."
calcitriol: "The fully activated form of vitamin D, made in the kidneys. It is the hormone that actually tells the gut to absorb calcium."

# ── batch 3 of 5 ──────────────────────────────────────────────────────────────
docusate: "A stool softener sold as Colace. It is a detergent, so it lets water mix into stool rather than stimulating the bowel."
pyridoxine: "Vitamin B6, needed by more enzymes than any other vitamin, especially the ones that build and break down amino acids."
cimetidine: "The first blockbuster stomach acid reducer, sold as Tagamet. It has been largely replaced by famotidine, which interferes with fewer other drugs."
ribose: "The five-carbon sugar in the backbone of RNA and in ATP. Its deoxy version, with one oxygen removed, is the sugar in DNA."
squalene: "The oil your skin secretes to stay waterproof, and the compound your body builds cholesterol from. Shark liver and olive oil are the commercial sources."
calcium-oxalate: "The crystal that forms the most common kind of kidney stone, and the needle-shaped grit in raw rhubarb leaves and unripe pineapple."
trimethylamine-n-oxide: "TMAO, what fish use to stop deep-sea pressure crushing their proteins. Bacteria break it down after death, which is the smell of stale fish."
estradiol-medication: "The prescription form of the body's main estrogen, used in hormone therapy and contraception."
sulforaphane: "The compound broccoli, kale, and Brussels sprouts release when chopped or chewed. It is the sharp, slightly sulfurous note in raw brassicas."
apigenin: "The flavonoid in chamomile, parsley, and celery, and one of the compounds credited with chamomile tea's reputation for calm."
aluminium-hydroxide: "The active ingredient in antacids like Amphojel, and the aluminium salt used as an adjuvant to boost the response to some vaccines."
isomalt: "The sugar alcohol pastry chefs pull and blow into sugar sculptures, because it resists browning and does not pick up moisture from the air."
thyroxine: "T4, the main thyroid hormone. It carries four iodine atoms, which is why iodized salt exists, and it sets the pace of metabolism."
lauric-acid: "The dominant saturated fat in coconut oil and palm kernel oil, and the fat that gives soap made from coconut its hard, quick lather."
uracil: "The U of RNA, taking the place thymine holds in DNA. The only difference is a missing methyl group."
erucic-acid: "The fat that traditional rapeseed oil was high in and that canola was bred to be low in. Canola is short for Canadian oil, low acid."
panthenol: "The alcohol form of vitamin B5 that shampoo and lotion labels call pro-vitamin B5. It holds water against the hair shaft and skin."
catechin: "The astringent flavonoid family in green tea, cocoa, and red wine that makes the mouth feel dry. Oxidizing them is what turns green tea into black tea."
putrescine: "One of the two molecules named for the smell of decaying flesh, though the body makes it in small amounts as a normal part of cell growth."
magnesium-carbonate: "Gym chalk. Climbers and gymnasts use it to dry their hands, and it doubles as an antacid and a caking agent in powdered food."
cyclic-adenosine-monophosphate: "The cell's most famous second messenger. When a hormone knocks at the outside of a cell, this is the molecule that carries the message inward."
lutein: "The yellow pigment concentrated in the macula of the eye, taken in from spinach, kale, and egg yolk. It is also what colours a chicken's skin yellow."
cyclizine: "An antihistamine used for motion sickness and nausea, sold as Marezine and included in some travel sickness tablets."
isoamyl-acetate: "The smell of banana and pear drops, and the alarm pheromone honeybees release when they sting."
nepetalactone: "The molecule in catnip that sends roughly two thirds of cats into a rolling, purring frenzy. It also repels mosquitoes."
myristicin: "The compound in nutmeg and mace responsible for the spice's strange effects in large amounts. Ordinary culinary quantities are far below that."
resiniferatoxin: "The most powerfully pungent compound known, from a Moroccan cactus-like spurge. It is roughly a thousand times hotter than pure capsaicin."
diacetyl: "The taste of butter, made naturally in fermentation. Inhaled as a vapour in flavouring plants it caused the lung disease nicknamed popcorn lung."
miconazole: "An antifungal in creams and powders for athlete's foot, jock itch, and yeast infections, sold as Monistat and Micatin."
ergocalciferol: "Vitamin D2, the plant and fungal form. Mushrooms exposed to ultraviolet light make it, which is why some are sold as vitamin D enhanced."
urolithin-a: "Not in food at all. Gut bacteria make it from the ellagitannins in pomegranates and walnuts, and only some people carry the bacteria that can."
homocysteine: "An amino acid that builds up when the body is short of B12, B6, or folate. Its blood level is used as a marker of that shortage."
amaranth-dye: "Red 2, banned as a food colouring in the United States in 1976 but still used in much of the rest of the world."
disodium-phosphate: "The salt that keeps evaporated milk from curdling and gives instant pudding its set. It is also a common water softener."
serine: "A non-essential amino acid the body builds from a step in glycolysis, and the backbone of the phospholipid phosphatidylserine in nerve membranes."
ammonium-carbonate: "Baker's ammonia, the leavening used before baking powder and still used in thin crisp cookies. It is also the original smelling salts."
thymol: "The antiseptic bite of thyme, and the active ingredient that gives Listerine mouthwash much of its sting."
trimethylamine: "The smell of rotting fish, of a fishing dock, and of some vaginal infections. People with the rare trimethylaminuria cannot break it down."
phytic-acid: "The phosphorus store in seeds, grains, and nuts. It binds iron and zinc, which is why soaking and sprouting improve mineral absorption."
epigallocatechin-gallate: "EGCG, the most abundant catechin in green tea and the compound most green tea extracts are standardized to."
sunset-yellow-fcf: "Yellow 6, the orange-yellow in fizzy orange drinks, snack cheese, and apricot jam."
retinal: "The light-sensitive form of vitamin A. A photon hitting this molecule in your retina bends it, and that bend is the first step of seeing."
triiodothyronine: "T3, the active thyroid hormone. The body makes most of it by stripping one iodine off T4 wherever it is needed."
phenylacetic-acid: "The honey-like sweet note in a small amount and something closer to a barnyard in a large one. It also occurs in the body as a phenylalanine breakdown product."
fumaric-acid: "A step in the citric acid cycle and, in the kitchen, the acid in sourdough bread mixes and powdered drinks, chosen because it does not absorb moisture."
isoleucine: "One of the three branched-chain amino acids on a BCAA label, essential in the diet and burned directly by muscle."
thymine: "The T of DNA. Ultraviolet light can fuse two neighbouring ones into a kink, which is the classic sunburn mutation."
sodium-bisulfite: "The sulfite that keeps cut apples and potatoes from browning and stops unwanted yeast in winemaking."
coenzyme-a: "The handle that metabolism grips a fatty acid or an acetyl group by. Its business end is a thiol built from vitamin B5."
pyridoxal-phosphate: "The working form of vitamin B6, the cofactor that over a hundred enzymes need to move nitrogen between amino acids."
threonine: "An essential amino acid, unusually abundant in mucus and in the antibodies that line the gut."
cyclamate: "A sweetener about 40 times sweeter than sugar, banned in the United States in 1970 but still widely used in Europe and Canada."
androstenedione: "The steroid the body converts into testosterone and estrogen. Sold as andro in the 1990s, it is now a controlled substance in the United States."
trimethylglycine: "Betaine, first isolated from sugar beet. The body uses it to donate methyl groups and to keep cells from shrivelling under salt stress."
cannabinol: "CBN, what THC slowly turns into as cannabis ages and oxidizes. Old stored cannabis is higher in it and lower in THC."
acetophenone: "The sweet, cherry-almond, slightly plastic note used in fake cherry and strawberry flavours and in perfumes."
methyl-cellulose: "Cellulose made water-soluble. It thickens milkshakes, holds a veggie burger together, and gels when heated rather than cooled."
cytosine: "The C of the genetic code. Sticking a methyl group on it is the main way a cell switches genes off without changing the DNA sequence."
skatole: "The molecule that makes faeces smell like faeces, formed when gut bacteria break down tryptophan. In tiny amounts it smells floral and is used in perfume."
beta-alanine: "The amino acid in the pre-workout tingle. It joins with histidine to make carnosine in muscle, and the tingle itself is harmless."
ammonium-bicarbonate: "Hartshorn, the leavening in Scandinavian and German Christmas cookies. It breaks down completely into gas, so it leaves no salty aftertaste."
trehalose: "Two glucoses joined in a way that lets tardigrades and resurrection plants survive drying out completely. Bakers use it because it browns less than sugar."
geraniol: "The smell of a rose and of citronella. It is both a fragrance ingredient and the active part of citronella insect repellent."
allopregnanolone: "A steroid the brain makes from progesterone that calms nerve activity. Its synthetic version is the first drug approved for postpartum depression."
hydroxocobalamin: "A form of vitamin B12 given by injection, and the antidote for cyanide poisoning because it binds cyanide and turns the patient briefly red."
pregnenolone: "The first steroid the body makes from cholesterol, and the ancestor of every other steroid hormone including cortisol, testosterone, and estrogen."
xanthine: "The core structure caffeine, theobromine, and theophylline are built on. The body also makes it on the way to producing uric acid."
tetrahydrocannabivarin: "THCV, a cannabis compound that differs from THC by two carbon atoms and behaves quite differently, especially at low amounts."
ambroxide: "The warm, musky base note that replaced ambergris in perfumery. It is made from clary sage rather than harvested from whales."
annonacin: "A compound in soursop and other custard apples. Guadeloupe's unusually high rate of atypical parkinsonism has been linked to eating the fruit."
cadaverine: "The other molecule named for the smell of decay, and part of what gives bad breath and bacterial vaginosis their odor."
caprylic-acid: "A medium-chain fat abundant in coconut oil and goat milk. It is the C8 in MCT oil and gives some cheeses their goaty note."
asparagine: "The amino acid first isolated from asparagus juice in 1806, the first amino acid ever isolated. Heated with sugar it forms acrylamide in fried food."
hydrogen-sulfide: "The smell of rotten eggs and of a hot spring. Your nose detects it at extraordinarily low amounts but goes numb to it at dangerous ones."
flavin-adenine-dinucleotide: "FAD, built from vitamin B2 and one of the two main electron carriers in metabolism. It is what gives riboflavin its yellow."
calcitonin: "The thyroid hormone that lowers blood calcium, the opposite number to parathyroid hormone. Salmon calcitonin is more potent than the human version."
erythrosine: "Red 3, the pink in glacé cherries and some pink candy. The United States moved to revoke its use in food in 2025."
benzyl-benzoate: "A sweet balsamic fixative in perfume, and the active ingredient in a long-standing lotion treatment for scabies and lice."
agmatine: "Made from arginine and found in fermented foods and the brain, where it appears to act as a neurotransmitter of its own."
substance-p: "The neuropeptide nerve endings release to report pain and itch. Capsaicin works partly by exhausting a nerve's supply of it."
caryophyllene: "The peppery, woody note of black pepper, cloves, and hops. It is unusual among terpenes in binding a cannabinoid receptor."
cinnamic-acid: "The backbone plants build lignin, flavonoids, and coumarins from. It carries a faint honey-cinnamon smell of its own."
butylated-hydroxyanisole: "BHA, the antioxidant added to fats, cereals, and chewing gum to stop them going rancid."
eicosapentaenoic-acid: "EPA, the other long omega-3 alongside DHA. It is the one most associated with the anti-inflammatory side of fish oil."
palmitoylethanolamide: "A fatty molecule the body makes in tissues under stress, chemically a cousin of the endocannabinoid anandamide. Egg yolk and peanuts contain traces."
ubiquinol: "The reduced, electron-carrying form of CoQ10, and the form most supplements now advertise because the body does not have to convert it."
alpha-linolenic-acid: "The plant omega-3 in flaxseed, chia, and walnuts. The body converts only a small fraction of it into the longer EPA and DHA."
potassium-bicarbonate: "The low-sodium leavening in salt-free baking powder, and the powder inside many dry chemical fire extinguishers."
huperzine-a: "An alkaloid from Chinese club moss sold as a memory supplement. It blocks the enzyme that clears acetylcholine, the same target as some Alzheimer drugs."
acetylcarnitine: "The form of carnitine that crosses into the brain, sold as ALCAR. Carnitine's job is to carry fatty acids into mitochondria to be burned."
zinc-sulfate: "The zinc in supplements, in lozenges sold for colds, and in the zinc added to fertilizer for crops on zinc-poor soil."
valine: "The third branched-chain amino acid. Swapping one valine for a glutamic acid in haemoglobin is the single change that causes sickle cell disease."
amylose: "The straight-chain half of starch. Rice high in it cooks up dry and separate; rice low in it, like sushi rice, cooks sticky."
benzophenone: "A ultraviolet absorber used in sunscreens and to stop plastic packaging from letting light spoil the food inside."
beta-hydroxy-beta-methylbutyric-acid: "HMB, what the body makes from a small share of the leucine it breaks down. It is sold as a supplement aimed at slowing muscle loss."
calcium-gluconate: "The gentle calcium salt used in supplements and in the gel kept in labs to treat hydrofluoric acid burns."
rutin: "Quercetin with a sugar attached, found in buckwheat, capers, and the white pith of citrus. It is the reason buckwheat tea is faintly bitter."
allantoin: "A soothing compound in comfrey root and snail mucin, added to skin creams. Most mammals except humans make it from uric acid."
juglone: "The compound black walnut roots leak into the soil to poison competing plants, which is why tomatoes will not grow near a walnut tree."
pyrroloquinoline-quinone: "PQQ, a bacterial cofactor found in trace amounts in fermented soy and human milk, sold as a mitochondrial supplement."

# ── batch 4 of 5 ──────────────────────────────────────────────────────────────
guanosine-triphosphate: "GTP, the energy currency ATP's quieter twin. Protein synthesis and cell signalling run on it rather than on ATP."
tricalcium-phosphate: "The mineral bone and tooth enamel are largely made of, and the anti-caking agent that keeps powdered spices and table salt pouring freely."
carnosine: "A small peptide concentrated in muscle and brain, made from beta-alanine and histidine. Meat is the only real dietary source."
adenosine-diphosphate: "ATP with one phosphate spent. Recharging it back to ATP is what your mitochondria do all day."
gallic-acid: "The astringent phenol in oak galls, tea, and wine. Mixed with iron it makes iron gall ink, the ink most of the medieval world was written in."
bradykinin: "The peptide that widens blood vessels and causes swelling and pain in inflammation. It is also the cause of the dry cough some blood pressure drugs bring on."
methyl-anthranilate: "The smell of Concord grape, and the reason artificial grape flavour tastes nothing like a fresh table grape. It is also a bird repellent."
anethole: "The sweet liquorice-anise taste of fennel, star anise, and ouzo. It is barely soluble in water, which is why pastis turns cloudy when you add ice."
tert-butylhydroquinone: "TBHQ, the antioxidant that keeps frying oil and instant noodles from going rancid. It is one of the most effective preservatives for fats."
amylopectin: "The branched half of starch, and the part that digests fastest. Waxy corn and sticky rice are almost entirely made of it."
dipotassium-phosphate: "The buffer that stops non-dairy creamer curdling in hot coffee, and a common ingredient in isotonic sports drinks."
carvone: "The same molecule in two mirror images, and each smells completely different: one is spearmint, the other is caraway."
glycyrrhizin: "The sweetness of liquorice root, around 50 times sweeter than sugar. Eaten in quantity it raises blood pressure by mimicking aldosterone."
sodium-sulfite: "The oxygen scavenger that stops wine and dried fruit browning, and the fixer bath chemical of black and white photography."
valeric-acid: "The smell of old gym socks and of valerian root. Diluted enormously, its esters smell of apples instead."
nicotinamide-riboside: "NR, a form of vitamin B3 sold as an NAD-boosting supplement. It is found naturally in trace amounts in milk."
myrcene: "The earthy, hoppy, faintly mango note in hops, lemongrass, and cannabis, and one of the most abundant terpenes in beer."
selenocysteine: "The twenty-first amino acid, cysteine with selenium in place of sulfur. It sits at the business end of the enzymes that clean up oxidative damage."
synephrine: "The stimulant in bitter orange, sold in weight loss supplements after ephedra was banned. It is structurally close to ephedrine."
magnesium-stearate: "The lubricant that stops tablet powder sticking to the press. It is in a huge share of pills and capsules, at well under one percent."
chlorophyll-a: "The green of every leaf, and the molecule that catches sunlight and starts photosynthesis. Its magnesium atom sits where iron sits in haemoglobin."
guaiacol: "The core of smoke flavour. It is what wood smoke deposits on barbecue and smoked fish, and part of the smell of roasted coffee and whisky."
glycerophosphorylcholine: "Alpha-GPC, a choline-carrying molecule in milk and organ meat, sold as a nootropic and used as a prescription drug for dementia in some countries."
isoamyl-alcohol: "A fusel alcohol yeast makes alongside ethanol, and a big part of what makes whisky and rum smell of more than just alcohol."
diosmin: "A citrus flavonoid taken for varicose veins and haemorrhoids, mostly in Europe, usually paired with hesperidin."
silibinin: "The main active compound of milk thistle, and the basis of the intravenous drug used in Europe for death cap mushroom poisoning."
zeaxanthin: "Lutein's partner pigment in the macula of the eye, the yellow in corn, saffron, and orange peppers."
4-aminobenzoic-acid: "PABA, once used as the original sunscreen before it was found to stain clothes and irritate skin. Bacteria need it to make their own folate."
eucalyptol: "The cool camphor rush of eucalyptus oil, in mouthwash, chest rubs, and cough drops. It is the main compound in eucalyptus and a large part of rosemary."
adenosine-monophosphate: "One phosphate left on adenosine. When cells run low on energy this piles up, and a sensor reads it as the signal to start burning fat."
mesembrine: "The alkaloid in kanna, a South African succulent chewed traditionally for mood. It blocks serotonin reuptake, like some antidepressants."
phosphocreatine: "The instant battery in muscle. It hands a phosphate straight back to ADP for the first few seconds of a sprint, which is what creatine supplements build up."
cholecystokinin: "The gut hormone released when fat and protein arrive in the small intestine. It empties the gallbladder and tells the brain you are full."
n-acetylglucosamine: "The unit chitin and the joint lubricant hyaluronic acid are built from, and a sugar your body decorates its own proteins with."
dicalcium-phosphate: "The calcium in many supplements and the abrasive in toothpaste, where it scrubs plaque without scratching enamel."
caffeic-acid: "Named for coffee, where it is abundant, but present in nearly every plant. It is half of chlorogenic acid, the main polyphenol in a cup."
sodium-iodide: "The iodine source in some iodized salts and in the crystal detectors that turn gamma rays into visible flashes in medical scanners."
disodium-inosinate: "The savory booster added alongside MSG in instant noodles and crisps. On its own it tastes of little; together the two multiply."
prostaglandin-e2: "The signal behind fever, pain, and inflammation, made from arachidonic acid. Ibuprofen and aspirin work by blocking the enzyme that makes it."
potassium-citrate: "The potassium salt of citric acid, used to reduce acidity in soft drinks and, medically, to make urine less acidic and discourage stones."
azodicarbonamide: "The dough conditioner nicknamed the yoga mat chemical, since it also foams plastics. It is banned in bread in the EU and Australia."
9-methyl-beta-carboline: "A trace alkaloid found in coffee and cooked foods, part of the family that gives roasted foods some of their character."
sorbic-acid: "First isolated from rowan berries, hence the name from Sorbus. It is one of the most-used mould inhibitors in cheese, wine, and baked goods."
gluconic-acid: "What glucose becomes when it is gently oxidized. It occurs in honey and wine and is used as a mild acid and a mineral carrier in supplements."
ornithine: "The hub of the urea cycle, the loop that turns waste ammonia into urea for disposal. It is not used to build proteins."
monosodium-phosphate: "An acid phosphate used to control acidity in processed food and, paired with its disodium form, as a buffer in soft drinks and cheese."
methylglyoxal: "A reactive by-product of sugar metabolism, and the compound that gives manuka honey its unusual antibacterial rating."
luteolin: "A yellow flavonoid in celery, thyme, and green pepper. Its name comes from weld, the plant it was first extracted from as a dye."
ferulic-acid: "The compound that cross-links the cell walls of bran and holds a grain together. In skincare it is used to stabilize vitamin C serums."
magnesium-l-threonate: "A magnesium form sold specifically for the brain, on the grounds that the threonate carrier helps it cross into the central nervous system."
indigo-carmine: "Blue 2, made by sulfonating natural indigo. It colours some candies and is used medically as a dye to trace fluid in surgery."
carvacrol: "The hot, oregano bite of oregano and thyme oil, and one of the compounds behind oregano oil's antimicrobial reputation."
natamycin: "A mould inhibitor made by a soil bacterium, sprayed on the rind of cheese and the surface of sausage. It kills fungi but leaves bacteria alone."
biliverdin: "The green stage of haemoglobin breakdown, one enzymatic step before bilirubin. It is what makes a bruise turn green."
ergosterol: "The sterol in fungal cell membranes, where animals use cholesterol. Antifungal drugs target it, which is why they leave human cells alone."
cystine: "Two cysteines locked together by a sulfur bridge. It is what gives hair, nails, and hooves their toughness."
ergothioneine: "An unusual amino acid that only fungi and some bacteria can make. Mushrooms are the main dietary source, and human cells have a dedicated transporter for it."
myristic-acid: "The saturated fat named for nutmeg, and abundant in coconut and palm kernel oil. It is also the fat cells use to anchor certain proteins to membranes."
vasoactive-intestinal-peptide: "A gut and nerve peptide that relaxes smooth muscle and widens blood vessels, and one of the signals that sets the body clock in the brain."
piperonal: "The smell of heliotrope and cherry-vanilla, used in perfume and in the cherry note of some flavourings. It is derived from the same skeleton as safrole."
calcium-citrate: "The calcium supplement absorbed without stomach acid, which is why it is preferred by people taking acid reducers."
potassium-sodium-tartrate: "Rochelle salt, the crystal whose strong piezoelectric effect powered early record player cartridges and microphones."
ponceau-4r: "A red azo dye used in Europe and Asia in jellies, sausages, and soups. It is not permitted as a food colouring in the United States."
sodium-ferrocyanide: "The anti-caking agent in table salt. Despite the name, the cyanide is locked so tightly to iron that it is not released in the body."
thyrotropin-releasing-hormone: "The three-amino-acid signal from the hypothalamus that starts the thyroid chain of command, the smallest hormone of its kind."
thymoquinone: "The main active compound of black seed oil, from Nigella sativa, and the source of its sharp peppery smell."
calcium-acetate: "The calcium salt in canned-heat gel fuel, and a prescription binder taken with meals to trap phosphate in kidney disease."
chromium-iii-picolinate: "The chromium form used in supplements sold for blood sugar and appetite, and one of the most-studied and most-disputed mineral supplements."
pyrazine: "The ring at the heart of roasted flavour. Its relatives are what make roasted coffee, toasted bread, and green pepper smell as they do."
dihydroxyacetone: "DHA, the active ingredient in every sunless tanner. It reacts with amino acids in dead skin cells to make brown pigment, no sun needed."
choline-chloride: "The cheap, stable form of choline used to fortify animal feed and infant formula, and the largest-volume choline product made."
glucono-delta-lactone: "The slow-release acid used to set silken tofu and to acidify cured sausage without a starter culture, because it turns into acid only once dissolved."
estrone: "The weaker of the main estrogens and the dominant one after menopause, made largely in fat tissue rather than the ovaries."
anthranilic-acid: "The precursor plants and industry both build indigo dye from, and the starting point for the grape-scented methyl anthranilate."
mogroside-v: "The sweetness of monk fruit, around 250 times sweeter than sugar. The fruit itself is not particularly sweet until this compound is extracted."
pentadecylic-acid: "An odd-chain saturated fat found mostly in dairy fat, used as a blood marker of how much dairy someone eats."
salicin: "The willow bark compound the body converts into salicylic acid. Chewing willow bark for pain is the practice aspirin was engineered from."
genistein: "The main isoflavone in soy, shaped enough like estrogen to bind its receptors weakly, which is why soy is called a phytoestrogen source."
agaritine: "A naturally occurring hydrazine compound in common button mushrooms, largely destroyed by cooking and by storage."
acemannan: "The long sugar chain that makes aloe vera gel slippery, and the compound most of aloe's traditional uses are attributed to."
inositol-trisphosphate: "IP3, the messenger that opens the internal calcium stores of a cell. Nearly every hormone that works through calcium works through this."
betanin: "The deep red-purple of beetroot. Some people cannot fully break it down, which is why beets can turn urine pink."
androstenone: "The boar pheromone in truffle aroma and in human sweat. Roughly half of people cannot smell it at all, and the rest split between finding it musky or urinous."
zingerone: "The sweet, less pungent compound cooked or dried ginger contains, formed when gingerol loses its heat during heating."
oleuropein: "The bitterness of a fresh olive straight off the tree. Curing in brine or lye breaks it down, which is the whole point of curing olives."
sotolon: "Fenugreek, maple syrup, and aged sake all owe their smell to it. It is also the compound that makes some people's sweat smell of maple syrup after eating fenugreek."
raspberry-ketone: "The compound that gives raspberries their smell, and one of the most expensive natural flavour extracts by weight because raspberries contain so little."
p-menthane-3-8-diol: "PMD, the active compound in oil of lemon eucalyptus, and the only plant-derived repellent that public health agencies rank with DEET."
lugduname: "One of the sweetest compounds ever made, roughly 200,000 times sweeter than sugar. It is a laboratory curiosity, not a food ingredient."
beta-ionone: "The smell of violets, and famous because the nose fatigues to it within seconds, so the scent seems to come and go."
rebaudioside-a: "The best-tasting sweet compound in the stevia leaf, and the one most stevia products are purified to. About 250 times sweeter than sugar."
dihydrocapsaicin: "The second most abundant capsaicinoid in chili peppers, about as hot as capsaicin itself and part of what shapes a pepper's particular burn."
stevioside: "The most abundant sweet compound in stevia leaves, around 200 times sweeter than sugar but with a liquorice bitterness that rebaudioside A lacks."
nonivamide: "A capsaicinoid that occurs in trace amounts in peppers and is made synthetically in bulk. It is common in pepper sprays and in warming muscle rubs."
daidzein: "The other main soy isoflavone alongside genistein. Only some people carry the gut bacteria that convert it into the more active equol."
beta-santalol: "The molecule that is sandalwood. It is most of what makes sandalwood oil smell the way it does, and the reason the tree is so heavily poached."
phylloquinone: "Vitamin K1, the form in leafy greens. It is what blood clotting depends on, and the reason warfarin patients are told to keep their greens steady."
ethanethiol: "The smell added to natural gas so a leak can be noticed. It is one of the most detectable smells there is, at a few parts per billion."
dimethyl-disulfide: "The cabbage-and-onion note of cooked brassicas and rotting alliums, and a key part of the smell of a durian."
nordihydrocapsaicin: "The third capsaicinoid of chili peppers. It is milder and its heat fades faster, which is part of why different peppers burn differently."

# ── batch 5 of 5 ──────────────────────────────────────────────────────────────
alpha-pinene: "The smell of a pine forest and of fresh rosemary. It is the most widely distributed terpene in nature and the main component of turpentine."
dexpanthenol: "The single mirror image of panthenol that the body can actually use, the pro-vitamin B5 in wound creams and eye drops."
propionate: "The short-chain fatty acid your gut bacteria make from fibre and send to the liver, and the preservative form used in packaged bread."
homocapsaicin: "A minor capsaicinoid of chili peppers. It makes up only a small share of a pepper's heat but contributes to how that heat is shaped."
homodihydrocapsaicin: "A minor capsaicinoid known for a delayed, throat-catching burn that arrives later than capsaicin's and lasts longer."
iso-e-super: "The velvety, woody, almost-not-there note behind a huge share of modern perfume. Many people can barely smell it, which is the point."
11-cis-retinal: "The bent form of vitamin A that sits in your eye waiting for light. A photon straightens it, and that single motion is the start of vision."
allomatrine: "An alkaloid from Sophora root, a plant used in traditional Chinese medicine and studied as a source of insecticides."
mk-7: "The long-lasting form of vitamin K2, made by bacteria and richest in the fermented soybean dish natto."
calcium-beta-hydroxy-beta-methylbutyrate: "The calcium salt of HMB, the form sold in supplements aimed at preserving muscle in older adults and hard-training athletes."
yohimbic-acid: "A breakdown product of yohimbine, the alkaloid from West African yohimbe bark long sold as a stimulant and aphrodisiac."
sodium-fluoride: "The fluoride in toothpaste and in fluoridated tap water. It swaps into tooth enamel and makes the resulting mineral harder to dissolve in acid."
glycolic-acid: "The smallest alpha hydroxy acid, from sugar cane. Its small size lets it get through skin easily, which is why it is the workhorse of chemical peels."
endorphin: "The body's own opioids, released during hard exercise, pain, and laughter. The name is a contraction of endogenous morphine."
collagen: "The rope-like protein that makes up a third of the protein in your body. Skin, tendon, and bone are all built on a scaffold of it."
benfotiamine: "A fat-soluble version of vitamin B1 developed in Japan, absorbed better than thiamine itself and sold for nerve health."
albumin: "The most abundant protein in blood plasma. It keeps water inside blood vessels and ferries fatty acids, hormones, and many drugs around the body."
nuciferine: "The main alkaloid of the sacred lotus, found in the leaves and studied for its effects on dopamine receptors."
lecithin: "The fatty emulsifier from soy or egg yolk that keeps chocolate smooth and mayonnaise from splitting. It is a mixture, not a single compound."
gelatin: "Collagen boiled until its ropes unwind. It sets jelly, gives marshmallows their chew, and is the shell of most capsules."
pectin: "The plant fibre that sets jam. It is what holds plant cells to each other, and it is why some fruits jell readily and others need help."
guar-gum: "The thickener from guar bean, used to keep ice cream smooth and gluten-free dough workable. It swells enormously in water."
hemoglobin: "The iron-carrying protein that makes blood red and carries oxygen from lungs to tissue. One molecule ferries four oxygens at a time."
carrageenan: "The seaweed extract that keeps chocolate milk from separating and sets a vegan panna cotta. It is harvested from Irish moss and its relatives."
iodine: "The purple-vapour halogen the thyroid cannot work without, and the brown antiseptic tincture in a first aid kit."
sodium-lauryl-sulfate: "SLS, the detergent that makes shampoo, toothpaste, and dish soap foam. It is the most common cause of a foaming product irritating skin."
cellulose: "The most abundant organic polymer on earth: long chains of glucose that build every plant cell wall. Cotton is nearly pure cellulose."
fibrin: "The protein mesh that turns a blood clot solid. It is the net cast over platelets when a wound seals."
triclosan: "The antibacterial once in most liquid soaps, banned from consumer hand soap in the United States in 2016 for lack of proven benefit."
agar: "The seaweed gel that lets a Petri dish hold bacteria, and a vegetarian setting agent that sets firmer and at a higher temperature than gelatin."
casein: "The protein that makes up most of the protein in milk. Curdling it is what makes cheese, and it digests slowly, hence slow-release protein powders."
keratin: "The tough protein of hair, nails, horn, and the outer layer of skin. Its strength comes from sulfur bridges between cysteine amino acids."
furfural: "The almond-and-bread smell that forms when bran, corn cobs, or oat hulls are heated with acid. It also builds up in stale coffee and old wine."
starch: "How plants store glucose, and the biggest single source of calories in the human diet. Bread, rice, potatoes, and pasta are largely this."
gluten: "The stretchy protein network that forms when wheat flour meets water and is kneaded. It is what lets bread dough trap gas and rise."
chlorhexidine: "The antiseptic in surgical scrubs and prescription mouthwash. It sticks to skin and tooth surfaces, so it keeps working after rinsing."
brompheniramine: "A sedating antihistamine in combination cold and allergy medicines, the bromine cousin of chlorpheniramine."
kojic-acid: "A by-product of the mould used to make sake, miso, and soy sauce. It is used in skin creams because it interferes with pigment production."
xanthan-gum: "The thickener bacteria make from sugar, and the backbone of gluten-free baking. A tiny amount turns a liquid syrupy."

# ═══════════════════════════════════════════════════════════════════════════════
# CATALOG TRANCHE 2026-09-A — a line for each of the 295 molecules added by the
# first catalog-growth tranche (build plan phase 4): 184 prescription medicines at
# 10,000+ Wikipedia views a month, and 111 elements, materials and household
# chemicals from the top-500 remainder.
#
# Same rules as the phase 1 block above, and they matter more here because most of
# these are medicines: written from the STRUCTURED RECORD only (name, synonyms,
# formula, family, bucket, functional groups, GHS, LD50, Wikidata description). No
# Wikipedia prose. Say what it IS and its class, name what it is used for in ONE
# clause, and stop. Never a dose, never a route, never a comparison of one medicine
# with another, never anything a reader could act on. No em-dashes (house rule).
#
# Ordered by Wikipedia pageviews (most-sought first), in batches of 100.
# ── tranche batch 1 of 3 ──────────────────────────────────────────────────────
gabapentin: "An anticonvulsant, sold as Neurontin, used for seizures and for nerve pain. Its structure is a ring-bulked relative of the brain's own GABA."
propofol: "The anaesthetic sold as Diprivan, given to start and maintain general anaesthesia. Its milky white emulsion is the reason it is nicknamed milk of amnesia."
bupropion: "An antidepressant, sold as Wellbutrin and Zyban, also used to help people stop smoking. Chemically it is a substituted cathinone rather than an SSRI."
gold: "The soft yellow metal that does not tarnish, which is why it survives millennia in tombs and still fronts every contact in a phone. Element 79."
methylphenidate: "The stimulant sold as Ritalin and Concerta, used for ADHD and narcolepsy. It shares the phenethylamine skeleton with the body's own messengers."
fentanyl: "A synthetic opioid painkiller used in surgery and in patches such as Duragesic. It is far more potent by weight than morphine, which is why it dominates overdose statistics."
semaglutide: "A GLP-1 peptide used for type 2 diabetes and for weight loss, sold as Ozempic and Wegovy. At 187 carbons it is a chain, not a small molecule."
alprazolam: "The benzodiazepine sold as Xanax, used for anxiety and panic disorder. It is short-acting, which is part of why it is so often misused."
lisdexamfetamine: "A stimulant sold as Vyvanse, used for ADHD and binge eating disorder. It is amphetamine with the amino acid lysine bolted on, inert until the body cuts it off."
diazepam: "The benzodiazepine sold as Valium, used for anxiety, muscle spasm, seizures and alcohol withdrawal. It was the best-selling medicine in America through the 1970s."
sertraline: "The SSRI antidepressant sold as Zoloft, used for depression, anxiety and OCD. It is one of the most prescribed medicines in the world."
amphetamine: "The stimulant at the root of the whole class, used for ADHD and narcolepsy and sold as Adderall in a mixed-salt form. A single phenyl ring, a two-carbon chain, an amine."
lorazepam: "The benzodiazepine sold as Ativan, used for anxiety, seizures and sedation before procedures."
methylene-blue: "A deep blue thiazine dye that doubles as a medicine for methemoglobinemia. It stains cells for the microscope, treats fish tanks, and turns urine green."
doxycycline: "A tetracycline antibiotic used for chest and skin infections, acne, Lyme disease and as a malaria preventive."
trazodone: "An antidepressant, sold as Desyrel, prescribed for depression and very often for insomnia because it is sedating."
clonazepam: "The benzodiazepine sold as Klonopin, used for seizure disorders and panic disorder. It is long-acting compared with most of its class."
fluoxetine: "The first blockbuster SSRI, sold as Prozac, used for depression, OCD and bulimia. Its three fluorine atoms give it an unusually long stay in the body."
mirtazapine: "An antidepressant sold as Remeron. It is sedating and tends to increase appetite, which is why it is chosen for some people over an SSRI."
amitriptyline: "A tricyclic antidepressant now prescribed far more often at low strength for nerve pain, migraine prevention and sleep than for depression."
pregabalin: "An anticonvulsant sold as Lyrica, used for nerve pain, fibromyalgia and some seizure types. Like gabapentin it is built on the GABA skeleton."
mercury: "The only metal that is liquid at room temperature, once in every thermometer and barometer and now largely designed out of them because its vapour is toxic. Element 80."
tirzepatide: "A dual GIP and GLP-1 peptide for type 2 diabetes and weight loss, sold as Mounjaro and Zepbound. It is the largest medicine on this site by molecular weight."
meloxicam: "A non-steroidal anti-inflammatory sold as Mobic, used for arthritis pain and inflammation. The same molecule is a common veterinary painkiller."
oxycodone: "An opioid painkiller sold as OxyContin and Percocet, made by modifying thebaine from the opium poppy. Its extended-release form is at the centre of the American opioid epidemic."
ondansetron: "An anti-nausea medicine sold as Zofran, used for the sickness caused by chemotherapy, radiation and surgery."
aluminium: "The metal that made flight cheap: a third the weight of steel, endlessly recyclable, and so reactive it is always wearing an invisible oxide skin. Element 13."
copper: "The first metal people smelted, and the reason electricity is affordable to move. It is also a trace nutrient and a surface that kills bacteria on contact. Element 29."
ivermectin: "An antiparasitic that treats river blindness and scabies in people and worms in animals. Its discovery from a soil bacterium won a Nobel Prize in 2015."
uranium: "The heaviest element that occurs in quantity in nature, and the fuel of every nuclear reactor and the first atomic bombs. Element 92."
amlodipine: "A calcium channel blocker sold as Norvasc, used for high blood pressure and angina. It is among the most prescribed medicines on earth."
metformin: "The first-line medicine for type 2 diabetes, descended from a compound in the goat's rue plant. It is a tiny molecule: four carbons and five nitrogens."
cyclobenzaprine: "A muscle relaxant sold as Flexeril, used short term for muscle spasm. Its skeleton is a tricyclic antidepressant's, one double bond apart from amitriptyline."
tungsten: "The metal with the highest melting point of them all, 3,422 Celsius, which is why it was the filament in every incandescent bulb. Element 74."
quetiapine: "An atypical antipsychotic sold as Seroquel, used for schizophrenia, bipolar disorder and as an add-on in depression."
propranolol: "The first beta blocker, used for high blood pressure, angina, tremor, migraine prevention and the physical side of stage fright. Its discovery won a Nobel Prize."
iron: "The metal civilisation is named after, the core of the planet, and the atom at the centre of haemoglobin that carries oxygen in your blood. Element 26."
atorvastatin: "The cholesterol-lowering statin sold as Lipitor, which became the best-selling medicine of all time. It blocks the body's own cholesterol assembly line."
diclofenac: "A non-steroidal anti-inflammatory best known over the counter as the Voltaren gel rubbed onto an aching joint."
buspirone: "An anti-anxiety medicine sold as Buspar. It is not a benzodiazepine and is not sedating, which is why it is chosen for long-term anxiety."
azithromycin: "The antibiotic sold as Zithromax and dispensed as the Z-Pak, used for chest, ear, throat and some sexually transmitted infections."
duloxetine: "An SNRI antidepressant sold as Cymbalta, used for depression, anxiety, nerve pain and fibromyalgia."
escitalopram: "The SSRI antidepressant sold as Lexapro, used for depression and generalised anxiety. It is the single active mirror-image half of citalopram."
modafinil: "A wakefulness-promoting medicine sold as Provigil, used for narcolepsy and shift work sleep disorder."
metronidazole: "An antibiotic sold as Flagyl that works on bacteria and parasites that live without oxygen, so it treats dental, gut and some vaginal infections."
silver: "The best conductor of heat and electricity of any element, the metal that made photography possible, and a long-standing antimicrobial in dressings. Element 47."
cefalexin: "A first-generation cephalosporin antibiotic sold as Keflex, used for skin, bone, ear and urinary infections."
hydroxyzine: "An older antihistamine used both for itching and, because it is sedating, for anxiety and sleep. Cetirizine is what the body turns it into."
lead: "The soft heavy metal that plumbed Rome, sweetened Roman wine, and steadied petrol engines, and that every one of those uses had to be undone. Element 82."
sulfur: "The yellow element of matchheads, gunpowder and the smell of struck matches, and the atom that lets proteins staple themselves into shape. Element 16."
scopolamine: "A nightshade alkaloid used against motion sickness, most familiar as the small patch worn behind the ear. It comes from the same plant family as belladonna."
venlafaxine: "An SNRI antidepressant sold as Effexor, used for depression, anxiety and panic disorder."
antimony: "A brittle metalloid used since antiquity as kohl eye paint and now mostly as a flame retardant in plastics and textiles. Element 51."
pantoprazole: "A proton pump inhibitor sold as Protonix, which shuts down the stomach's acid pumps for reflux and ulcers."
ciprofloxacin: "A fluoroquinolone antibiotic sold as Cipro, used for urinary, gut and some respiratory infections."
tramadol: "An opioid painkiller for moderate pain that also acts on serotonin and norepinephrine, so it behaves partly like an antidepressant."
amoxicillin: "The penicillin antibiotic most likely to be in a child's medicine cupboard, used for ear, chest, throat and dental infections."
naltrexone: "An opioid antagonist used in alcohol and opioid use disorder. It occupies the same receptors opioids use and blocks them for a day at a time."
carbon: "The element that bonds to itself endlessly, which is the whole reason organic chemistry, and life, exist. Diamond and graphite are the same atom, packed differently. Element 6."
aripiprazole: "An atypical antipsychotic sold as Abilify, used for schizophrenia, bipolar disorder and as an add-on in depression."
helium: "The second most abundant element in the universe and the reason balloons rise. It is the only substance that will not freeze at ordinary pressure however cold it gets. Element 2."
lithium: "The lightest metal, the one that makes rechargeable batteries possible, and, as its salts, one of the oldest treatments in psychiatry. Element 3."
rosuvastatin: "The cholesterol-lowering statin sold as Crestor, among the most potent of its class."
prednisone: "A corticosteroid taken by mouth for inflammation, asthma flares, autoimmune disease and allergic reactions. The liver converts it into prednisolone before it works."
dextroamphetamine: "The right-handed mirror image of amphetamine and the more stimulating half, sold as Dexedrine and used for ADHD and narcolepsy."
morphine: "The reference opioid painkiller and the molecule that gives the opium poppy its power. Every other opioid is measured against it."
atomoxetine: "A non-stimulant medicine for ADHD, sold as Strattera. It works on norepinephrine rather than dopamine, so it is not a controlled substance."
potassium: "The metal that catches fire on water, and, as its ion, the charge that lets every nerve in your body fire. Bananas are famous for it. Element 19."
lamotrigine: "An anticonvulsant sold as Lamictal, used for epilepsy and to hold off the low swings of bipolar disorder."
sildenafil: "The PDE5 inhibitor sold as Viagra, developed for angina and repurposed for erectile dysfunction and pulmonary hypertension."
sulfuric-acid: "The most-produced industrial chemical on earth, and the acid in a car battery. It is so thirsty for water that it chars sugar and paper on contact."
zolpidem: "A sleep medicine sold as Ambien. It is not a benzodiazepine but works on the same receptor, which is why it can cause sleepwalking."
losartan: "An angiotensin receptor blocker sold as Cozaar, used for high blood pressure and to protect the kidneys in diabetes."
tin: "The metal that turned copper into bronze and started an age. It is still what a tin can is plated with, and what makes organ pipes sing. Element 50."
silicon: "The element under every chip, every solar panel and most of the sand on every beach. Second most abundant element in the earth's crust. Element 14."
sodium: "A metal soft enough to cut with a knife that explodes on water, and whose ion is half of table salt and the reason your nerves conduct. Element 11."
benzene: "A perfect ring of six carbons, the pattern that defines aromatic chemistry. It is also in petrol and cigarette smoke and is a known carcinogen."
sodium-hydroxide: "Lye, the caustic base of drain cleaner and oven cleaner, and the thing that turns fat into soap. It is corrosive to skin on contact."
potassium-nitrate: "Saltpeter, one of the three ingredients of gunpowder, and the curing salt that keeps ham pink. It also sells as stump remover and as fertiliser."
borax: "The laundry booster and household cleaner mined from dried lake beds. It is a salt of boric acid and one of the oldest cleaning agents still sold."
titanium: "As strong as steel at half the weight and immune to seawater, so it goes into jet engines, hip joints and spectacle frames. Element 22."
olanzapine: "An atypical antipsychotic sold as Zyprexa, used for schizophrenia and bipolar disorder."
cobalt: "The metal that made deep blue glass and glaze for three thousand years, sits at the centre of vitamin B12, and now runs most lithium batteries. Element 27."
methocarbamol: "A muscle relaxant sold as Robaxin, used short term for muscle spasm and back pain."
magnesium: "The metal that burns with a blinding white flame, the lightest structural metal in use, and the ion at the centre of every chlorophyll molecule. Element 12."
mupirocin: "A topical antibiotic ointment sold as Bactroban, used on impetigo and infected cuts and to clear MRSA from the nose."
plutonium: "A synthetic radioactive metal made in reactors, the fuel of the Nagasaki bomb and of the generators that power deep-space probes. Element 94."
nitrofurantoin: "An antibiotic that concentrates in urine, so it is used almost exclusively for bladder infections."
dexamethasone: "A potent corticosteroid used for inflammation, allergic reactions, brain swelling and severe COVID-19, where it was the first treatment shown to save lives."
risperidone: "An atypical antipsychotic sold as Risperdal, used for schizophrenia, bipolar mania and irritability in autism."
arsenic: "The classic poison of Victorian detective fiction, once in green wallpaper and patent medicines, and still a contaminant of groundwater in South Asia. Element 33."
minoxidil: "A blood-pressure medicine whose side effect became its main business: the hair regrowth liquid sold as Rogaine."
naloxone: "The opioid antagonist sold as Narcan, which reverses an opioid overdose in minutes and is now sold over the counter in the United States."
zinc: "The metal that galvanises steel against rust, and a trace nutrient the body needs for hundreds of enzymes and for wound healing. Element 30."
midazolam: "A short-acting benzodiazepine used for sedation before procedures and for prolonged seizures."
clonidine: "An alpha-2 agonist used for high blood pressure, ADHD, and withdrawal from opioids and nicotine."
bismuth: "The heaviest stable element, a metal that grows staircase-shaped iridescent crystals, and the active half of the pink stomach liquid Pepto-Bismol. Element 83."
glyphosate: "The active ingredient in Roundup and the most-used herbicide in the world. It blocks a metabolic pathway that plants have and animals do not."
phosphorus: "The element that made matches strike, that fertilises most of the world's crops, and that forms the backbone of DNA. Element 15."
promethazine: "A sedating antihistamine used for allergy, motion sickness, nausea and, in combination syrups, cough."
# ── tranche batch 2 of 3 ──────────────────────────────────────────────────────
boron: "A metalloid that makes glass shrug off thermal shock, which is why laboratory glassware and cookware are borosilicate. Element 5."
palladium: "The metal in a car's catalytic converter, which is why catalytic converters get stolen. It also soaks up hydrogen like a sponge. Element 46."
chromium: "The element that makes stainless steel stainless and gives chrome plating its mirror. Its name comes from the Greek for colour. Element 24."
lidocaine: "The local anaesthetic behind a numbed tooth, sold as Xylocaine, and the active ingredient in over-the-counter numbing creams and patches."
citalopram: "An SSRI antidepressant sold as Celexa, used for depression. Escitalopram is its single active mirror image."
selenium: "A trace nutrient the body needs for a handful of enzymes, and the element that made the first photocopiers work. Element 34."
tizanidine: "A muscle relaxant for spasticity that works as an alpha-2 agonist, the same mechanism as clonidine."
lisinopril: "An ACE inhibitor used for high blood pressure and heart failure. Its lineage traces to a peptide in Brazilian pit viper venom."
codeine: "A mild opioid from the opium poppy, used for pain and cough. The body has to convert it into morphine for it to work at all."
xenon: "A noble gas rare enough to be expensive, bright enough to light car headlamps and camera flashes, and heavy enough to work as an anaesthetic. Element 54."
sodium-carbonate: "Washing soda: the water softener in laundry powder, the flux that lets glass melt at a workable temperature, and a common pH raiser for pools."
nickel: "The metal that makes stainless steel and rechargeable batteries, and the most common cause of contact allergy from jewellery and coins. Element 28."
buprenorphine: "A partial opioid used for opioid use disorder and for pain, sold as Suboxone in combination with naloxone."
iridium: "One of the densest elements there is, and the layer of it in 66-million-year-old rock that first suggested an asteroid killed the dinosaurs. Element 77."
carbon-monoxide: "The colourless, odourless gas from incomplete burning that a detector in the hall is listening for. The body also makes tiny amounts of it as a signal."
sodium-thiopental: "A barbiturate once standard for starting anaesthesia, now largely displaced by propofol."
methane: "Natural gas: one carbon, four hydrogens, the simplest organic molecule there is. Cows and wetlands make it too, and it is a potent greenhouse gas."
celecoxib: "A non-steroidal anti-inflammatory sold as Celebrex that targets only the COX-2 enzyme, so it is gentler on the stomach lining than older ones."
radon: "A radioactive noble gas that seeps from soil into basements, and the second leading cause of lung cancer after smoking. Element 86."
trenbolone: "An anabolic steroid developed as a cattle growth implant and used off-label for muscle building. It is not approved for people."
osmium: "The densest naturally occurring element, twice as heavy as lead by volume, used in fountain pen nibs and electrical contacts. Element 76."
clopidogrel: "An antiplatelet medicine sold as Plavix, used after a heart attack or stent to keep platelets from clumping."
pentobarbital: "A barbiturate once used for sedation and seizures, now mostly a veterinary anaesthetic and euthanasia agent."
ezetimibe: "A cholesterol medicine sold as Zetia. Unlike a statin it blocks cholesterol absorption in the gut rather than its manufacture."
methadone: "A long-acting opioid used for opioid use disorder and for chronic pain. Its long stay in the body is the point: one dose covers a day."
phenol: "Carbolic acid, the first surgical antiseptic and the sharp medicinal smell in throat sprays. It is corrosive at strength."
silicon-dioxide: "Silica: sand, quartz, glass, and the little desiccant packet in a shoebox. It is also the anti-caking agent that keeps powdered food pourable."
furosemide: "A loop diuretic sold as Lasix, used for the fluid build-up of heart failure and for high blood pressure."
phenobarbital: "The oldest anticonvulsant still in wide use, more than a century old, and still on the WHO essential medicines list for seizures."
hydrocodone: "An opioid painkiller, usually combined with paracetamol and sold as Vicodin and Norco."
clindamycin: "An antibiotic for serious skin, dental and bone infections, and a topical acne treatment."
radium: "The element Marie Curie isolated, once painted onto watch dials until the women who painted them fell ill. Its glow is its radioactivity. Element 88."
haloperidol: "A first-generation antipsychotic used for schizophrenia, mania and acute agitation."
manganese: "A trace nutrient and the element that makes steel hard enough to be useful. Its dioxide is the black paste inside a dry-cell battery. Element 25."
calcium: "The metal whose ion builds every bone, shell and tooth, sets cement, and triggers every muscle contraction in your body. Element 20."
methotrexate: "A folate blocker used at low strength for rheumatoid arthritis and psoriasis and at high strength as a cancer medicine."
chlorpromazine: "The first antipsychotic, introduced in 1952, which changed how psychiatric illness was treated and emptied a generation of asylums."
benzonatate: "A cough medicine sold as Tessalon that numbs the stretch receptors in the airway. It is chemically related to local anaesthetics."
tadalafil: "The PDE5 inhibitor sold as Cialis, used for erectile dysfunction, enlarged prostate and pulmonary hypertension. It lasts far longer than sildenafil."
finasteride: "A hormone medicine sold as Proscar and Propecia, used for enlarged prostate and for male pattern hair loss."
baclofen: "A muscle relaxant for the spasticity of multiple sclerosis and spinal injury. It is chemically GABA with a chlorophenyl group attached."
temazepam: "A benzodiazepine sold as Restoril, prescribed for short-term insomnia."
molybdenum: "A trace nutrient and the metal that lets steel keep its strength red hot, so it goes into engine parts and drill bits. Element 42."
ozone: "Three oxygens instead of two: the sharp smell after a lightning strike or near a photocopier. High up it blocks ultraviolet; at ground level it is smog."
guanfacine: "An alpha-2 agonist used for ADHD and high blood pressure, sold as Intuniv."
polonium: "An intensely radioactive element Marie Curie named for her native Poland, and the poison used to kill Alexander Litvinenko in 2006. Element 84."
vortioxetine: "An antidepressant sold as Trintellix, used for major depressive disorder."
xylazine: "A veterinary sedative, not approved for people, that has spread into the illicit drug supply as an adulterant known on the street as tranq."
beryllium: "A metal lighter than aluminium and stiffer than steel, transparent to X-rays, and toxic enough to scar lungs permanently. Element 4."
paroxetine: "An SSRI antidepressant sold as Paxil, used for depression, anxiety, OCD and PTSD."
flunitrazepam: "A potent benzodiazepine sold as Rohypnol, notorious for its use in drug-facilitated assault. It is not marketed in the United States."
astatine: "The rarest naturally occurring element on earth: less than a teaspoon exists in the whole crust at any moment, and every atom decays within hours. Element 85."
neon: "The noble gas that glows red-orange when a current runs through it, and gave its name to every colour of tube sign since. Element 10."
thorium: "A weakly radioactive metal once used in gas lantern mantles and in camera lenses, and a proposed alternative nuclear fuel. Element 90."
1-1-difluoroethane: "The propellant in a can of compressed air duster. It leaves as a freezing spray, which is why the can gets cold in your hand."
caesium: "The most reactive metal there is, liquid just above room temperature, and the atom whose vibration defines the length of a second. Element 55."
topiramate: "An anticonvulsant sold as Topamax, used for epilepsy and for migraine prevention."
gallium: "A metal that melts in your hand at 30 Celsius, and the element behind the blue LED and most high-frequency chips. Element 31."
colchicine: "A plant alkaloid from the autumn crocus, used for gout and pericarditis. It has been in the medicine chest since ancient Egypt."
phentermine: "A stimulant appetite suppressant used short term for weight loss. It is structurally a close cousin of amphetamine."
chloral-hydrate: "A Victorian sedative, the original knockout drops of detective fiction, now almost entirely replaced by safer sleep medicines."
shellac: "The resin a lac insect secretes on trees in India and Thailand, dissolved in alcohol to make wood varnish, and the glaze on shiny sweets and pills."
naratriptan: "A triptan used to stop a migraine attack once it has started. It is slower and longer-acting than most of its class."
argon: "The noble gas that fills a light bulb and shields a weld, and makes up almost one percent of the air you are breathing. Element 18."
lanthanum: "The element that heads the lanthanide series and is used in camera lenses, hybrid car batteries and studio lighting. Element 57."
toluene: "The solvent smell of paint thinner, model glue and permanent marker. It is benzene with a methyl group, and far less carcinogenic for it."
dapagliflozin: "A diabetes medicine sold as Farxiga that makes the kidneys dump excess sugar into urine. It is also used in heart failure."
ethylene-glycol: "Antifreeze. It tastes sweet, which is why pets and children drink it, and the body turns it into acids that attack the kidneys."
hydromorphone: "A potent opioid painkiller sold as Dilaudid, used for severe pain."
fluorine: "The most reactive element in existence, which attacks almost everything, and whose ion in toothpaste hardens enamel against decay. Element 9."
ketoconazole: "An antifungal, familiar over the counter as the anti-dandruff shampoo Nizoral."
isotretinoin: "A vitamin A derivative sold as Accutane, used for severe acne. It is the strictly regulated cousin of the retinoids in skin creams."
montelukast: "An airway medicine sold as Singulair, used for asthma and hay fever. It blocks leukotrienes rather than histamine."
permethrin: "The insecticide in household bug sprays, in factory-treated outdoor clothing, and in the cream used to clear scabies and head lice."
calcium-hydroxide: "Slaked lime: the pickling lime that keeps cucumbers crisp, the base of lime mortar and plaster, and the paste used in a root canal."
ketorolac: "A non-steroidal anti-inflammatory strong enough to be used for short-term severe pain where an opioid might otherwise be needed."
clozapine: "An atypical antipsychotic reserved for schizophrenia that has not responded to anything else, because it demands regular blood monitoring."
secobarbital: "A short-acting barbiturate sold as Seconal, once a common sleeping pill and now rarely prescribed."
fluconazole: "An antifungal sold as Diflucan, used for thrush and other yeast infections."
daraxonrasib: "An investigational cancer medicine that targets RAS, one of the most commonly mutated genes in human tumours and long considered undruggable."
donepezil: "A dementia medicine sold as Aricept, used for the symptoms of Alzheimer's disease. It slows the breakdown of acetylcholine in the brain."
vanadium: "The metal that toughened the steel of the Model T chassis, and a trace element in some sea creatures. Element 23."
propane: "The gas in a barbecue bottle and a camping stove. It liquefies under modest pressure, which is what lets a small cylinder hold so much fuel."
hydroxychloroquine: "An antimalarial also used for lupus and rheumatoid arthritis. It became a focus of controversy during the COVID-19 pandemic."
fenbendazole: "A veterinary deworming medicine sold as Panacur for dogs, cattle and horses. It is not approved for people."
tantalum: "A metal so corrosion-proof that it goes into surgical implants, and so good at holding charge that it is in the capacitors of most phones. Element 73."
acetylcysteine: "A modified form of the amino acid cysteine, sold as a mucus thinner and used in hospitals as the antidote for paracetamol overdose."
calcium-oxide: "Quicklime, made by roasting limestone. It gets hot when it meets water, which is how self-heating cans work and why lime mortar sets."
levothyroxine: "The manufactured copy of the body's own thyroid hormone, taken when the thyroid does not make enough. One of the most dispensed medicines anywhere."
ibutamoren: "A growth hormone secretagogue sold in the grey supplement market as MK-677. It has never been approved as a medicine anywhere."
oseltamivir: "The antiviral sold as Tamiflu, used for influenza. It was originally derived from shikimic acid in star anise."
carisoprodol: "A muscle relaxant sold as Soma. The body breaks it down into meprobamate, an old anti-anxiety drug, which is why it is controlled."
poly-methyl-methacrylate: "Acrylic glass: Plexiglas and Perspex. It is clearer than window glass, half the weight, and the material of aquarium walls and bone cement."
empagliflozin: "A diabetes medicine sold as Jardiance that makes the kidneys excrete excess sugar, and is also used in heart failure."
cadmium: "A soft metal once used in rechargeable batteries and yellow pigments, now heavily restricted because it accumulates in the kidneys. Element 48."
allopurinol: "A medicine that lowers uric acid, used to prevent gout attacks and kidney stones."
triamcinolone: "A corticosteroid used for inflammation, given in joints, on skin and into the nose."
metoclopramide: "An anti-nausea medicine that also speeds the stomach's emptying, used for reflux and gastroparesis."
carbamazepine: "An anticonvulsant sold as Tegretol, used for epilepsy, trigeminal neuralgia and bipolar disorder."
boric-acid: "The mild antiseptic of old eyewash bottles, and the slow-acting bait that clears a cockroach infestation. It is also a flame retardant in cellulose insulation."
# ── tranche batch 3 of 3 ──────────────────────────────────────────────────────
sulfur-dioxide: "The sharp smell of a struck match, the preservative that keeps dried apricots orange, and the sulfite on a wine label. Volcanoes emit it by the megatonne."
methoxyflurane: "An inhaled anaesthetic, still carried by ambulances in Australia and Europe as the green whistle for pain at the roadside."
pethidine: "An older opioid painkiller, known as meperidine in the United States and sold as Demerol."
digoxin: "A heart medicine extracted from the foxglove, used for atrial fibrillation and heart failure. William Withering wrote it up in 1785."
hydrochlorothiazide: "A thiazide diuretic, one of the oldest and most prescribed blood-pressure medicines, usually combined with something else in one tablet."
thallium: "A heavy metal once sold as rat poison and now banned for it, tasteless and slow enough that it became a favourite of poisoners in fiction. Element 81."
rhodium: "The rarest and most expensive precious metal, used to plate white gold jewellery and to scrub nitrogen oxides from car exhaust. Element 45."
maltodextrin: "A short chain of glucose units made from starch, and one of the most common things on an ingredients list: it bulks up powders and thickens sauces."
memantine: "A dementia medicine used for moderate to severe Alzheimer's disease. It works on glutamate signalling rather than acetylcholine."
zopiclone: "A sleep medicine of the z-drug family, prescribed for short-term insomnia. Many people report a metallic taste the next morning."
zirconium: "A metal so transparent to neutrons that it clads the fuel rods in nuclear reactors, and whose oxide fakes diamond convincingly. Element 40."
valaciclovir: "An antiviral sold as Valtrex for herpes and shingles. It is aciclovir with a valine attached so the gut absorbs it better."
sumatriptan: "The first triptan, sold as Imitrex, used to stop a migraine attack once it has begun."
aluminium-oxide: "Alumina: the grit on sandpaper and grinding wheels, the ceramic in spark plugs, and, as a single crystal with a trace of chromium, a ruby."
tapentadol: "An opioid painkiller that also acts on norepinephrine, used for moderate to severe pain."
tranexamic-acid: "A medicine that slows the breakdown of clots, used to control heavy bleeding. It also turns up in skin creams for pigmentation."
protactinium: "One of the rarest and most expensive naturally occurring elements, a radioactive metal that exists mainly as a step in uranium's decay. Element 91."
povidone-iodine: "The brown antiseptic painted onto skin before surgery, sold as Betadine. The polymer holds iodine and lets it out slowly."
ethylenediaminetetraacetic-acid: "EDTA, the molecule that grabs metal ions and will not let go. It keeps mayonnaise from going rancid, stops blood samples clotting, and is the antidote in lead poisoning."
phenibut: "A GABA analogue developed in the Soviet Union and taken into space by cosmonauts. It is sold as a supplement in some countries and is a prescription medicine in others."
doxepin: "A tricyclic antidepressant, now more often prescribed at low strength for insomnia and for itching."
formic-acid: "The acid an ant injects when it bites, and the sting of a nettle. Industrially it is a descaler and a preservative in animal feed."
oxandrolone: "An anabolic steroid used medically to help regain weight after severe burns or surgery, and widely misused for muscle building."
krypton: "A noble gas used in high-performance lighting and once, before caesium, the standard that defined the metre. Element 36."
potassium-permanganate: "The intense purple crystals that turn water pink, used to disinfect wounds and treat drinking water. It stains everything brown it touches."
flucloxacillin: "A penicillin antibiotic that resists the enzyme staph bacteria use to destroy penicillin, so it is used for skin and bone infections."
metamizole: "A non-opioid painkiller and fever reducer widely used in Europe and Latin America, withdrawn in the United States and UK over a rare blood disorder."
tamsulosin: "A medicine sold as Flomax that relaxes the muscle of the prostate and bladder neck, used for the urinary symptoms of an enlarged prostate."
aciclovir: "The antiviral that made herpes and chickenpox treatable, and won its inventor a Nobel Prize in 1988."
methylprednisolone: "A corticosteroid used for inflammation and autoimmune flares, familiar as the tapering dose pack."
neodymium: "The element behind the strongest permanent magnets ever made, in every hard drive, earbud and wind turbine. Element 60."
germanium: "The semiconductor of the first transistor, before silicon took over, and now the material of infrared lenses and fibre-optic cores. Element 32."
pembrolizumab: "A monoclonal antibody cancer medicine sold as Keytruda. It is a protein far too large to draw as a single structure, so this page carries no diagram."
bisoprolol: "A beta blocker selective for the heart, used for high blood pressure and heart failure."
apixaban: "An anticoagulant sold as Eliquis, used to prevent stroke in atrial fibrillation and to treat clots. It needs no routine blood testing, unlike warfarin."
ceftriaxone: "A third-generation cephalosporin antibiotic given by injection for serious infections including meningitis and gonorrhoea."
chlordiazepoxide: "The first benzodiazepine ever made, sold as Librium, discovered by accident in 1955 and still used in alcohol withdrawal."
carfentanil: "A veterinary opioid made for sedating elephants, thousands of times more potent than morphine. It is not approved for people in any country."
carvedilol: "A beta blocker that also relaxes blood vessels, used for heart failure and high blood pressure."
technetium: "The lightest element with no stable form at all, made in reactors, and the radioactive tracer behind most nuclear medicine scans. Element 43."
fluvoxamine: "An SSRI antidepressant used mainly for OCD, and the first of its class approved for that use."
dicycloverine: "An antispasmodic that relaxes gut muscle, used for irritable bowel syndrome. It is known as dicyclomine in the United States."
dichloromethane: "Methylene chloride, the solvent in old paint strippers and the one that used to decaffeinate coffee. It boils at 40 Celsius, near body temperature."
acrylonitrile-butadiene-styrene: "ABS: the tough, matte plastic of LEGO bricks, keyboard keys and most 3D printer filament. Three monomers give it hardness, toughness and gloss."
valproate: "An anticonvulsant used for epilepsy, bipolar disorder and migraine prevention. It carries strict restrictions in pregnancy."
silicon-carbide: "Carborundum: harder than almost anything but diamond, the grit on wet-and-dry paper and the ceramic in brake discs and body armour."
tianeptine: "An atypical antidepressant prescribed in France and parts of Asia, and sold in the United States as an unregulated supplement nicknamed gas station heroin."
ritonavir: "An antiviral for HIV, now used mostly in tiny amounts to slow the breakdown of other antivirals, including the Paxlovid COVID-19 pill."
desvenlafaxine: "An SNRI antidepressant. It is the active molecule the body already makes from venlafaxine, sold directly."
vancomycin: "The antibiotic of last resort for MRSA and other resistant Gram-positive infections, given by drip because the gut will not absorb it."
metandienone: "The anabolic steroid sold as Dianabol, made for the 1960 US Olympic team and the archetype of the black-market muscle-building drug."
levofloxacin: "A fluoroquinolone antibiotic sold as Levaquin, used for pneumonia and urinary infections."
niobium: "A superconducting metal used in MRI magnets and particle accelerators, and, because it is hypoallergenic, in body jewellery. Element 41."
terbinafine: "An antifungal, sold over the counter as Lamisil AT cream for athlete's foot and by prescription for nail infections."
tacrolimus: "An immunosuppressant from a Japanese soil bacterium, used to stop organ rejection after transplant and as an eczema ointment."
francium: "The rarest naturally occurring element after astatine: at most a few tens of grams exist in the entire earth's crust at any moment. Element 87."
semax: "A short peptide developed in Russia as a nootropic and stroke treatment. It is approved nowhere outside the former Soviet states."
nortriptyline: "A tricyclic antidepressant, also used for nerve pain. It is what the body turns amitriptyline into."
copper-ii-sulfate: "The vivid blue crystals of a school chemistry lesson, used as a pool algaecide, a root killer in drains and a fungicide in vineyards."
metoprolol: "A beta blocker selective for the heart, used for high blood pressure, angina and after a heart attack."
potassium-hydroxide: "Caustic potash, the base that makes liquid and soft soaps where sodium hydroxide makes hard bars. It is also the electrolyte in alkaline batteries."
amantadine: "An antiviral repurposed for Parkinson's disease and for the involuntary movements that levodopa can cause."
yttrium: "The element in the phosphor that made red glow on a colour television tube, and in the garnet crystals of solid-state lasers. Element 39."
melamine: "The hard resin of unbreakable picnic plates and laminate worktops. It is nitrogen-rich, which is why it was criminally added to fake protein content in milk in 2008."
tellurium: "A metalloid rarer in the crust than platinum, used in solar panels and in alloys to make steel easier to machine. Element 52."
californium: "A synthetic element made in only a few laboratories, so intensely neutron-emitting that a gram of it is used to start nuclear reactors. Element 98."
etomidate: "An anaesthetic used to start general anaesthesia, chosen when blood pressure needs to stay steady."
tetracycline: "The antibiotic that named a whole family. It binds to calcium, which is why it stains developing teeth."
bisphenol-a: "BPA: the building block of polycarbonate plastic and can linings, and the molecule behind every BPA free label on a water bottle."
domperidone: "An anti-nausea medicine that also speeds stomach emptying. It is widely used outside the United States, which has never approved it."
cefdinir: "A third-generation cephalosporin antibiotic taken by mouth, used for ear, sinus and chest infections."
tungsten-carbide: "The alloy of drill bits, milling cutters and scratch-proof watch cases. It is nearly as hard as diamond and three times as stiff as steel."
triamcinolone-acetonide: "The corticosteroid in nasal sprays such as Nasacort and in creams for eczema and dermatitis."
cyproheptadine: "A sedating antihistamine also used for appetite stimulation and to prevent migraine."
acetylene: "The gas of an oxy-acetylene torch, which burns hotter than any other common fuel gas at over 3,000 Celsius. Two carbons held by a triple bond."
prochlorperazine: "A phenothiazine used mainly for severe nausea and vertigo, and at higher strength for psychosis."
barium: "The metal whose sulfate you swallow before an X-ray, because it is opaque to X-rays and passes straight through you. Element 56."
naphthalene: "Mothballs. It turns straight from solid to vapour without melting, which is why a mothball shrinks and vanishes."
valsartan: "An angiotensin receptor blocker sold as Diovan, used for high blood pressure and heart failure."
l-dopa: "The molecule the brain turns into dopamine, and the cornerstone of Parkinson's treatment. It occurs naturally in fava beans and velvet beans."
clomipramine: "A tricyclic antidepressant used chiefly for OCD, where it remains one of the most effective medicines available."
tretinoin: "All-trans retinoic acid, the acid form of vitamin A. It is the prescription retinoid for acne and photoaging, and a treatment for one leukaemia."
strontium: "The element that burns crimson in fireworks and flares. It follows calcium into bone, which is why its radioactive isotope was feared in fallout. Element 38."
ipratropium-bromide: "An inhaled airway medicine sold as Atrovent, used for COPD and asthma. It is a synthetic relative of atropine from deadly nightshade."
apomorphine: "A medicine for the sudden off periods of Parkinson's disease. Despite the name it is not an opioid, though it is made from morphine."
prednisolone: "A corticosteroid for inflammation and autoimmune conditions. It is the active form the liver makes from prednisone."
erythromycin: "A macrolide antibiotic from a soil bacterium, the standard alternative for people allergic to penicillin."
suzetrigine: "A non-opioid painkiller approved in 2025 that blocks a sodium channel found only in pain-sensing nerves, the first genuinely new class of analgesic in decades."
levocetirizine: "The active mirror-image half of cetirizine, sold over the counter as Xyzal for hay fever and hives."
indium: "The metal that makes touchscreens work: its oxide is transparent and conducts electricity, a rare combination. Element 49."
hexane: "The solvent used to press the last oil out of soybeans and to formulate some glues and cleaners. It is a six-carbon chain from petroleum."
scandium: "A rare metal that makes aluminium alloys dramatically stronger, used in high-end bicycle frames and aerospace parts. Element 21."
butane: "Lighter fuel, and the gas in a camping stove cartridge. It liquefies under gentle pressure, which is why you can see it sloshing in a clear lighter."
hypochlorous-acid: "The molecule that actually does the work when bleach disinfects, and the same one your white blood cells make to kill bacteria. It is sold as a wound spray."
americium: "The synthetic element inside a smoke detector: a speck of it ionises the air, and smoke interrupting that current sets off the alarm. Element 95."
