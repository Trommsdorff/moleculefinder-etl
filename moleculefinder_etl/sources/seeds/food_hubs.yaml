    - {slug: citric-acid, presence: natural, presence_note: "An acid the fruit makes."}
    - {slug: malic-acid, presence: natural, presence_note: "An acid the fruit makes."}
    - {slug: tartaric-acid, presence: natural, presence_note: "An acid the fruit makes, notably grapes."}
    - {slug: ascorbic-acid, presence: natural, presence_note: "Made by the plant."}
    - {slug: pectin, presence: natural, presence_note: "Part of the fruit's cell walls."}
    - {slug: quercetin, presence: natural, presence_note: "A flavonol of fruit skins."}
    - {slug: beta-carotene, presence: natural, presence_note: "A pigment of orange and yellow fruit."}
    - {slug: limonene, presence: natural, presence_note: "Part of the peel oil of citrus fruit."}
