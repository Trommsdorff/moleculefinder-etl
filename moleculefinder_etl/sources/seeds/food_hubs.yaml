    - {slug: vanillin, presence: added, presence_note: "The flavouring the maker adds to the bar."}   # the standard flavoring in a bar
    - {slug: sucrose, presence: added, presence_note: "The sugar the maker adds to the bar."}
    - {slug: magnesium, presence: natural, presence_note: "A mineral of the cocoa solids."}   # dark chocolate is among the densest food sources
    - {slug: iron, presence: natural, presence_note: "A mineral of the cocoa solids."}
    - {slug: copper, presence: natural, presence_note: "A mineral of the cocoa solids."}
    - {slug: lactose, presence: added, presence_note: "Comes with the milk the maker adds to milk chocolate."}   # milk chocolate
    - {slug: casein, presence: added, presence_note: "Comes with the milk the maker adds to milk chocolate."}   # milk chocolate

cocoa:
