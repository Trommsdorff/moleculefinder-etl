# Description phrases — the vocabulary of the templated description floor
# (BUILD-PLAN-traffic-2026-09-05 phase 1, layer A).
#
# WHY THIS EXISTS. Until 2026-09 the meta description, the on-page "What is X?"
# answer and the FAQPage JSON-LD all came from the Wikidata one-line description,
# which for 292 of 498 molecules is literally "chemical compound". 498 pages
# carried 164 distinct descriptions, mean length 30 characters. Search engines
# read that as thin, duplicated content, and it is the reason the site ranked on
# page five for its own head terms.
#
# `assemble.build_description` composes a sentence per molecule from fields that
# exist on EVERY record (title, formula, weight, scope family, scope bucket, GHS,
# and whichever measured value the molecule carries). The wording lives here, not
# in the code, so it stays consistent and editable and a future tranche of
# molecules inherits it for free.
#
# HOUSE RULES for anything added below: no em-dashes in visible site copy; no
# medical advice and no dosing; state what a thing IS, never what a reader should
# do about it. Phrases must read naturally in the slot they fill:
#
#   {Title} ({formula}, {weight} g/mol) is {article} {family} {bucket}.
#      {hazard}. {measured value}. {structure}.

# ── families: scope_family -> the noun phrase and its article ────────────────
# Every scope_family present in the canon needs an entry. An unmapped family
# falls back to "compound", which is exactly the generic wording this file
# exists to eliminate, so `mfetl transform` logs a warning naming it.
