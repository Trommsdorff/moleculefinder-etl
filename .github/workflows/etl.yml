name: etl
on:
  schedule: [{ cron: "0 6 * * 1" }]     # weekly, Mondays 06:00 UTC (also keeps Supabase warm)
  workflow_dispatch: {}
permissions:
  contents: write                       # snapshot push; default token is now read-only
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: mfetl all --target 10000
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_SHA:           ${{ github.sha }}
      - name: commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/seed
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "etl: refresh $(date -u +%F)"
            git push
          fi
      - name: trigger deploy
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
