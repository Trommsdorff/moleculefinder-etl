# Presence marks for the ingredient rows that come from Wikidata (build plan everyday chemistry
# 2026-11, phase 1). A product whose molecules are read from a Wikidata item's "has part(s)" (P527)
# or "made from material" (P186) gets each row's mark from here, keyed by product and molecule.
#
# The marks are MoleculeFinder's own hand curation, never fetched. The values are the closed list
# in transform/presence.py: natural, added, body, formed (with formed_when) or none (with a written
# presence_note). A row a weekly refresh adds that has no mark here is exported unmarked, listed in
# data/seed/presence_unmarked.json and the run summary, and never fails the run; mark it here.
# A mark here whose row Wikidata no longer lists is unused and harmless (it is logged).

