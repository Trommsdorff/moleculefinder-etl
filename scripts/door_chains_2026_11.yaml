# The door chains' record (build plan everyday chemistry 2026-11, phase 4): the basis for every piece of new
# writing in sources/seeds/doors/*.yaml, Garrett's rulings of 2026-11-10, the four line fixes and the checks. scripts/door_chains_review.py reads it with
# the compiled data/snapshots/doors.json and writes moleculefinder-web/docs/design/door-chains-review-2026-11.html;
# it refuses to write when a new string has no basis here, or a basis names a string the seeds no longer have.
#
# A key is the string's place in the seeds (transform/doors.door_strings). Strings that state no fact (a
# door's name, its question title, a nav label, a link's text) take `label` and need no entry.
label_suffixes: [".name", ".title", ".nav", ".go", "card.go"]

basis:
  # ── coffee ──
  coffee.card.line: >-
    Our data: caffeine is on our coffee list (Naturally present) and theobromine on our chocolate list. The
    adenosine vs caffeine answer line: "Adenosine is the body's own sleepiness signal and caffeine blocks its
    receptors". Both checked by the build.
  coffee.lede: >-
    Our data: the count is computed from the coffee list (14 today, it moves with the list). Tea, energy drinks
    and soft drinks lists each carry caffeine (checked). "To your brain": the caffeine vs theobromine paragraph,
    "the brain's adenosine receptors".
  coffee.stop1.heading: 'Caffeine''s own why-it-matters line, "The molecule behind coffee''s lift".'
  coffee.stop2.heading: >-
    The adenosine vs caffeine answer line, "caffeine blocks its receptors" (checked). Standard pharmacology:
    caffeine is an adenosine receptor antagonist.
  coffee.stop2.more4.aside: 'Paraxanthine''s why-it-matters line, "The main thing caffeine turns into inside you" (checked).'
  coffee.stop3.heading: >-
    Theobromine's why-it-matters line, "a milder cousin of caffeine" (checked), and its editorial, "caffeine's
    gentler cousin". Our data: theobromine is on our chocolate list with its amount.
  coffee.stop3.note: >-
    Garrett's ruling, 2026-11-10: the mockup's dog fact, restored as one new sentence with no number and no LD50.
    Standard veterinary toxicology: dogs metabolise theobromine far more slowly than people (a half-life of about
    17.5 hours in dogs against about 7 in people), which is why chocolate poisons them. Theobromine's own records: its
    editorial ("enough to poison a dog") and the caffeine vs theobromine paragraph (its LD50 "in dogs").
  coffee.stop4.heading: 'Our data: three lists besides coffee carry caffeine, tea, energy drinks and soft drinks (checked).'
  coffee.stop5.heading: The six molecules shown are on our coffee list, each with its own mark.
  coffee.next2.line: >-
    Our data: the formulas C8H10N4O2 and C7H8N4O2 differ by exactly CH2 (checked), and the answer line says
    "caffeine carries three methyl groups and theobromine two" (checked). Standard chemistry: a methyl group in
    place of a hydrogen on a nitrogen adds CH2.
  # ── the medicine cabinet ──
  medicine-cabinet.page_title: The four products named are member label pages (DailyMed).
  medicine-cabinet.description: >-
    The active ingredients are read from each DailyMed label. "How acetaminophen, ibuprofen and menthol work":
    the door quotes a mechanism sentence for each (acetaminophen vs ibuprofen; menthol vs camphor).
  medicine-cabinet.card.line: >-
    Our data, from the labels: Tylenol Extra Strength and NyQuil Intense Flu LiquiCaps both list acetaminophen as
    an active ingredient with the purpose "Pain reliever/fever reducer"; Advil lists ibuprofen; Vicks VapoRub
    lists menthol (all checked).
  medicine-cabinet.lede: The labels are DailyMed's; every strength shown is the label's own figure, read from it.
  medicine-cabinet.stop1.heading: The same two label facts as the card line (checked).
  medicine-cabinet.stop2.heading: >-
    The acetaminophen vs ibuprofen answer line, "Ibuprofen is an NSAID that eases inflammation as well as pain"
    (checked); Advil's label lists ibuprofen.
  medicine-cabinet.stop3.heading: >-
    Dextromethorphan's why-it-matters line, "marked DM on cold medicine boxes" (checked); Mucinex DM's label lists
    dextromethorphan as its active (checked).
  medicine-cabinet.stop4.heading: >-
    Our data, from the labels: NyQuil Intense Flu LiquiCaps lists doxylamine (Antihistamine, 6.25 mg) and Vicks
    DayQuil Severe Cold and Flu does not list it (both checked).
  medicine-cabinet.stop5.heading: >-
    The menthol vs camphor paragraph: menthol activates TRPM8, "the cold receptor", and camphor works "on several
    TRP channels including the warm ones, which is why it reads as both cooling and warming". VapoRub's label lists
    both (camphor 4.8%, menthol 2.6%).
  # ── bread ── (re-ordered around what makes bread bread: Garrett, 2026-11-10)
  bread.card.line: >-
    Our data: starch, gluten and ethanol are on our bread list (checked by the card's requires); gluten's line,
    "lets bread dough trap gas and rise" (checked); ethanol's mark on the bread list, Formed by fermentation, "Made by
    the yeast as the dough rises; most bakes off".
  bread.lede: >-
    The starch vs cellulose answer line, "a starch chain's alpha bonds digest and a cellulose chain's beta bonds do
    not" (checked); gluten's line, "the stretchy protein network ... lets bread dough trap gas" (checked); ethanol's
    bread mark, "Made by the yeast as the dough rises"; maltol is on our Fresh-baked bread list, Formed when baked
    (checked), and its line names "fresh bread crust".
  bread.stop1.heading: The starch vs cellulose answer line (checked).
  bread.stop2.heading: 'The starch vs cellulose paragraph, "beta bonds ... that human enzymes cannot touch".'
  bread.stop2.unmarked: >-
    Our data: cellulose is on no curated food list (its product rows are label inactive ingredients only).
    Standard chemistry: starch's glucose units are joined alpha-1,4 and cellulose's beta-1,4, the same sugar
    joined the other way round. Garrett, 2026-11-10: kept as starch's counterpart, unmarked, with this note.
  bread.stop3.heading: >-
    Gluten's line, "The stretchy protein network that forms when wheat flour meets water ... lets bread dough trap
    gas and rise" (both phrases checked); gluten is on our bread list, Naturally present ("From the wheat flour's
    proteins, gliadin and glutenin").
  bread.stop4.heading: >-
    Our data: ethanol is on our bread list (checked), Formed by fermentation, its note "Made by the yeast as the
    dough rises; most bakes off", which the stop shows as its mark.
  bread.stop5.heading: >-
    Maltol's line, "fresh bread crust", and furaneol's, "forms as bread bakes" (both checked); both are on our
    Fresh-baked bread list, Formed when baked.
  bread.stop6.heading: The six molecules shown are the rest of our bread list, each with its own mark.
  # ── sugar and sweeteners ──
  sugar-and-sweeteners.page_title: Sucrose and sucralose are both stops on the door.
  sugar-and-sweeteners.description: >-
    Our data: sucrose is 1 by definition (sweetness.yaml, HSDB); aspartame 200 and sucralose 600 (FDA),
    stevioside 300 (MeSH), each checked as at least 100. Xylitol C5H12O5 and erythritol C4H10O4 differ by CH2O,
    one carbon (checked).
  sugar-and-sweeteners.card.line: >-
    Sucrose's editorial, "the yardstick every other sweetener is measured against"; aspartame's editorial, "a
    diet soda needs only a trace of it" (checked).
  sugar-and-sweeteners.lede: >-
    As the description. "Two sugar alcohols": the xylitol vs erythritol answer line, "sugar alcohols one carbon
    apart".
  sugar-and-sweeteners.stop1.heading: 'Sucrose''s editorial, "the yardstick"; its line, "Table sugar".'
  sugar-and-sweeteners.stop2.heading: >-
    Aspartame's sourced sweetness, 200 (the FDA's table), and its line, "about 200 times sweeter than sugar"
    (checked).
  sugar-and-sweeteners.stop3.heading: >-
    Our data: sucralose C12H19Cl3O8 against sucrose C12H22O11, three chlorines in and three OH groups out
    (checked); its line, "three chlorine atoms swapped in" (checked).
  sugar-and-sweeteners.stop4.heading: >-
    Stevioside's editorial, "extracted from the leaves of the stevia plant"; it is on our stevia list, Naturally
    present.
  sugar-and-sweeteners.stop5.heading: The formulas differ by CH2O, one carbon (checked); the answer line says so.
  # ── household cleaners ──
  household-cleaners.page_title: >-
    "Sodas": baking soda, washing soda and caustic soda are the names the three molecules' own lines and
    comparisons use.
  household-cleaners.description: >-
    The ammonia, bleach and peroxide lines and sentences quoted on the door; ammonia's, "Dissolved in water, ammonia
    is alkaline, which breaks up grease" (the ammonia vs bleach paragraph, 2026-11-10). Alkalinity: "washing soda has
    a second sodium where baking soda keeps a hydrogen, and that makes all the difference to how alkaline they are"
    (bicarbonate vs carbonate, corrected 2026-11-10) and "they sit at opposite ends of that
    scale" (hydroxide vs bicarbonate).
  household-cleaners.card.line: >-
    The ammonia vs bleach answer line, "Ammonia cleans glass and grease"; bleach's line, "destroys the pigments in
    a stain"; the peroxide sentence, "used on fabric and hair" (all checked).
  household-cleaners.lede: 'Baking soda''s line, "lifts a cake"; the caustic soda sentence, "drain cleaner" (both checked).'
  household-cleaners.stop1.heading: 'The ammonia vs bleach answer line, "Ammonia cleans glass and grease" (checked).'
  household-cleaners.stop2.heading: 'Sodium hypochlorite''s line, "Household bleach."'
  household-cleaners.stop3.heading: >-
    The peroxide sentence, "decomposes into water and oxygen and nothing else". Standard chemistry:
    2 H2O2 gives 2 H2O and O2.
  household-cleaners.stop4.heading: The three molecules shown, under the names their lines use.
  # ── citrus ──
  citrus.card.line: >-
    The citric acid vs vitamin C answer line, "citric acid is not a vitamin at all"; limonene's line, "citrus
    scent locked in orange and lemon peel" (both checked).
  citrus.lede: 'Citric acid''s line, "sourness of lemons, limes, and oranges" (checked), and the two lines above.'
  citrus.stop1.heading: >-
    Vitamin C's line (rewritten 2026-11-10), "humans, other primates and guinea pigs cannot" make it (checked). Standard biology: humans lack the last
    enzyme of the pathway (L-gulonolactone oxidase).
  citrus.stop2.heading: The citric acid vs vitamin C answer line (checked).
  citrus.stop3.heading: Limonene's line (checked).
  citrus.stop4.heading: The six molecules shown are the rest of the citrus page's list, each with its own mark.

rulings:
  - title: "Bread: two of its five stops were not in bread by our data"
    asked: >-
      Cellulose and maltodextrin are on no bread list. Recommended: keep cellulose, replace maltodextrin with ethanol
      (on our bread list), and move maltodextrin into starch's Read more.
    ruling: >-
      Re-order bread around what makes bread bread: starch; cellulose (starch's counterpart, unmarked, with its note);
      gluten, the protein network that forms when flour meets water and traps the gas so the loaf rises; ethanol, made
      by the yeast as the dough rises, most of it baking off; then the smell (maltol and furaneol). Maltodextrin goes
      into starch's Read more as the maltodextrin vs starch answer line and link; "Also in the loaf" keeps the rest of
      the bread list; card line, lede and headings rewritten to match. Applied.
  - title: "The medicine cabinet: doxylamine's line names a use no member label states"
    asked: Recommended keeping it (it describes the molecule, not a product).
    ruling: The line stays as it is.
  - title: "The medicine cabinet: the dextromethorphan stop is thin"
    asked: Recommended accepting it for now.
    ruling: Accepted as it is.
  - title: "Household cleaners: one sentence about mixing bleach and ammonia"
    asked: Recommended keeping it in Read more, not the stop's first layer.
    ruling: It stays in Read more.
  - title: "Coffee: two differences from the approved mockup"
    asked: >-
      The dog paragraph was left out (it carried two LD50s and "dose"); the half-life sentence is in theobromine's
      Read more. Recommended accepting both.
    ruling: >-
      Keep the half-life sentence. Restore the dog fact on the theobromine stop as one new sentence with no numbers
      and no LD50, in the stop's first layer as the mockup had it: "Dogs clear theobromine far more slowly than people
      do, which is why chocolate is dangerous to them." Basis: standard veterinary toxicology, and theobromine's own
      records. Applied (a stop's new `note` field).
  - title: "Members and links that differ from the plan's table"
    asked: Recommended keeping DayQuil, Unisom and the sweetener lists as members.
    ruling: The added members stay.
  - title: "Found, not changed: limonene's comparison sentence overreaches"
    asked: Recommended fixing that one sentence in a small copy pass.
    ruling: Fixed now (below).

fixes:
  - title: "Baking soda vs washing soda (/vs/sodium-bicarbonate-vs-sodium-carbonate)"
    was: >-
      Baking soda and washing soda are the same two elements in different proportions, NaHCO3 against Na2CO3, and the
      extra sodium makes all the difference to how alkaline they are.
    now: >-
      Baking soda and washing soda are both sodium salts of carbonic acid, NaHCO3 against Na2CO3: washing soda has a
      second sodium where baking soda keeps a hydrogen, and that makes all the difference to how alkaline they are.
    note: >-
      Garrett's wording, verbatim. Baking soda has four elements and washing soda three. No claim word. The cleaners
      door's three sodas stop quotes it, re-pinned.
  - title: "Vitamin C's why-it-matters line (/m/ascorbic-acid and every page that quotes it)"
    was: Vitamin C, the tart brightness of citrus and a nutrient your body cannot make on its own.
    now: >-
      Vitamin C, the nutrient whose absence causes scurvy. Dogs, cats and nearly all other mammals make their own,
      but humans, other primates and guinea pigs cannot, so ours has to come from food.
    note: >-
      The sourness of citrus is citric acid, the door's next stop. 190 characters, unique; it is also the page's
      description; the title does not move. "Nearly all other mammals" in place of "most animals" keeps it outside
      the claim rule and true (most bony fish, some bats and many songbirds cannot make it either). Standard
      biology: humans, other primates and guinea pigs lack L-gulonolactone oxidase. The citrus door's first stop
      quotes it, re-pinned, and its requires now checks "humans, other primates and guinea pigs cannot".
  - title: "Limonene vs linalool (/vs/limonene-vs-linalool)"
    was: >-
      Limonene is a cyclic hydrocarbon, C10H16, and is the whole of citrus peel oil, which is why it is the solvent in
      orange-oil cleaners as well as a fragrance.
    now: >-
      Limonene is a cyclic hydrocarbon, C10H16, and makes up most of citrus peel oil, which is why it is the solvent
      in orange-oil cleaners as well as a fragrance.
    note: >-
      "Most" kept under the claim rule: an entry in claims_allowed.yaml, basis science (d-limonene is the main
      constituent of the peel oil), in line with our own presence note, "The main part of the peel oil". No door
      quotes this sentence (citrus quotes the pair's answer line).
  - title: "Ammonia: why it cleans (/vs/ammonia-vs-sodium-hypochlorite)"
    was: The ammonia stop's Read more compared only molecular weights.
    now: >-
      Dissolved in water, ammonia is alkaline, which breaks up grease, and it evaporates completely, which is why it
      leaves glass without streaks.
    note: >-
      Placed as a new sentence in the ammonia vs bleach paragraph (its sixth, after the weights), not as new writing
      on the door: the door quotes it by reference, pinned, so the "references, not copies" rule holds, and
      what_it_does.yaml can quote it too (ammonia joins, 22 entries). Standard chemistry. No claim word. The cost: the
      /vs page's paragraph shows the new sentence (its title and description, the answer line, do not change).

changes:
  - door: Sugar and sweeteners
    text: >-
      The table sugar member is /in/table-sugar; /whats-in/table-sugar answers 410 since phase 2. Aspartame's and
      sucralose's marks come from the diet soda list, stevioside's from the stevia list, xylitol's and erythritol's
      from sugar-free gum, so those lists are members too.
  - door: The medicine cabinet
    text: >-
      Doxylamine's stop rests on DayQuil Severe Cold and Flu (it does not list doxylamine) and Unisom SleepTabs (its
      label calls it a nighttime sleep aid); both are members. Ibuprofen's Read more does not use its editorial's
      second sentence (it says how often to redose).
  - door: Bread
    text: >-
      Re-ordered on Garrett's ruling: starch (maltodextrin in its Read more), cellulose, gluten, ethanol, the smell,
      then also in the loaf (the other six on our bread list).
  - door: Household cleaners
    text: Four stops, the three sodas as one; ammonia's Read more now says why it cleans.
  - door: Coffee
    text: >-
      As the mockup, with the dog fact as one new sentence on theobromine's stop; soda is our curated soft drinks list
      (Added by the maker), not Wikidata rows, so it cannot move with an outside edit.
  - door: Citrus
    text: Its "also in the fruit" is a fourth stop showing the rest of the list; vitamin C's line no longer claims citrus's tartness.
  - door: "Phase 2's changes, checked"
    text: >-
      Tannic acid, 2-nonenal and ethyl maltol are on no door; no door uses MSG; the one hangover line any door shows
      (acetaldehyde in coffee's also) reads "long blamed for part of a hangover", and the build refuses any other
      wording.

what_it_does_note: >-
  The molecule page's section 3, rendered from phase 8; on the records now, read by no page. Each sentence is quoted
  from a comparison paragraph and pinned. Ammonia joined on 2026-11-10 with its new sentence. Left out for want of a
  mechanism sentence: paraxanthine, dextromethorphan, doxylamine, stevioside (its sentence speaks of "both"), limonene
  (its corrected sentence says what it is used for, not what it does), sodium carbonate, maltol, furaneol.

checks:
  - >-
    Every reference resolves and every requires holds (the compiler, in the export preflight, before the Supabase
    load); the four fixed lines are re-pinned where a door quotes them (the three sodas stop, vitamin C's stop and its
    requires) and ammonia's new sentence is quoted by reference.
  - >-
    The build stops when one fails (proved in the build session on the real mfetl all, and in tests for each kind of
    requires); new tests hold the ruled bread chain, the dog note (one sentence, house rules, length) and the four
    fixes as the doors quote them.
  - >-
    No dash, no advice or dosing word, no completeness phrase and no LD50 in any of the 281 strings doors.json
    carries (the compiler, and an independent scan). Limonene's "most" has its claims_allowed.yaml entry; no other
    edited line or door string carries a claim word.
  - >-
    ETL: 1,125 passed, 1 skipped (1,119 + 6); ruff 130 (= main). Pinned build (inputs f69fd345c58bfa08, keys
    blanked) twice, byte-identical, 0 PubChem POSTs. Against the approved build the snapshot changes exactly:
    doors.json, three comparison paragraphs (text only; no answer line), vitamin C's why-it-matters line and
    description, what_it_does on ammonia (22 molecules), and the line where the Citrus world quotes vitamin C.
  - >-
    Web, as CI runs it (keys blanked): verify-snapshot OK, typecheck clean, npm test 257 passed and 21 skipped with no
    build; build 3,091 pages, 278 passed on the build; sitemap 1,711; the three group pages absent from the sitemap
    and the search index.
  - >-
    Against a build of main (one saved copy of the news feed for both): what a reader sees changes on /m/ascorbic-acid
    (its line and description; title unchanged), the five food pages that quote its line (/whats-in/citrus, fruit,
    chili-peppers, romaine-lettuce, bullens-pilsnerkorv), the Citrus world's panel (/roam/citrus), its embed card,
    and the three /vs paragraphs (sodium-bicarbonate-vs-sodium-carbonate, limonene-vs-linalool,
    ammonia-vs-sodium-hypochlorite), their titles, descriptions and answers unchanged. Nothing else.
