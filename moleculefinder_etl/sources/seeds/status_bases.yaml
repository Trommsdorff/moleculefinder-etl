# The status rule's recorded bases (transform/medicine_status.py; brief ../../../TRUST-3C-STATUS-AND-ROUNDING-PROMPT.md,
# 2026-11-27). A medicine's page says "over the counter", "prescription" or both from the evidence in its record: its
# licence record, the DailyMed labels MoleculeFinder carries, and the entries here. An entry is a side of the status
# the record did not already hold, read from the PRIMARY source, never from memory or a secondary site:
#
#   kind: application   a Drugs@FDA product, read from the FDA's Drugs@FDA data files (www.fda.gov/media/89850,
#                       US government work, public domain): the application as "NDA 012345", the product's name, its
#                       holder and form, and its marketing status in the files ("Over-the-counter" or "Prescription";
#                       "Discontinued" never counts). The source line links the application's Drugs@FDA overview page.
#   kind: label         a DailyMed label (US National Library of Medicine, public domain) by set id and version, its
#                       marketing category as the SPL states it (an NDA, ANDA or BLA; for the over-the-counter side
#                       also an OTC monograph) and its marketing status (active). Each was matched to the molecule BY
#                       CODE: the label's active ingredient's UNII resolves, in the FDA's UNII table, to the
#                       molecule's own PubChem CID.
#
# `unsettled:` names a molecule whose two sides could not be settled from primary sources: its page is left as it is
# (its group's line) and every run reports it. The build refuses an unknown field, a missing one, or a status that is
# not the side's.

budesonide:
