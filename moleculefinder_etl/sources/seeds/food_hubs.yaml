    - {slug: caffeine, presence: natural, presence_note: "From the cocoa bean, in smaller amounts than theobromine."}
    - {slug: phenethylamine, presence: none, presence_note: "not yet checked"}
    - {slug: anandamide, presence: natural, presence_note: "Reported in small amounts in the cocoa bean."}
    - {slug: tyramine, presence: none, presence_note: "not yet checked"}
    - {slug: catechin, presence: natural, presence_note: "A flavanol of the cocoa bean."}
    - {slug: stearic-acid, presence: natural, presence_note: "Part of the fats of cocoa butter."}
    - {slug: palmitic-acid, presence: natural, presence_note: "Part of the fats of cocoa butter."}
    - {slug: oleic-acid, presence: natural, presence_note: "Part of the fats of cocoa butter."}
    - {slug: magnesium, presence: natural, presence_note: "A mineral of the cocoa solids."}
    - {slug: iron, presence: natural, presence_note: "A mineral of the cocoa solids."}
    - {slug: copper, presence: natural, presence_note: "A mineral of the cocoa solids."}
    - {slug: theophylline, presence: natural, presence_note: "Present in trace amounts in the cocoa bean."}   # trace, alongside theobromine

wine:
  name: Wine
  molecules:
    - {slug: ethanol, presence: formed, formed_when: fermentation, presence_note: "Made by yeast from the grape sugars."}
    - {slug: resveratrol, presence: natural, presence_note: "From the grape skins."}
    - {slug: tannic-acid, presence: none, presence_note: "not yet checked"}
    - {slug: tartaric-acid, presence: natural, presence_note: "The main acid of the grape."}
    - {slug: malic-acid, presence: natural, presence_note: "An acid of the grape; malolactic fermentation turns part of it into lactic acid."}
    - {slug: cyanidin, presence: natural, presence_note: "From the grape skins, as a glycoside among the red pigments."}
    - {slug: quercetin, presence: natural, presence_note: "From the grape skins."}
    - {slug: catechin, presence: natural, presence_note: "From the grape seeds and skins."}
    - {slug: gallic-acid, presence: natural, presence_note: "From the grape seeds and skins."}
    - {slug: succinic-acid, presence: formed, formed_when: fermentation, presence_note: "Made by yeast during fermentation."}
    - {slug: glycerol, presence: formed, formed_when: fermentation, presence_note: "Made by yeast during fermentation."}
    - {slug: acetic-acid, presence: formed, formed_when: fermentation, presence_note: "Made in fermentation; the volatile acidity of a wine."}   # the volatile acidity every wine carries a little of
    - {slug: isoamyl-alcohol, presence: formed, formed_when: fermentation, presence_note: "A fusel alcohol yeast make from leucine."}   # a fermentation fusel alcohol
    - {slug: potassium-bitartrate, presence: natural, presence_note: "From the grape; it crystallizes out of a cold bottle."}   # the "wine diamonds" that crystallize in a cold bottle
    - {slug: sodium-metabisulfite, presence: added, presence_note: "The sulfite the winemaker adds as a preservative."}   # the added sulfite the label has to declare
    - {slug: water, presence: natural, presence_note: "From the grape juice."}   # roughly 86 percent by weight
    - {slug: sulfur-dioxide, presence: added, presence_note: "The preservative the winemaker adds, directly or as a metabisulfite; yeast make a little too."}   # the preservative, declared on every label
    - {slug: acetaldehyde, presence: formed, formed_when: fermentation, presence_note: "Made by yeast; it rises as a wine oxidizes."}   # the marker of oxidation, and of sherry on purpose
    - {slug: histamine, presence: formed, formed_when: fermentation, presence_note: "Formed by bacteria in the malolactic fermentation."}   # forms in the malolactic fermentation
    - {slug: tyramine, presence: formed, formed_when: fermentation, presence_note: "Formed by bacteria during fermentation."}
    - {slug: methanol, presence: none, presence_note: "Released from grape pectin by enzymes during winemaking, not made by the yeast."}   # trace, released from grape pectin

beer:
  name: Beer
  molecules:
    - {slug: ethanol, presence: formed, formed_when: fermentation, presence_note: "Made by yeast from the malt sugars."}
    - {slug: maltose, presence: none, presence_note: "Made from the grain's starch by the malt's own enzymes in the mash, before fermentation."}   # what the mashed starch becomes
    - {slug: myrcene, presence: natural, presence_note: "From the hop oil."}   # hop oil
    - {slug: caryophyllene, presence: natural, presence_note: "From the hop oil."}   # hop oil
    - {slug: isoamyl-acetate, presence: formed, formed_when: fermentation, presence_note: "An ester the yeast make; the banana note of an ale."}   # the banana ester of an ale yeast
    - {slug: isoamyl-alcohol, presence: formed, formed_when: fermentation, presence_note: "A fusel alcohol yeast make from leucine."}
    - {slug: diacetyl, presence: formed, formed_when: fermentation, presence_note: "Made during fermentation; the yeast take most of it back up."}   # the butterscotch off-flavour brewers test for
    - {slug: acetaldehyde, presence: formed, formed_when: fermentation, presence_note: "Made by yeast during fermentation."}   # green apple, another fermentation marker
    - {slug: 2-nonenal, presence: formed, formed_when: aged, presence_note: "Forms from the grain's fats as a beer goes stale."}   # the cardboard note of a stale beer
    - {slug: glycerol, presence: formed, formed_when: fermentation, presence_note: "Made by yeast during fermentation."}
    - {slug: carbon-dioxide, presence: formed, formed_when: fermentation, presence_note: "Made by yeast in fermentation; many brewers also add it to carbonate."}
    - {slug: water, presence: added, presence_note: "The brewing water."}   # roughly 92 percent by weight
    - {slug: niacin, presence: natural, presence_note: "From the malt and the yeast."}   # from the brewing yeast
    - {slug: riboflavin, presence: natural, presence_note: "From the malt and the yeast."}

spirits:
  name: Spirits
  molecules:
    - {slug: ethanol, presence: formed, formed_when: fermentation, presence_note: "Made by fermentation, then concentrated by distillation."}
    - {slug: isoamyl-alcohol, presence: formed, formed_when: fermentation, presence_note: "A fusel alcohol from the fermentation, carried through distillation."}   # the largest fusel alcohol in a distillate
    - {slug: acetaldehyde, presence: formed, formed_when: fermentation, presence_note: "Made in the fermentation, carried through distillation."}
    - {slug: ethyl-acetate, presence: formed, formed_when: fermentation, presence_note: "An ester from the fermentation, carried through distillation."}   # the solvent-pear note of a young spirit
    - {slug: methanol, presence: none, presence_note: "Released from fruit pectin by enzymes, not made by the yeast."}   # a trace congener of any fruit distillate
    - {slug: furfural, presence: none, presence_note: "Taken up from the toasted oak barrel as the spirit ages."}   # from the barrel
    - {slug: vanillin, presence: none, presence_note: "Taken up from the charred oak barrel as the spirit ages."}   # from the charred oak
    - {slug: guaiacol, presence: none, presence_note: "Taken up from the charred oak barrel as the spirit ages."}   # from the char
    - {slug: maltol, presence: none, presence_note: "Taken up from the toasted oak barrel as the spirit ages."}

