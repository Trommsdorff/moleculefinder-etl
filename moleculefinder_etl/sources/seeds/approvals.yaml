# ── The 2026-12-care tranche (titanium dioxide, octinoxate, oxybenzone; Garrett's word 2026-11-15). The same basis
# as phase 3B: each checked on 2026-11-15 against the FDA's own final order on the OTC Monographs@FDA portal, the
# ingredient read from § M020.10 of M020 as amended by OTC000039 (the order's "M020 as amended" text), and the
# portal's latest-news list and the OTC000008 order page read for any later order: the only one, OTC000008-1
