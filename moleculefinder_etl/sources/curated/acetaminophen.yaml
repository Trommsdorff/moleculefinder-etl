editorial: |
  Acetaminophen, sold as Tylenol or paracetamol, eases pain and fever without the stomach
  irritation of the NSAIDs. The liver turns a small share of each dose into a reactive by-product,
  NAPQI, and neutralises it with glutathione; in an overdose the glutathione runs out and NAPQI
  damages liver cells.
