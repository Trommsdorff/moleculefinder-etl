    - {slug: hydroxymethylfurfural, presence: none, presence_note: "Forms slowly from the sugars in storage and faster when honey is heated; fresh honey holds little."}   # the standard freshness and heating marker
    - {slug: phenylacetic-acid, presence: natural, presence_note: "An aroma compound of honey."}   # a honey aroma note

fruit:
