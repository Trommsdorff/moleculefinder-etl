# The do-not-use list for a molecule's other names (Garrett, 2026-09-12). Renamed from
# title_synonym_do_not_use.yaml when it came to cover the synonym line as well as the title.
#
# PubChem lists some names as synonyms that are not the molecule at all: the plant or insect it
# comes from, a class it belongs to, one material made of it. assemble.display_synonyms builds the
# line under the H1 from those synonyms, and assemble.title_synonym puts one of them in the <title>
# when the page's own text mentions it, so such a name would read as another name for the molecule
# ("Apigenin (Chamomile)", "chamomile · versulin").
#
# Matched case-insensitively against the whole name, and kept off both the synonym line and the
# title's parenthetical. The search list (`synonyms`) is untouched. Every entry needs a reason.
# Brand names are deliberately not listed: "Fluoxetine (Prozac)" names the molecule as it is sold,
# and it stays.
- name: chamomile
  why: a plant; apigenin is one of the flavonoids in it
- name: ephedra
  why: the plant ephedrine is extracted from
- name: estrogen
  why: the class of hormones estradiol belongs to
- name: cochineal
  why: the insect carmine is made from
- name: vitamin A
  why: a group of compounds (retinol, retinal, retinoic acid and others), of which retinol is one
- name: fused quartz
  why: a glass made of silicon dioxide, one material form of it rather than the compound's name
# Their siblings (Garrett, 2026-09-12): the names that moved up onto the line once the six above
# left it.
- name: oestrogen
  why: the British spelling of estrogen, the class of hormones estradiol belongs to
- name: Mormon Tea
  why: a North American ephedra shrub and the tea brewed from it, not the molecule
- name: Mahuang
  why: ma huang, the Chinese ephedra plant ephedrine is extracted from
- name: C ochineal
  why: cochineal with a stray space, the insect carmine is made from (the garbled-name rule in assemble._readable_name drops it as well)
- name: red food coloring
  why: what carmine is used as, a label many other red dyes share, not a name for the molecule
- name: quartz glass
  why: another name for fused quartz, a glass made of silicon dioxide
- name: vitreous silica
  why: another name for fused quartz, a glass made of silicon dioxide
- name: fused silica
  why: another name for fused quartz, a glass made of silicon dioxide
