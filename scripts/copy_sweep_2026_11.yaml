editorial:
  caffeine:
    new: "Caffeine works by impersonation: it fits the brain's receptors for adenosine, the sleepiness signal that builds up the longer you are awake, without switching them on. Coffee, tea and cocoa plants each evolved their own way of making it, and in the leaves it is a natural pesticide."
    fails: "\"The world's most widely used psychoactive drug\" is a claim about what people do, and \"the only one routinely served to children\" is not something our data can show (named in the build plan)."
    basis: "Caffeine is an adenosine A1/A2A receptor antagonist; adenosine accumulates during wakefulness (both standard pharmacology; our adenosine line says the same). Independent evolution of caffeine biosynthesis in coffee, tea and cacao: Denoeud et al., Science 2014; Huang et al., PNAS 2016. Insecticidal at plant concentrations: Nathanson, Science 1984."
    candidates:
      - pick: true
        text: "Caffeine works by impersonation: it fits the brain's receptors for adenosine, the sleepiness signal that builds up the longer you are awake, without switching them on. Coffee, tea and cocoa plants each evolved their own way of making it, and in the leaves it is a natural pesticide."
        why: "Keeps the adenosine idea and adds two facts a reader will repeat: the trick is impersonation, and three unrelated plants arrived at the same molecule separately."
      - pick: false
        text: "Caffeine blocks adenosine, the brain's own sleepiness signal, which is why a cup lifts you. Coffee and tea plants make it, cocoa makes a little beside its larger store of theobromine, and energy drinks have it added by the maker."
        why: "Every clause from our own records: the adenosine line, and caffeine's presence marks (natural in coffee, tea and chocolate, added in energy drinks). Safer, less surprising."
      - pick: false
        plan: true
        text: "Caffeine occurs naturally in coffee, tea and cocoa, is added to energy drinks and soft drinks, and is an active ingredient in pain relievers such as Excedrin."
        why: "The build plan's proposal; Garrett found it too flat (2026-11-10). Not offered."
  acetaminophen:
    new: "Acetaminophen, sold as Tylenol or paracetamol, eases pain and fever without the stomach irritation of the NSAIDs. The liver turns a small share of each dose into a reactive by-product, NAPQI, and neutralises it with glutathione; in an overdose the glutathione runs out and NAPQI damages liver cells."
    fails: "\"The most common drug in the medicine cabinet\" (what people keep), \"the leading cause of acute liver failure\" (a health-outcome ranking) and \"narrower than most people assume\" (what people think) are all named or covered by the build plan."
    basis: "CYP2E1 oxidises about 5 to 10 percent of a dose to NAPQI, conjugated with glutathione; depletion leads to hepatocellular necrosis. Standard toxicology (StatPearls, Acetaminophen Toxicity)."
  nicotine:
    new: "Nicotine is the stimulant that makes tobacco addictive, and it clears fast: its half-life is only about two hours, part of why cravings return so quickly. In the plant it is a natural pesticide."
    fails: "\"One of the fastest-clearing drugs people use\" is a ranking our data cannot show (Garrett's review, 2026-11-10)."
    basis: "Our data: nicotine's half-life is 2.0 hours (its curated hook), checked by the build every run (nicotine_half_life_two_hours). Keeps \"only\" (\"only about two hours\")."

