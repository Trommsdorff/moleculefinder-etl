    - {slug: glucose, presence: natural, presence_note: "The bees' enzymes split nectar sucrose into fructose and glucose."}
    - {slug: sucrose, presence: natural, presence_note: "Nectar sugar the bees have not yet split."}
    - {slug: maltose, presence: natural, presence_note: "A minor sugar of honey."}
    - {slug: gluconic-acid, presence: natural, presence_note: "Made from glucose by the bees' glucose oxidase."}   # honey's principal acid
