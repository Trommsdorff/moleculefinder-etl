# Written comparisons for the /vs/<a>-vs-<b> pages (build plan 2026-09-05, phase 5).
#
# One entry per curated pair, keyed "slug-a/slug-b" in the order the page reads them.
# Which pairs get a page is the web repo's lib/compare-pairs.ts; this file is the prose.
# The web build fails if a listed pair has no text here, or a text here is not listed there,
# so the two cannot drift apart.
#
# RULES, enforced by relationships._comparison_prose_errors and not merely remembered:
#   * 4 to 6 sentences, at least 320 characters. Shorter is not worth a page.
#   * Written from the STRUCTURED RECORD only: formula, weight, family, functional groups,
#     GHS, the oral LD50 with its route and species, sweetness, Scoville, half-life, foods,
#     brands. Plus public-domain background a reader would recognise. No Wikipedia prose.
#   * No medical advice, no dosing, no "which should I take". These pages line two records
#     up beside each other. Choosing between two medicines is not a thing a database does.
#   * No em-dashes (house rule). Plain English.
#
# The page renders the side-by-side table from the two molecule files, so the prose should
# say what the table cannot: what the difference MEANS, and where a person meets each one.
#
# THE ANSWER LINE (SEO run 1, 2026-10-28). Each pair is {answer, text}. `answer` is the one
# sentence a searcher asking "X vs Y" wants: what the difference is. It is the page's meta and
# OpenGraph description, the first line of its prose (above `text`, whose first sentence was
# edited where it would now repeat the line) and the FAQ's answer to "What is the difference
# between X and Y?". Enforced by relationships._answer_errors: under 160 characters, one
# sentence ending in a full stop, both molecules named by their page titles, no advice or
# dosing words (the web's lib/copy-rules.ts ADVICE plus the patterns above), no dash.
# Written from the pair's own text: an answer line states nothing the paragraph does not.
#
# THE SEARCHER'S WORDS (SEO run 2, 2026-10-28). Search Console shows people typing the brand or
# the common name ("hydroxyzine vs benadryl", "nicotinic acid vs niacinamide"). Where a page
# already covers the pair, its answer line uses those words, and an optional `names` map gives
# the title a parenthetical for one or both molecules ("Hydroxyzine vs Diphenhydramine
# (Benadryl)"), under the molecule page's own rule: the name must be a curated brand, a Wikidata
# name, a synonym, the ETL's title synonym or the slug of that molecule, it must appear in the
# answer line (the page's own words), and it drops when the title would pass 65 characters
# (relationships._names_errors; the web's lib/titles.ts::pairTitle). A searcher's name the record
# does not carry ("corn starch", "agar agar") goes in the answer line only.

# ── Stimulants and the xanthines ───────────────────────────────────────────────
caffeine/theobromine:
  answer: "Caffeine carries three methyl groups and theobromine two, so caffeine blocks adenosine far harder while theobromine acts more gently and lasts longer."
  text: >
    The two share one molecular skeleton, and that one methyl group is the whole of the
    C8H10N4O2 against C7H8N4O2 in the table. That one group changes how strongly each binds
    the brain's adenosine receptors, and caffeine binds far harder, which is why coffee
    arrives as a jolt and chocolate does not. Theobromine lingers longer instead, with a
    half-life around 7.2 hours against caffeine's 5, so cocoa's lift is slower and flatter.
    Both come from the same plants in different proportions: coffee and tea lead with
    caffeine, cocoa leads with theobromine. The reported oral LD50 also splits them, 192 mg/kg
    in rats for caffeine against 300 mg/kg in dogs for theobromine, and it is theobromine that
    dogs clear too slowly to tolerate.

caffeine/theophylline:
  answer: "Theophylline is caffeine minus one methyl group, and theophylline also relaxes airway muscle strongly enough to have been a long-standing asthma medicine."
  text: >
    The formulas show that one group, C7H8N4O2 against C8H10N4O2, and the two sit in the same
    alkaloid family for that reason. Both block adenosine, but theophylline also relaxes
    airway muscle strongly enough that it was used as an asthma medicine for most of the
    twentieth century, which caffeine never was. It stays in the body longer, a half-life near
    8 hours against caffeine's 5. Tea carries both, with caffeine dominant and theophylline in
    traces, so a cup does not deliver a medicinal amount of either. Their reported oral LD50
    values are close, 192 mg/kg in rats for caffeine and 332 mg/kg in mice for theophylline,
    which is a reminder that the gap between the two is about what they do rather than about
    how toxic they are.

nicotine/caffeine:
  answer: "Nicotine switches on acetylcholine receptors directly while caffeine blocks adenosine receptors, and nicotine is far more habit forming and clears faster."
  text: >
    Both are plant alkaloids that plants make to poison insects, and both are stimulants in
    people, but they act on completely different receptors. Nicotine binds acetylcholine
    receptors directly; caffeine works by blocking adenosine, the molecule that builds up
    while you are awake and makes you feel sleepy. The habit-forming pull is not comparable:
    nicotine is one of the most reinforcing drugs known, and caffeine produces a mild
    dependence that shows up mostly as a headache when it stops. Nicotine also clears far
    faster, a half-life near 2 hours against caffeine's 5, which is part of why smoking is
    paced in minutes and coffee in hours. Their oral LD50 values in rats are almost identical
    at 188 and 192 mg/kg, which says nothing useful about how each is actually encountered.

adenosine/caffeine:
  answer: "Adenosine is the body's own sleepiness signal and caffeine blocks its receptors without switching them on, so the two are opponents rather than alternatives."
  text: >
    That opposition is the whole reason the pair is interesting. Adenosine is a molecule your
    body makes continuously while you are awake, and as it accumulates and settles onto its
    receptors, you feel more and more like sleeping. Caffeine happens to fit those same
    receptors closely enough to occupy them without switching them on, so the sleepiness
    signal keeps being sent and stops being heard. Nothing is added by the coffee: the
    alertness is the absence of a message. When the caffeine clears, the adenosine that piled
    up in the meantime is still there and lands all at once, which is what an afternoon crash
    actually is. Their structures show the family resemblance, both purines, adenosine
    carrying a whole ribose sugar that caffeine lacks.

taurine/caffeine:
  answer: "Caffeine is the energy drink ingredient that produces alertness by blocking adenosine, while taurine is an amino sulfonic acid the body makes for other jobs."
  text: >
    These two share a can and almost nothing else. Caffeine is a plant alkaloid that blocks
    adenosine receptors, and it is the ingredient in an energy drink that produces the
    alertness. Taurine is an amino sulfonic acid your own body makes and holds in large
    amounts in muscle, heart and brain, where it works on cell volume, calcium handling and
    bile salts rather than on wakefulness. The formulas hardly overlap, C8H10N4O2 against
    C2H7NO3S, and taurine is barely a third of caffeine's weight. Taurine is in energy drinks
    for reasons that have more to do with marketing history than with stimulation, which is
    worth knowing before reading anything into the label.

# ── Painkillers ────────────────────────────────────────────────────────────────
acetaminophen/ibuprofen:
  answer: "Ibuprofen is an NSAID that eases inflammation as well as pain, while acetaminophen acts mainly in the central nervous system and does little for inflammation."
  text: >
    These are the two painkillers most households keep, and they are not the same kind of
    drug. Ibuprofen is an NSAID: it blocks the COX enzymes throughout the body, which is why
    it reduces inflammation and swelling as well as pain. Acetaminophen, called paracetamol
    outside the US, acts mainly in the central nervous system and does very little for
    inflammation, which is why a sprain and a headache are not the same problem for it. The
    functional groups in the table show the split, ibuprofen carrying a carboxylic acid and
    acetaminophen an amide and a phenol. Their reported oral LD50 values differ by a factor of
    nearly four, 2400 mg/kg in rats for acetaminophen against 636 mg/kg for ibuprofen, though
    the risks that actually matter for each are organ specific rather than a matter of the
    headline number.

acetaminophen/aspirin:
  answer: "Aspirin blocks COX enzymes irreversibly and affects platelets for days, while acetaminophen works centrally and leaves inflammation and clotting alone."
  text: >
    Aspirin is the older molecule by a century and the more chemically aggressive of the two.
    It is acetylsalicylic acid, made by acetylating willow-bark salicylic acid in 1897, and it
    blocks the COX enzymes irreversibly, which is why a single exposure affects platelets for
    days. Acetaminophen does not do that at all: it works centrally, has little
    anti-inflammatory effect, and leaves clotting alone. The table shows aspirin's carboxylic
    acid and ester against acetaminophen's amide and phenol, which is the structural reason
    aspirin irritates a stomach lining and acetaminophen does not. Reported oral LD50 in rats
    is 200 mg/kg for aspirin against 2400 mg/kg for acetaminophen, an unusually wide gap for
    two drugs sold on the same shelf.

aspirin/ibuprofen:
  answer: "Aspirin and ibuprofen are both NSAIDs, but aspirin disables the COX enzyme permanently while ibuprofen lets go, so its effect fades as it clears."
  text: >
    Both carry a carboxylic acid on an aromatic ring, so they are far closer relatives than
    either is to acetaminophen. The difference is reversibility. Aspirin acetylates the enzyme
    permanently, so its effect on platelets outlives the molecule in the blood, which is the
    basis of its use in cardiology. Ibuprofen binds and lets go, so its effect fades as it
    clears, with a half-life near 2 hours. Ibuprofen is also the more potent anti-inflammatory
    at the doses people actually use, and it is the newer molecule by seventy years. Reported
    oral LD50 in rats is 200 mg/kg for aspirin and 636 mg/kg for ibuprofen.

ibuprofen/naproxen:
  answer: "Ibuprofen and naproxen are both NSAIDs, but naproxen lasts far longer, with a half-life near 14 hours against about 2 for ibuprofen."
  text: >
    These are the closest pair on the OTC shelf: both propionic acid derivatives, both
    blocking COX. The practical difference is time. Ibuprofen has a half-life near 2 hours and
    naproxen near 14, which is why one is taken through the day and the other is sold as a
    twice-daily tablet under the name Aleve. Naproxen is the heavier molecule at 230.26
    against 206.28 and carries an extra ether group on a naphthalene ring rather than
    ibuprofen's simple benzene. Reported oral LD50 sits at 636 mg/kg in rats for ibuprofen and
    1234 mg/kg in mice for naproxen, measured in different species, so the two numbers are not
    directly comparable.

celecoxib/ibuprofen:
  answer: "Ibuprofen blocks COX-1 and COX-2 about equally, while celecoxib was designed to hit COX-2 and largely spare COX-1, which maintains the stomach lining."
  text: >
    Both are NSAIDs, but they aim at different halves of the same enzyme family. Ibuprofen
    blocks COX-1 and COX-2 more or less equally; celecoxib was designed to hit COX-2 while
    largely sparing COX-1, which is the enzyme that maintains the stomach lining and normal
    platelet function. That selectivity is the entire reason celecoxib exists, and it shows in
    the structure: a sulfonamide and a trifluoromethyl group on a pyrazole core, nothing like
    ibuprofen's small propionic acid. Celecoxib is prescription only and ibuprofen is sold
    over the counter, which is the most visible difference to a shopper. It is also nearly
    twice the weight, 381.4 against 206.28.

meloxicam/ibuprofen:
  answer: "Meloxicam leans toward COX-2 and lingers in the body far longer than ibuprofen, and it is prescription only in most countries where ibuprofen is not."
  text: >
    Both are NSAIDs, and meloxicam is dosed once a day where ibuprofen is dosed through the
    day. The structures are not close: meloxicam is an oxicam built on a thiazine ring with a
    sulfur-containing core, while ibuprofen is a small propionic acid on a benzene ring, and
    the weights differ accordingly at 351.4 against 206.28. Meloxicam is prescription only in
    most countries and ibuprofen is not, which is the practical line between them. Both carry
    the class effects NSAIDs share, on the stomach lining and on the kidneys, and neither
    selectivity nor dosing schedule removes those.

morphine/fentanyl:
  answer: "Morphine and fentanyl bind the same opioid receptor, but synthetic fentanyl reaches the brain in minutes and acts at a small fraction of the amount."
  text: >
    The receptor is the mu-opioid receptor, and the enormous difference between them is how
    tightly and how easily they get there. Morphine is the natural alkaloid isolated from
    opium poppy in 1804, a rigid five-ring structure with two hydroxyl groups that make it
    relatively water-loving and slow to cross into the brain. Fentanyl is fully synthetic,
    much smaller in ring count, and far more fat-soluble, so it reaches the brain in minutes
    and acts at a small fraction of the amount. The reported oral LD50 values sit at 335 mg/kg
    in rats for morphine and 18 mg/kg in rats for fentanyl, a ratio that understates the
    difference in potency at ordinary exposures. That potency gap is the reason fentanyl
    dominates overdose statistics: the margin between a working amount and a fatal one is
    measured in units a kitchen scale cannot see.

tramadol/oxycodone:
  answer: "Oxycodone, sold as Oxycontin, is a plain opioid close to morphine; tramadol binds the opioid receptor weakly and also acts on serotonin and norepinephrine."
  names: { oxycodone: Oxycontin }
  text: >
    Both are opioids and both are prescription painkillers, but tramadol is the odder molecule
    of the two. It binds the mu-opioid receptor weakly and also blocks the reuptake of
    serotonin and norepinephrine, so part of what it does is not opioid pharmacology at all.
    Oxycodone is a straightforward semi-synthetic opioid derived from thebaine, closer in
    structure and in effect to morphine. Tramadol also depends heavily on a liver enzyme to
    become its active form, which is why its effect varies between people more than
    oxycodone's does. Both are controlled substances in most countries, and both appear in
    this catalog as prescription medicines rather than as anything found in a food.

codeine/tramadol:
  answer: "Codeine is a poppy alkaloid the liver turns into morphine, while tramadol is synthetic and also blocks serotonin and norepinephrine reuptake."
  text: >
    Both are weak opioids that owe much of their effect to being converted by the liver into
    something stronger, which is the most interesting thing they share. Codeine is a natural
    poppy alkaloid, morphine with a methyl group on one oxygen, and the enzyme CYP2D6 strips
    that group to make morphine. Tramadol is fully synthetic and unrelated in shape, and the
    same enzyme turns it into a metabolite with far more opioid activity than the parent. In
    both cases a person's version of that enzyme decides how much drug they are actually
    getting, which is a real source of variation between people. Tramadol adds serotonin and
    norepinephrine reuptake blocking that codeine does not have, so the two are not simply
    different strengths of the same idea.

oxycodone/hydrocodone:
  answer: "Oxycodone and hydrocodone are nearly the same molecule, both semi-synthetic opioids made from thebaine, differing by one hydroxyl group that oxycodone carries."
  text: >
    These two are close enough that people mix them up routinely. Both bind the mu-opioid
    receptor, both are prescription painkillers, and both are controlled in the US and
    elsewhere. Hydrocodone is very often sold combined with acetaminophen, which oxycodone
    sometimes is and sometimes is not, and that combination is the reason a hydrocodone
    product carries a second drug's limits along with its own. The weights differ by the
    oxygen alone, 315.4 against 299.4. Both entries here carry the same GHS hazard framing and
    the same prescription-medicine bucket.

naloxone/naltrexone:
  answer: "Naloxone reverses an opioid overdose within minutes, while naltrexone survives the gut and lasts many hours; both block the same opioid receptor."
  text: >
    These two are constantly confused, they differ by one small chemical group, and what they
    are used for could hardly be less alike. Both are opioid antagonists: they occupy the
    mu-opioid receptor and switch nothing on, which displaces any opioid already there.
    Naloxone is poorly absorbed by mouth and acts within minutes when injected or sprayed into
    the nose, which is why it is the overdose reversal agent carried in emergency kits.
    Naltrexone survives the gut, lasts many hours, and is used to maintain a blocked receptor
    over time rather than to rescue anyone in an emergency. The structural difference is an
    allyl group on naloxone against a cyclopropylmethyl group on naltrexone, and the weights
    are 327.4 and 341.4.

# ── Sweeteners and sugars ──────────────────────────────────────────────────────
sucralose/aspartame:
  answer: "Sucralose is chlorinated sucrose that the body cannot digest and that survives baking, while aspartame is a dipeptide the body breaks down and heat destroys."
  text: >
    Both replace sugar and neither is a sugar. Sucralose actually starts as sucrose with three
    hydroxyl groups swapped for chlorine, which is why its formula carries Cl3 and why the
    body cannot digest it: the enzymes no longer recognise the shape. Aspartame is not a
    carbohydrate at all but a dipeptide, phenylalanine joined to aspartic acid, which the body
    does break down, and that is why products carry a phenylalanine warning for people with
    phenylketonuria. Sucralose is the sweeter of the two at roughly 600 times sugar against
    aspartame's 200, and it is heat stable where aspartame breaks down when baked. In practice
    sucralose is the yellow packet and aspartame is the blue one.

aspartame/saccharin:
  answer: "Saccharin is the older, smaller and sweeter molecule and survives baking, while aspartame is a dipeptide that heat breaks down and that delivers phenylalanine."
  text: >
    Saccharin was discovered in 1879, a century before aspartame, and it is a small
    sulfur-containing ring at 183.19 against aspartame's 294.3. Saccharin is also the sweeter
    of the two, roughly 400 times sugar against 200, and it is the one with the metallic
    aftertaste that shows up at higher concentrations. Aspartame breaks down with heat and
    cannot be baked with; saccharin is stable and can. The reported oral LD50 for saccharin is
    14200 mg/kg in rats, which is very high, and much of saccharin's reputation traces to a
    1970s rat bladder study whose mechanism turned out not to apply to people. Aspartame's
    constraint is different and specific: it delivers phenylalanine.

sucralose/stevioside:
  answer: "Sucralose is made in a factory from sugar and stevioside is extracted from the stevia leaf, and sucralose is the sweeter of the two."
  text: >
    That is the difference most shoppers are actually asking about. Sucralose is sucrose with
    three chlorines substituted in, indigestible and about 600 times as sweet as sugar.
    Stevioside is a steviol glycoside from the Stevia rebaudiana leaf, a much larger molecule
    at 804.9 against 397.6, around 300 times as sweet, and it carries a liquorice bitterness
    in the aftertaste that sucralose does not have. Most commercial stevia products are
    purified away from stevioside toward rebaudioside A precisely to lose that bitterness.
    Both pass through largely unmetabolised, which is why both contribute essentially no
    calories.

xylitol/erythritol:
  answer: "Xylitol and erythritol are sugar alcohols one carbon apart; xylitol is about as sweet as sugar and toxic to dogs, while erythritol is less sweet and is not."
  text: >
    Both are used in sugar-free gum and tabletop sweeteners, and the formulas show the one
    carbon: C5H12O5 against C4H10O4. That single carbon changes what the body does with them.
    Erythritol is absorbed in the small intestine and excreted largely unchanged, so it
    reaches the gut bacteria in small amounts and causes less digestive upset; xylitol is
    fermented further along and is the more likely of the two to cause it. Xylitol is the
    sweeter, roughly as sweet as sugar, while erythritol lands near 60 percent. One difference
    is not about people at all: xylitol is dangerously toxic to dogs, and erythritol is not.

erythritol/allulose:
  answer: "Erythritol is a sugar alcohol and allulose is a real sugar, so allulose browns and caramelises like sugar while erythritol does not."
  text: >
    These are both sugar substitutes that behave almost like sugar in the mouth but not in the
    body, and they belong to different chemical classes. Erythritol is a sugar alcohol,
    C4H10O4, absorbed and excreted essentially unchanged. Allulose is a real sugar, a rare
    epimer of fructose with the same C6H12O6 formula as glucose, which the body absorbs but
    barely metabolises. That distinction matters in the kitchen: allulose browns and
    caramelises the way sugar does because it is one, and erythritol does not. Erythritol has
    the cooling mouthfeel that sugar alcohols share, while allulose does not, and allulose is
    the sweeter of the two, roughly 70 percent as sweet as sugar against erythritol's 60.

stevioside/rebaudioside-a:
  answer: "Stevioside and rebaudioside A are steviol glycosides from the same leaf, one sugar unit apart, and rebaudioside A lacks stevioside's liquorice bitterness."
  text: >
    That extra sugar unit is why rebaudioside A is the heavier molecule at 967.0 against
    804.9. Both are steviol glycosides: the same steviol core with different sugars hung off
    it. Stevioside is the more abundant compound in the raw leaf and around 300 times as sweet
    as sugar, but it carries a liquorice bitterness in the finish. Rebaudioside A is the
    cleaner tasting of the two and as sweet, near 300 times sugar, which is why most
    commercial stevia products are purified toward it. Reading a stevia label as one
    ingredient hides this: the taste depends almost entirely on the ratio between these two.

glucose/fructose:
  answer: "Glucose and fructose share the formula C6H12O6, but glucose forms a six-membered ring and fructose a five-membered one, and fructose is far sweeter."
  text: >
    Their weights are identical too, and fructose carries a ketone where glucose has an
    aldehyde. That difference decides where each goes. Nearly every cell in the body can burn
    glucose directly, and blood sugar means glucose specifically, while fructose is handled
    almost entirely by the liver. Fructose is the sweeter of the two by a wide margin, which
    is why fruit tastes sweeter than its sugar content alone suggests. Table sugar is one of
    each joined together, and high-fructose corn syrup is the same two sugars unjoined and
    slightly rebalanced.

sucrose/fructose:
  answer: "Sucrose is table sugar, one glucose joined to one fructose, so fructose is half of it, and fructose on its own tastes sweeter gram for gram."
  text: >
    The bond joining sucrose's two halves is split by the enzyme sucrase in the small
    intestine. The weights show it, 342.3 for sucrose against 180.16 for fructose, roughly
    double minus the water lost when the two joined. Sucrose is the reference point for the
    entire sweetness scale, defined as exactly 1, and fructose is meaningfully sweeter than
    that. Once swallowed, sucrose is taken apart within minutes, so the difference between
    eating table sugar and eating its two halves separately is smaller than it looks. Where it
    does show up is in the mouth: fructose reads sweeter per gram, which is why syrups made
    from it go further.

lactose/galactose:
  answer: "Lactose is milk sugar, glucose and galactose joined together, while galactose is a single sugar, one of the two halves lactase splits lactose into."
  text: >
    This pair is a molecule and its component rather than two competitors. Lactose is glucose
    joined to galactose at 342.3; splitting it needs the enzyme lactase, and most adults
    worldwide stop making enough lactase after childhood, which is what lactose intolerance
    is. Galactose alone is 180.16 and has the same formula as glucose, differing only in the
    orientation of one hydroxyl group. Babies handle both easily, and a rare inherited
    inability to process galactose is screened for at birth in many countries. Neither is
    especially sweet: lactose is one of the least sweet common sugars, which is why milk does
    not taste sugary.

glucose/glycogen:
  answer: "Glycogen is thousands of glucose units branched together, the form in which the liver and muscles store glucose until the body needs it."
  text: >
    That is why glycogen's listed formula and weight represent a fragment rather than a fixed
    molecule. The body keeps glucose in the blood within a narrow range and stores the rest as
    glycogen in the liver and muscle, unpacking it when the level drops. Branching is the
    point: a branched chain has many free ends, so many enzymes can strip glucose off at once
    and release it quickly. Muscle glycogen is only available to that muscle, while liver
    glycogen is released into the blood for the whole body. Carb-loading before an endurance
    event is about filling those stores rather than about eating any particular sugar.

monosodium-glutamate/sodium-chloride:
  answer: "Sodium chloride tastes salty through its sodium, while monosodium glutamate tastes umami through its glutamate and carries about a third of the sodium."
  text: >
    Both are sodium salts that a cook reaches for, and they trigger different taste receptors.
    Sodium chloride is read as salty by ion channels responding to the sodium itself;
    monosodium glutamate is read as umami by a receptor that detects the glutamate half, and
    the sodium is incidental. MSG carries roughly a third of the sodium of table salt for the
    same weight, since most of its mass is the glutamate. Glutamate is one of the twenty
    standard amino acids and is present naturally in tomatoes, parmesan, soy sauce and
    mushrooms, so the taste is not novel even where the ingredient is. The reported oral LD50
    for table salt is 3000 mg/kg in rats, higher than several substances people treat with
    more caution.

# ── Alcohols and solvents ──────────────────────────────────────────────────────
ethanol/methanol:
  answer: "Ethanol and methanol differ by one carbon, but the body turns methanol into formic acid, which attacks the optic nerve, and ethanol into acetic acid."
  text: >
    The formulas show that one carbon, C2H6O against CH4O, and it is the difference between an
    intoxicant and a poison. The body oxidises both with the same enzymes. Ethanol becomes
    acetaldehyde and then acetic acid, which the body handles routinely. Methanol becomes
    formaldehyde and then formic acid, which attacks the optic nerve and drives the acidosis
    that makes methanol poisoning dangerous. Methanol's listed oral LD50 is 5628 mg/kg in
    rats, not a figure that marks it as a poison, which is exactly why the LD50 is a poor
    guide here: the danger is what the metabolites do, not the parent molecule. Methanol is
    present in tiny amounts in fermented drinks and is the reason improperly distilled spirits
    are hazardous.

ethanol/isopropyl-alcohol:
  answer: "Ethanol and isopropyl alcohol, or isopropanol, both disinfect, but only ethanol is a drink: the body turns isopropyl alcohol into acetone, not acetic acid."
  text: >
    Isopropyl alcohol has one more carbon and branches, C3H8O against C2H6O, and the body
    oxidises it to acetone rather than to acetic acid, which is why swallowing it causes a
    very different and more dangerous picture than drinking ethanol. As a disinfectant, 70
    percent solutions of either outperform higher concentrations, because some water is needed
    for the alcohol to get through a cell wall before it denatures the proteins inside.
    Isopropyl alcohol evaporates leaving less residue, which is why it is the one used on
    electronics. The reported oral LD50 for isopropyl alcohol is 4797 mg/kg in dogs.

acetone/isopropyl-alcohol:
  answer: "Acetone is rubbing alcohol, isopropyl alcohol, with two hydrogens removed, one oxidation step apart, and acetone is by far the harsher solvent of the two."
  text: >
    That oxidation step is exactly what the liver does to isopropyl alcohol. That is why
    acetone shows up on the breath after isopropyl alcohol exposure, and also why the body
    produces acetone on its own when it burns fat for fuel. As solvents they behave
    differently: acetone is a ketone and dissolves plastics, resins and nail polish that
    isopropyl alcohol leaves alone, which is why acetone is the aggressive one. Both are
    highly flammable and both carry a GHS Danger signal word. Weights are close at 58.08 and
    60.1, so the difference is entirely in the functional group.

acetone/ethyl-acetate:
  answer: "Acetone is a fast, harsh ketone solvent, while ethyl acetate is a gentler, slower evaporating ester and is what acetone-free nail polish removers contain."
  text: >
    These are the two solvents in nail polish remover, and the choice between them is about
    aggression. Acetone is a small ketone that dissolves polish fast and also strips oils from
    skin and nail, which is the drying people notice. Ethyl acetate is an ester, heavier at
    88.11 against 58.08, slower to evaporate and gentler on the nail plate, which is why it is
    what acetone-free removers actually contain. Ethyl acetate also smells fruity rather than
    sharp, and it occurs naturally in wine and ripe fruit. Both are flammable and both carry a
    GHS Danger signal word, so acetone-free is a statement about the solvent, not about the
    hazard class.

hydrogen-peroxide/isopropyl-alcohol:
  answer: "Hydrogen peroxide kills microbes by oxidising them and breaks down to water and oxygen; isopropyl alcohol, rubbing alcohol, denatures proteins and evaporates."
  text: >
    Both sit in the same first-aid cabinet and they kill microbes by different mechanisms.
    Hydrogen peroxide is an oxidiser: it breaks down into water and oxygen, and the fizzing on
    a cut is that reaction being catalysed by an enzyme in your own tissue. Isopropyl alcohol
    denatures proteins and dissolves membranes instead, which is faster and does not depend on
    contact with tissue enzymes. Peroxide is the milder disinfectant of the two at the 3
    percent strength sold for household use, and it also damages healthy cells in a wound,
    which is why its use on open cuts has fallen out of favour. Alcohol evaporates and leaves
    nothing behind; peroxide leaves water.

hydrogen-peroxide/sodium-hypochlorite:
  answer: "Hydrogen peroxide breaks down into only water and oxygen, while sodium hypochlorite, household bleach, leaves salt behind and is the stronger disinfectant."
  text: >
    Both are oxidising bleaches sold for household cleaning, and they leave very different
    residues. Hydrogen peroxide decomposes into water and oxygen and nothing else, which is
    why it is the one used on fabric and hair where a chlorine smell would be unwelcome.
    Sodium hypochlorite releases hypochlorous acid in water, which is the active destroyer of
    stain pigments and microbial proteins, and it leaves salt behind. Bleach is much the
    stronger disinfectant at ordinary household concentrations. The important practical
    difference is not on either page alone: bleach mixed with ammonia or with acid releases
    toxic gases, and peroxide does not do that.

ammonia/sodium-hypochlorite:
  answer: "Ammonia cleans glass and grease and sodium hypochlorite is bleach, and mixing the two makes chloramines, a toxic gas that badly irritates the airways."
  text: >
    That reaction is the one reason this pair matters. Sodium hypochlorite in water releases
    hypochlorous acid, and hypochlorous acid reacts with ammonia to form chloramines, which
    irritate the airways badly and can be dangerous in an enclosed room. Both are common
    household cleaners in their own right, bleach for whitening and disinfecting and ammonia
    for glass and grease, and both carry a GHS Danger signal word on their own. Ammonia is the
    far smaller molecule at 17.03 against 74.44 and is a gas dissolved in water rather than a
    salt. The reason many cleaning products warn against mixing is this reaction specifically.

ethylene-glycol/propylene-glycol:
  answer: "The body turns ethylene glycol into oxalic acid, which harms the kidneys, and propylene glycol into lactic acid, which it handles routinely."
  text: >
    The difference is toxicological rather than chemical. Ethylene glycol is C2H6O2 and the
    body oxidises it to oxalic acid, which forms calcium oxalate crystals in the kidneys, and
    that is what makes antifreeze poisoning so damaging. Propylene glycol is C3H8O2 and is
    metabolised to lactic acid, which the body handles routinely, which is why it is permitted
    in food, e-liquid, and medicines. Both are sweet tasting, and the sweetness of ethylene
    glycol is a recurring hazard to pets and children. Many antifreeze products now use
    propylene glycol for exactly that reason, and some add a bitterant to the ethylene glycol
    kind.

glycerol/propylene-glycol:
  answer: "Glycerol has one more hydroxyl group than propylene glycol, making it thicker and a stronger humectant, while propylene glycol is the better flavour solvent."
  text: >
    Both are viscous, sweet-tasting alcohols used to hold water in a product, C3H8O3 against
    C3H8O2. That extra group makes glycerol thicker and more strongly humectant, which is why
    it dominates in skincare, toothpaste and food glazes. Propylene glycol is thinner and a
    better solvent for flavour compounds, which is why it carries the flavour in e-liquid and
    in many oral medicines while glycerol supplies the visible vapour. Glycerol is also a real
    metabolic molecule: it is the backbone every triglyceride is built on, so the body has an
    established route for it. Both are widely permitted in food.

# ── The kitchen and the cupboard ───────────────────────────────────────────────
sodium-bicarbonate/sodium-carbonate:
  answer: "Sodium bicarbonate is baking soda, mildly alkaline and edible, while sodium carbonate is washing soda, strongly alkaline and used for laundry and grease."
  text: >
    Baking soda and washing soda are the same two elements in different proportions, NaHCO3
    against Na2CO3, and the extra sodium makes all the difference to how alkaline they are.
    Sodium bicarbonate is mildly alkaline and safe to eat, which is why it leavens cake and
    settles indigestion. Sodium carbonate is strongly alkaline, will irritate skin, and is
    used to soften laundry water and cut grease. Heating baking soda in an oven converts it
    into washing soda, releasing carbon dioxide and water, which is the same reaction that
    raises a cake. In baking, the carbon dioxide is the point; in cleaning, the alkalinity is.

# SEO run 2 (2026-10-28): "calcium carbonate vs baking soda" in Search Console with no page.
calcium-carbonate/sodium-bicarbonate:
  answer: "Calcium carbonate is chalk, neutralising acid slowly and leaving calcium behind, while sodium bicarbonate is baking soda, neutralising it fast with a fizz."
  text: >
    Both are mild alkalis that neutralise stomach acid, and both appear on antacid labels, but
    they are different kinds of substance. Calcium carbonate, CaCO3 at 100.09, is chalk,
    limestone and eggshell: insoluble in water, it reacts only as acid reaches it, so it works
    slowly and leaves calcium behind, which is why it doubles as a calcium supplement. Sodium
    bicarbonate, NaHCO3 at 84.007, is baking soda: it dissolves readily, neutralises acid at once
    and releases carbon dioxide as it does, the fizz of an effervescent tablet and the lift in a
    cake. That reaction also means baking soda carries sodium, which calcium carbonate does not.
    Neither carries a GHS hazard label, and their reported oral LD50 values in rats are close,
    6450 mg/kg for calcium carbonate and 4220 mg/kg for sodium bicarbonate.

sodium-hydroxide/sodium-bicarbonate:
  answer: "Sodium bicarbonate is a weak alkali mild enough to eat, while sodium hydroxide is caustic soda, strong enough to dissolve fat and hair and corrosive to skin."
  text: >
    Both are alkaline and they sit at opposite ends of that scale. Sodium bicarbonate is weak
    enough to eat and is used to neutralise acid in a stomach or a recipe. Sodium hydroxide is
    caustic soda, strong enough to saponify fat and dissolve hair, which is what makes it the
    active ingredient in drain cleaner and in soap making. The GHS classifications say it
    plainly: sodium hydroxide carries the corrosive pictogram and bicarbonate does not.
    Weights are close at 40.0 and 84.01, which is a reminder that molecular size says nothing
    about hazard. Sodium hydroxide releases significant heat when it dissolves, and
    bicarbonate does not.

borax/sodium-bicarbonate:
  answer: "Sodium bicarbonate is an edible, mildly alkaline sodium salt, while borax is a more strongly alkaline boron compound that is not edible."
  text: >
    Both are white powders sold in the laundry aisle and they are not interchangeable. Sodium
    bicarbonate is a simple sodium salt of carbonic acid, mildly alkaline, edible, and used as
    much in baking as in cleaning. Borax is sodium tetraborate, a boron compound, more
    strongly alkaline, and not edible: boron compounds carry reproductive-toxicity
    classifications in the EU and borax is restricted in consumer products there. Borax is the
    better water softener and stain remover of the two because of that higher alkalinity, and
    bicarbonate is the better deodoriser because it neutralises acids directly. Their weights
    are far apart, 201.2 for the anhydrous borax on record against 84.01.

acetic-acid/citric-acid:
  answer: "Acetic acid has one acid group and is the sour and smell of vinegar, while citric acid has three, is an odourless solid and binds metal ions well."
  text: >
    Both are the sour in a kitchen and they behave differently because of how many acid groups
    each carries. Acetic acid has one carboxylic acid group and is the whole of vinegar's
    sourness and smell, volatile enough to fill a room. Citric acid has three, is a solid
    crystal, and has no smell at all, which is why lemon-flavoured products use citric acid
    for the sour and something else for the aroma. Those three groups also make citric acid a
    good chelator, binding metal ions, which is why it descales a kettle better than vinegar
    does. Citric acid is far heavier at 192.12 against 60.05, and it is a real intermediate in
    the citric acid cycle that every aerobic cell runs.

citric-acid/ascorbic-acid:
  answer: "Vitamin C is ascorbic acid, a vitamin humans must get from food, while citric acid is not a vitamin at all and the body makes it constantly."
  names: { ascorbic-acid: Ascorbic acid }
  text: >
    These two are often confused because both are sour, both come from citrus, and both are
    used as preservatives. Ascorbic acid is vitamin C, which humans cannot make and must eat;
    citric acid is not a vitamin at all and the body produces it constantly as part of the
    citric acid cycle. Citric acid preserves by lowering pH, while ascorbic acid preserves by
    being oxidised in place of the food, which is why it stops cut apples browning. Their
    weights are close, 192.12 and 176.12, and both are white crystalline powders, which is
    part of why the labels get misread. A product listing citric acid is making no claim about
    vitamin C.

gelatin/pectin:
  answer: "Gelatin is an animal protein from collagen whose gel melts at body temperature, while pectin is a fruit polysaccharide that needs sugar and acid and sets firm."
  text: >
    Both set a liquid into a gel and they come from opposite kingdoms. Gelatin is collagen
    from animal hide and bone, broken down into protein chains that tangle as they cool, which
    is why a gelatin gel melts at body temperature and feels like it dissolves in the mouth.
    Pectin is a plant polysaccharide from fruit peel and needs sugar and acid to set, giving a
    firmer gel that holds its shape at room temperature. That is the whole reason jam uses
    pectin and dessert jelly uses gelatin. Pectin is the only option of the two for a
    vegetarian product. Gelatin sets on cooling and can be re-melted; a pectin gel is
    effectively set for good.

agar/gelatin:
  answer: "Agar, or agar agar, is a seaweed polysaccharide that sets firm and melts only near 85 degrees Celsius; gelatin is an animal protein that melts near body heat."
  text: >
    Agar is the plant answer to gelatin and it does not behave the same way. Agar is a
    polysaccharide from red seaweed; gelatin is hydrolysed animal collagen, a protein. Agar
    sets much firmer, holds at room temperature, and only melts around 85 degrees Celsius,
    which is why it is the standard medium for growing bacteria in a warm incubator where
    gelatin would liquefy. Gelatin melts near body temperature, which is precisely why it
    feels the way it does in the mouth and agar does not. Agar also sets at a much lower
    concentration for the same firmness. For a vegetarian or vegan recipe, agar is the
    substitute, but it is not a like for like swap in texture.

xanthan-gum/guar-gum:
  answer: "Guar gum is milled from the guar bean and thickens cold liquids cheaply, while xanthan gum is made by bacteria and holds up to heat, acid and salt."
  text: >
    Both are thickeners used in gluten-free baking, sauces and ice cream, and they come from
    different places. Guar gum is milled from the guar bean, a galactomannan, and it thickens
    cold liquids cheaply and very effectively. Xanthan gum is made by fermenting sugar with
    the bacterium Xanthomonas campestris, and it produces a more stable gel that tolerates
    heat, acid and salt where guar gum thins out. Xanthan also gives the stringy, elastic
    quality that mimics gluten, which is why gluten-free bread recipes call for it
    specifically. Guar gum is roughly the cheaper of the two and is more likely to cause
    digestive upset in quantity. They are often used together because each covers the other's
    weakness.

maltodextrin/starch:
  answer: "Maltodextrin is starch, usually corn starch, cut into short glucose chains, so it dissolves instantly and tastes faintly sweet where starch tastes of nothing."
  text: >
    This pair is a material and its own fragment. Starch is long chains of glucose, either
    straight amylose or branched amylopectin, and it needs digestion before the body can use
    it. Maltodextrin is the same glucose chains cut down to a few units, which makes it
    dissolve instantly, taste faintly sweet where starch tastes of nothing, and raise blood
    glucose faster than table sugar does. That combination is why it is everywhere in sports
    drinks, powdered foods and seasoning blends: it carries flavour, adds body, and dissolves
    without lumping. Starch is the storage form plants actually make; maltodextrin is an
    industrial product.

starch/cellulose:
  answer: "Starch and cellulose are both glucose chains, but a starch chain's alpha bonds digest and a cellulose chain's beta bonds do not, so cellulose is fibre."
  text: >
    Neither contains anything but glucose. Starch links its glucose units with alpha bonds,
    which human amylase can cut, so starch is food. Cellulose links them with beta bonds,
    which flips every second unit over and produces a flat ribbon that human enzymes cannot
    touch, so cellulose is dietary fibre. Those flat ribbons stack and hydrogen-bond into
    fibres, which is why cellulose is structural in plants and starch is not: one is the
    plant's warehouse and the other is its scaffolding. Cows and termites manage cellulose
    only by hosting microbes that carry the missing enzyme.

collagen/gelatin:
  answer: "Gelatin is collagen that has been cooked: heat in water unwinds collagen's rigid triple helix into the loose chains that set as a gel."
  text: >
    That is the entire relationship. Collagen is the structural protein of skin, tendon and
    bone, three chains wound into a rigid triple helix that gives tissue its tensile strength.
    Heat in water unwinds that helix irreversibly, and the loose chains that result are
    gelatin, which is why simmering a bone broth thickens it as it cools. Collagen supplements
    are generally hydrolysed further into short peptides, so what is sold as collagen powder
    is closer to gelatin than to the intact protein. Neither reaches the skin as collagen
    after being eaten: both are digested into amino acids like any other protein.

collagen/keratin:
  answer: "Collagen is a glycine-rich triple helix that strengthens skin, tendon and bone, while keratin is a cysteine-rich coil that makes hair and nail hard."
  text: >
    These are the two structural proteins most people have heard of, and they build different
    things by different means. Collagen is a triple helix that gives skin, tendon and bone
    their tensile strength, and it is rich in glycine and proline. Keratin is a coiled coil
    packed with cysteine, and the sulfur bridges between those cysteines are what make hair,
    nail, horn and hoof hard and insoluble. That disulfide bonding is why hair can be
    permanently waved by breaking and reforming those bridges, and why burning hair smells of
    sulfur. Collagen dissolves into gelatin when cooked; keratin does not dissolve at all,
    which is why hair survives in archaeological finds.

# ── Body chemistry ─────────────────────────────────────────────────────────────
serotonin/dopamine:
  answer: "Dopamine is tied to motivation, reward and movement, while most of the body's serotonin is in the gut, and neither one is simply a happiness molecule."
  text: >
    Both are monoamine neurotransmitters built from an amino acid, dopamine from tyrosine and
    serotonin from tryptophan, and both are routinely oversimplified in popular writing.
    Dopamine is most associated with motivation and the anticipation of reward, the wanting
    rather than the liking, and it is also central to movement, which is what Parkinson's
    disease depletes. Serotonin is spread more widely still, with the large majority of the
    body's supply in the gut rather than the brain, where it regulates motility. Neither is a
    happiness molecule, and the calling of one the reward chemical and the other the happiness
    chemical does not survive contact with the pharmacology. Serotonin is also the direct
    precursor the body converts into melatonin at night.

dopamine/norepinephrine:
  answer: "Norepinephrine is made from dopamine by adding one hydroxyl group; dopamine dominates reward and movement, norepinephrine arousal and attention."
  text: >
    This pair is a molecule and its immediate product, C8H11NO2 against C8H11NO3, and a single
    enzyme makes the change. The body runs the chain tyrosine to L-dopa to dopamine to
    norepinephrine to adrenaline, and each step is one small modification. Functionally they
    diverge: dopamine dominates in reward, motivation and movement circuits, and
    norepinephrine drives arousal, attention and the fight-or-flight response, and acts as a
    hormone as well as a neurotransmitter. Several medicines act on both at once, which is why
    stimulant drug descriptions usually name the pair together. The reported oral LD50 for
    norepinephrine is 20 mg/kg in mice, which makes it one of the more acutely toxic entries
    in this catalog.

melatonin/serotonin:
  answer: "Melatonin is made from serotonin in two steps; melatonin is the body's nightfall signal, while serotonin works mostly by day and mostly in the gut."
  text: >
    One is the raw material for the other rather than an alternative to it. The pineal gland
    runs that conversion in darkness, which is why melatonin is the body's nightfall signal
    and why light at night suppresses it. Serotonin's role is broader and mostly daytime and
    mostly not in the brain at all: around ninety percent of the body's serotonin is in the
    gut. The structures show the two added groups, an acetyl on the nitrogen and a methyl on
    the oxygen, which take serotonin's 176.21 to melatonin's 232.28. Melatonin is sold over
    the counter in the US and is prescription-only in much of Europe, while serotonin is not
    sold as a supplement at all because it does not cross into the brain from the bloodstream.

epinephrine/norepinephrine:
  answer: "Adrenaline is norepinephrine plus one methyl group; norepinephrine is released at nerve endings, adrenaline into the blood as a hormone."
  text: >
    The formulas show it, C9H13NO3 against C8H11NO3, and the enzyme that adds the methyl works
    mostly in the adrenal medulla. That is the cleanest way to think about the pair:
    norepinephrine is the version the nervous system releases at nerve endings, and adrenaline
    is the version the adrenal gland pours into the blood as a hormone. They also favour
    different receptors. Norepinephrine acts mainly on alpha receptors, tightening blood
    vessels and raising blood pressure, while adrenaline hits beta receptors strongly too,
    which is what opens the airways and is the reason an adrenaline injector works for
    anaphylaxis. Both are naturally occurring and both carry a GHS Danger signal word in this
    catalog.

cortisol/epinephrine:
  answer: "Adrenaline acts within seconds and clears in minutes, while cortisol is a steroid hormone that works over hours on glucose, immunity and inflammation."
  text: >
    These are the two stress hormones, and they run on different clocks. Adrenaline is
    released within seconds by the adrenal medulla and clears within minutes, producing the
    immediate racing heart and widened pupils of an acute fright. Cortisol is a steroid built
    from cholesterol, released over minutes to hours by the adrenal cortex, and it changes how
    the body handles glucose, immunity and inflammation for the rest of the day. Cortisol also
    follows a daily rhythm on its own, peaking shortly after waking, which adrenaline does
    not. Structurally they have nothing in common: cortisol is a four-ring steroid at 362.5,
    adrenaline a small catecholamine at 183.2.

insulin/glucagon:
  answer: "Insulin lowers blood sugar by telling tissues to take glucose in and store it, while glucagon raises it by telling the liver to release stored glucose."
  text: >
    These are the two halves of blood sugar control and they are released by neighbouring
    cells in the same organ. Insulin comes from the beta cells of the pancreas when blood
    glucose rises, and it tells muscle, fat and liver to take glucose out of the blood and
    store it. Glucagon comes from the alpha cells when glucose falls, and it tells the liver
    to break glycogen back down and release it. Both are peptide hormones rather than small
    molecules, which is why neither survives the stomach and both are injected rather than
    swallowed. Insulin is much the larger of the two, 51 amino acids in two chains against
    glucagon's single chain of 29.

leptin/ghrelin:
  answer: "Ghrelin, from the stomach, is a short term signal to eat that rises before meals, while leptin, from fat tissue, is a long term signal about energy stores."
  text: >
    These two are usually introduced as the fullness hormone and the hunger hormone, and the
    neat symmetry hides how differently they behave. Ghrelin is made mostly in the stomach,
    rises before a meal and falls after it, and acts on a timescale of hours: it is a
    short-term signal to eat now. Leptin is made by fat tissue in proportion to how much of it
    there is, so it is a long-term signal about energy stores rather than about the next meal.
    That asymmetry is why the two are not a simple on and off pair. Both are peptide hormones,
    ghrelin a short chain and leptin a protein several times its size, so neither survives the
    stomach.

oxytocin/vasopressin:
  answer: "Oxytocin and vasopressin differ at only two of nine amino acids; oxytocin drives uterine contraction and milk letdown, vasopressin makes the kidney keep water."
  text: >
    Both are released from the posterior pituitary. That near-identity means each has some
    activity at the other's receptors, which is one reason their effects are hard to separate
    cleanly in studies. Oxytocin drives uterine contraction and milk letdown and is the one
    that gets written about for social bonding. Vasopressin, also called antidiuretic hormone,
    tells the kidney to reclaim water and constricts blood vessels, so it is the one that
    governs how concentrated your urine is. Both are peptides, so neither is absorbed usefully
    from the gut.

testosterone/dihydrotestosterone:
  answer: "Dihydrotestosterone is testosterone with one double bond reduced, a more potent local form made in skin, prostate and hair follicles."
  text: >
    The enzyme that makes it is 5 alpha reductase. It binds the same androgen receptor but far
    more tightly, so it is the more potent of the two at the tissues that make it. That local
    conversion is the point of the pair: testosterone circulates as the general signal, and
    DHT is the amplified local version in specific tissues. It is DHT rather than testosterone
    that drives male pattern hair loss and prostate growth, which is why finasteride works by
    blocking the enzyme that makes it rather than by lowering testosterone. The weights differ
    by two hydrogens, 290.4 against 288.4.

estradiol/testosterone:
  answer: "Estradiol is made from testosterone by the enzyme aromatase; testosterone predominates in men and estradiol in women, and everyone makes both."
  text: >
    These are the two headline sex hormones. The enzyme aromatase converts testosterone into
    estradiol by aromatising the first ring, which is visible in the table: estradiol carries
    a phenol group and testosterone a ketone, and estradiol has lost a carbon at 272.4 against
    288.4. Everyone makes both. Testosterone predominates in men and drives muscle, bone
    density and body hair; estradiol predominates in women and drives the menstrual cycle, and
    it is also essential to bone health in men, through exactly that aromatase conversion.
    Both are steroids built from cholesterol, four fused rings apiece.

estradiol/progesterone:
  answer: "Estradiol builds the uterine lining in the first half of the menstrual cycle and progesterone maintains it in the second, after ovulation."
  text: >
    Both are steroid hormones central to the menstrual cycle and they act in sequence rather
    than in competition. Estradiol dominates the first half of the cycle, building the uterine
    lining, and progesterone dominates the second half after ovulation, maintaining it.
    Structurally estradiol is the more modified: its first ring is aromatic and carries a
    phenol, which is what makes it an estrogen, while progesterone keeps the intact steroid
    skeleton with two ketones and is the direct precursor of cortisol and testosterone.
    Progesterone is the heavier at 314.5 against 272.4. Both are made from cholesterol, and
    both appear here as body-endogenous molecules rather than as medicines.

cholesterol/testosterone:
  answer: "Testosterone is built from cholesterol: cholesterol is the membrane sterol every animal cell uses, and testosterone is one of the hormones made from it."
  text: >
    This is a precursor and its product rather than two competing molecules. Cholesterol is
    the four-ring sterol every animal cell membrane uses to control its fluidity, and the body
    makes most of its own rather than absorbing it from food. From cholesterol the adrenal
    glands and gonads build pregnenolone and from there the whole steroid hormone family,
    testosterone included, along with cortisol, estradiol and vitamin D. The visible
    difference is size: cholesterol keeps a long hydrocarbon tail and weighs 386.7, and
    testosterone has lost that tail at 288.4. The common belief that eating cholesterol raises
    testosterone does not follow from the pathway, which is not limited by the supply of raw
    material.

creatine/creatinine:
  answer: "Creatinine is the waste product of creatine: creatine is a muscle energy reserve, and creatinine is what it breaks down into, cleared by the kidneys."
  text: >
    These two are constantly mixed up. Creatine is stored in muscle as phosphocreatine, a
    rapid phosphate reserve that regenerates ATP in the first seconds of hard effort, which is
    what makes it useful as a sports supplement. Creatinine is what creatine becomes when that
    molecule spontaneously cyclises and loses water, at a fairly constant rate proportional to
    muscle mass. The kidneys clear creatinine, so its level in blood is a standard measure of
    kidney function, and that is why a creatine supplement can raise a measured creatinine
    reading without anything being wrong with the kidneys. The weights differ by exactly the
    lost water, 131.13 against 113.12.

urea/uric-acid:
  answer: "Urea comes from breaking down amino acids and dissolves easily, while uric acid comes from purines and dissolves so poorly it can cause gout."
  text: >
    Both are how bodies get rid of surplus nitrogen and they come from different waste
    streams. Urea is the product of breaking down amino acids, made in the liver, very soluble
    in water, and excreted in large quantity in urine. Uric acid comes from breaking down
    purines, the bases in DNA, RNA and ATP, and it is poorly soluble, which is the whole
    problem with it: when concentrations rise it crystallises in joints, which is gout. Birds
    and reptiles excrete uric acid instead of urea precisely because it needs so little water.
    Urea is the smaller molecule by a wide margin, 60.06 against 168.11, and it turns up in
    skincare as a humectant, which uric acid does not.

nicotinamide/niacin:
  answer: "Niacin is nicotinic acid, whose acid group causes the skin flush, while niacinamide is nicotinamide, the amide form of vitamin B3, which does not flush."
  names: { nicotinamide: Niacinamide, niacin: Niacin }
  text: >
    Both end up as the same coenzyme, NAD, but they behave very differently on the way there.
    Niacin is nicotinic acid, carrying a carboxylic acid group, and at high intakes it causes
    the flush, a temporary reddening and prickling of the skin driven by prostaglandin
    release. Nicotinamide carries an amide instead and does not cause the flush at all, which
    is why supplements sold as flush-free use it. That same carboxylic acid is why niacin, and
    not nicotinamide, has effects on blood lipids. In skincare the amide form is the one used,
    listed as niacinamide, where it is studied for barrier function and pigmentation.

# ── Vitamins and plant compounds ───────────────────────────────────────────────
cholecalciferol/ergocalciferol:
  answer: "Cholecalciferol is vitamin D3, made by human skin and found in fish, while ergocalciferol is vitamin D2 from fungi, and D3 holds blood levels better."
  text: >
    They differ in a side chain, C27H44O against C28H44O. D3 is what human skin makes when
    ultraviolet B light hits 7-dehydrocholesterol, and it is also what comes from fish and
    lanolin. D2 is the fungal and plant version, made when the same light hits ergosterol,
    which is why ultraviolet-treated mushrooms are sold as vitamin D enhanced. Both are
    converted by the liver and kidney into the active hormone, but D3 raises and holds blood
    levels of the storage form more effectively than D2 does, which is the practical reason
    most supplements now use D3. D2 remains the vegan option and the historical form used to
    fortify milk.

beta-carotene/retinol:
  answer: "Retinol is preformed vitamin A that the body uses directly, while beta-carotene is two retinol units joined, cut into vitamin A only as the body needs it."
  text: >
    The body makes that cut in the gut wall. That conversion is the entire difference. Retinol
    is preformed vitamin A from animal sources and is used directly, so it accumulates and can
    reach toxic levels; beta-carotene is converted only as needed, so surplus is stored in fat
    and skin rather than causing vitamin A toxicity. Eating a very large amount of
    beta-carotene turns skin orange, which is harmless and reversible. Beta-carotene is the
    orange of carrots and sweet potato and is nearly twice retinol's weight at 536.9 against
    286.5. Conversion efficiency varies a great deal between people.

lycopene/beta-carotene:
  answer: "Lycopene and beta-carotene share the formula C40H56, but only beta-carotene closes a ring at each end, and lycopene is red where beta-carotene is orange."
  text: >
    Their weights are identical as well, and lycopene's chain stays open where beta-carotene's
    closes. That ring is what makes beta-carotene a vitamin A precursor and lycopene not one:
    the body cuts the molecule at its centre and needs the ring to make retinol. Colour
    follows the same structural difference, lycopene reading red in tomato and watermelon and
    beta-carotene orange in carrot. Both are fat soluble, so both are absorbed better with
    oil, and lycopene is unusual in becoming more available after cooking, which is why
    processed tomato products carry more usable lycopene than raw tomatoes.

lutein/zeaxanthin:
  answer: "Lutein and zeaxanthin are isomers that differ in one double bond; zeaxanthin sits at the centre of the eye's macula and lutein toward its edge."
  text: >
    They share the formula C40H56O2, and they are the only carotenoids the eye concentrates in
    the macula. That single bond changes how each orients in the retina: zeaxanthin sits at
    the very centre of the macula and lutein spreads more toward the periphery. Both absorb
    blue light and both are antioxidants, which is the basis of the interest in them for eye
    health. Dietary sources differ, with lutein highest in kale, spinach and other dark greens
    and zeaxanthin higher in corn, orange peppers and egg yolk. The body can convert lutein
    into a form of zeaxanthin, which is why supplements usually pair them.

quercetin/resveratrol:
  answer: "Quercetin is a flavonoid with three rings and five hydroxyl groups, common in onions and tea, while resveratrol is a simpler stilbene from grape skin."
  text: >
    Both are plant polyphenols sold as antioxidant supplements and they belong to different
    classes. Quercetin is a flavonoid, a three-ring structure with five hydroxyl groups, and
    it is one of the most abundant flavonoids in the ordinary diet, concentrated in onion
    skin, capers, apples and tea. Resveratrol is a much simpler stilbene, two rings joined by
    a double bond, found in grape skin, red wine and Japanese knotweed, and it became famous
    through the French paradox. Both are poorly absorbed and rapidly conjugated by the liver,
    which is the central difficulty in translating their laboratory activity into anything
    measured in people. Quercetin is the heavier at 302.2 against 228.24.

quercetin/epigallocatechin-gallate:
  answer: "Quercetin is a flavonol found in onions and apples, while epigallocatechin gallate is a larger flavan-3-ol from green tea with an extra gallate ester."
  text: >
    Both are plant polyphenols with antioxidant reputations and they come from different
    chemical families. Quercetin is a flavonol with a flat, conjugated three-ring core and
    five hydroxyl groups, widespread in onions, apples, capers and tea. Epigallocatechin
    gallate is a flavan-3-ol from green tea specifically, much larger at 458.4 against 302.2,
    and its extra gallate ester is what makes it the most studied compound in green tea. EGCG
    is also the more unstable of the two, oxidising readily in warm water and in the gut,
    which complicates dose comparisons between studies. Both bind proteins and metal ions
    readily, which is part of why both interfere with the absorption of iron from a meal.

capsaicin/piperine:
  answer: "Capsaicin from chilli and piperine from black pepper trip the same heat receptor, but capsaicin is over a hundred times hotter and its burn lingers longer."
  text: >
    Both are the heat in a spice and they act on the same receptor with very different force.
    Capsaicin from chilli and piperine from black pepper both activate TRPV1, the nerve
    channel that reports heat and physical damage, which is why both feel like burning even
    though nothing is hot. Capsaicin is far the stronger, at roughly 16,000,000 Scoville units
    in pure form against piperine's 100,000, a difference of over a hundredfold. They also
    differ in the character of the heat: capsaicin builds and lingers, and piperine bites
    sharply and fades. Structurally capsaicin carries a long fatty tail on a vanillyl amide,
    and piperine is a compact ring system, which is why capsaicin is the more fat-soluble and
    harder to wash out with water.

curcumin/piperine:
  answer: "Curcumin is the yellow pigment of turmeric and piperine the bite of black pepper; piperine is paired with curcumin because it helps curcumin get absorbed."
  text: >
    That pairing is the reason the two are usually named together. Curcumin is the yellow
    pigment of turmeric, poorly absorbed and rapidly conjugated by the liver and gut wall, so
    very little of what is swallowed reaches the bloodstream intact. Piperine, the sharp
    compound in black pepper, inhibits some of the enzymes that perform that conjugation,
    which is why the two are formulated together. They are otherwise unrelated: curcumin is a
    phenolic diketone at 368.4 and piperine an alkaloid at 285.34, and piperine carries heat
    that curcumin does not. Curcumin is also a pH indicator that turns red in alkali, which is
    what stains a wooden spoon.

menthol/camphor:
  answer: "Menthol activates the cold receptor TRPM8, while camphor works on several TRP channels including warm ones, and camphor is far more toxic if swallowed."
  text: >
    Both are terpenoids that produce a sensation the body reads as temperature, and they trip
    different receptors. Menthol activates TRPM8, the cold receptor, which is why it feels
    cool without lowering any temperature, and it is the reason peppermint and menthol
    cigarettes feel the way they do. Camphor is less selective, working on several TRP
    channels including the warm ones, which is why it reads as both cooling and warming and
    why it appears in chest rubs alongside menthol rather than instead of it. Camphor is the
    more toxic of the two by a wide margin and is dangerous to children if swallowed, which is
    why its concentration in consumer products is capped in many countries. Menthol comes from
    mint, camphor from the camphor laurel or from synthesis.

limonene/linalool:
  answer: "Limonene is a hydrocarbon that is the scent of citrus peel, while linalool carries an alcohol group and is the floral note in lavender."
  text: >
    Both are terpenes that carry a scent and both turn up on cosmetic ingredient lists as
    declared allergens. Limonene is a cyclic hydrocarbon, C10H16, and is the whole of citrus
    peel oil, which is why it is the solvent in orange-oil cleaners as well as a fragrance.
    Linalool carries an alcohol group, C10H18O, and is the floral, slightly spicy note in
    lavender, coriander and basil. That single oxygen makes linalool the less volatile and the
    more soluble of the two. Both oxidise on exposure to air into products that are more
    sensitising than the fresh molecules, which is why an old bottle of citrus oil is more
    likely to irritate skin than a new one.

tetrahydrocannabinol/cannabidiol:
  answer: "THC and CBD share one formula, but tetrahydrocannabinol closes a ring that cannabidiol leaves open, so only THC activates CB1 and intoxicates."
  text: >
    The formula is C21H30O2 for both, and the weights are identical. The difference is that
    THC's molecule closes into a ring that CBD leaves open, and only the closed form fits the
    CB1 receptor in the brain in a way that activates it. CBD instead acts indirectly at CB1
    and on a scattering of other targets including serotonin receptors and TRPV1. THC is the
    compound cannabis is regulated for, and CBD is sold widely as a supplement in
    jurisdictions where THC is not. CBD is also the one with an approved prescription medicine
    built on it, for specific childhood epilepsy syndromes.

cannabidiol/cannabigerol:
  answer: "Cannabigerol is the precursor the cannabis plant builds cannabidiol from, and CBG keeps an open chain where CBD has closed a ring."
  text: >
    The plant uses up most of its cannabigerol that way, which is why mature plants contain
    very little of it. Both are non-intoxicating and neither activates the CB1 receptor the
    way THC does. Their structures are close: CBG keeps a straight, open chain where CBD has
    closed a ring, and CBG carries two more hydrogens, 316.5 against 314.5. Because CBG is
    consumed by the plant's own synthesis, extracting it commercially means harvesting early
    or using selectively bred low-conversion strains, which is why CBG products cost more. The
    research base behind CBG is far thinner than CBD's.

# ── Antihistamines and stomach ─────────────────────────────────────────────────
diphenhydramine/cetirizine:
  answer: "Diphenhydramine is a first generation antihistamine that reaches the brain and causes drowsiness, while cetirizine mostly stays out and sedates far less."
  text: >
    These are the first and second generation antihistamines. Both block the H1 histamine
    receptor, which is what stops the itching and sneezing of an allergic response.
    Diphenhydramine is small and fat-soluble enough to cross the blood-brain barrier freely,
    which is why it causes strong drowsiness and why it is sold as a sleep aid as well as an
    allergy medicine. Cetirizine carries a carboxylic acid that keeps it largely out of the
    brain, so it is much less sedating while blocking the same receptor in the body.
    Cetirizine also lasts far longer, which is why it is a once-daily product and
    diphenhydramine is not.

loratadine/cetirizine:
  answer: "Cetirizine reaches the brain slightly more than loratadine, acting faster but sedating a little more, while the liver turns loratadine into desloratadine."
  text: >
    Both are second generation antihistamines taken once a day and both block the H1 receptor.
    Cetirizine crosses into the brain slightly more than loratadine does, so it is a little
    more likely to cause drowsiness while also tending to act faster and more strongly on
    symptoms. Loratadine is a prodrug in effect: the liver converts much of it to
    desloratadine, which is what does most of the work, and that adds a step cetirizine does
    not have. Cetirizine is the heavier molecule at 388.9 against 382.9 and carries a
    carboxylic acid where loratadine carries a carbamate ester. Both are sold over the counter
    in most countries.

loratadine/diphenhydramine:
  answer: "Diphenhydramine, sold as Benadryl, enters the brain and causes drowsiness for a few hours, while loratadine, sold as Claritin, stays out and lasts a full day."
  text: >
    This is the Claritin and Benadryl comparison, and it is the clearest example of what
    separates antihistamine generations. Diphenhydramine is a small, fat-soluble first
    generation molecule that crosses into the brain easily, which is why it works within an
    hour and reliably causes drowsiness, and why it doubles as a sleep aid. Loratadine is
    built to stay out of the brain, so it is non-sedating for most people, but it lasts a full
    day where diphenhydramine's effect fades in a few hours. Diphenhydramine also blocks
    acetylcholine receptors, which is where the dry mouth and blurred vision come from, and
    loratadine largely does not. Loratadine is much the heavier molecule at 382.9 against
    255.35.

levocetirizine/cetirizine:
  answer: "Cetirizine is a mix of two mirror-image forms and levocetirizine is the active one alone, so it works at about half the amount for a similar effect."
  text: >
    The two forms are mirror images of the same molecule. The active half is levocetirizine,
    and the other half contributes very little H1 blocking, which is why levocetirizine works
    at about half the amount of cetirizine for a similar effect. Everything else about them is
    identical: same formula, same weight of 388.9, same receptor, same once-daily pattern.
    Whether isolating the active half produces a meaningfully better medicine or mainly a new
    patent is a debate that has followed several single-isomer products. Cetirizine is
    generally sold over the counter and levocetirizine varies by country.

hydroxyzine/diphenhydramine:
  answer: "Hydroxyzine and diphenhydramine, sold as Benadryl, both cause drowsiness, but hydroxyzine lasts longer, is prescription only and also treats anxiety."
  names: { diphenhydramine: Benadryl }
  text: >
    Both are first generation antihistamines that cross into the brain, and they are used for
    noticeably different things. Diphenhydramine is an over-the-counter allergy medicine and
    sleep aid with a short duration, a few hours. Hydroxyzine lasts much longer, is
    prescription-only in most countries, and is used for anxiety and itching as well as
    allergy, partly because it also acts on serotonin receptors. Hydroxyzine is the heavier
    molecule at 374.9 against 255.35 and carries a piperazine ring where diphenhydramine has a
    simple dimethylamine. Cetirizine, the common non-drowsy antihistamine, is actually
    hydroxyzine's own metabolite with that ring capped by a carboxylic acid.

famotidine/omeprazole:
  answer: "Famotidine turns down the histamine signal for acid and works within an hour, while omeprazole disables the acid pump itself and reduces acid more completely."
  text: >
    Both reduce stomach acid and they act at different points in the same machinery.
    Famotidine is an H2 blocker: it blocks the histamine receptor on the acid-producing cell,
    which turns the signal down and works within an hour. Omeprazole is a proton pump
    inhibitor: it permanently disables the pump that actually moves acid into the stomach, so
    it takes days of repeated use to reach full effect but reduces acid far more completely.
    That is why one is useful for occasional heartburn and the other for sustained reduction.
    Omeprazole needs an acidic environment to activate, which is why its capsules are coated
    to survive until they are absorbed. Famotidine is the smaller molecule at 337.5 against
    345.4 and contains sulfur in two places.

sodium-chloride/potassium-chloride:
  answer: "Both taste salty, but sodium chloride is table salt while potassium chloride, used in salt substitutes, has a metallic, faintly bitter edge."
  text: >
    Both are simple salts of chloride. Potassium chloride is the main ingredient in the salt
    substitutes sold as NoSalt and LoSalt, and it carries a metallic, faintly bitter edge that
    gets stronger with concentration, which is why substitutes are usually blends rather than
    straight potassium chloride. The saltiness is read by different mechanisms: the sodium ion
    passes through an ion channel on the taste cell directly, and the potassium ion is a
    poorer fit for it. The reported oral LD50 values differ sharply, 3000 mg/kg in rats for
    table salt against 383 mg/kg in mice for potassium chloride, measured in different species
    but pointing at a real difference: potassium load matters to the heart in a way sodium
    load does not.

# ── Antidepressants and psychiatry ─────────────────────────────────────────────
sertraline/fluoxetine:
  answer: "Sertraline and fluoxetine are both SSRIs, but fluoxetine and its active metabolite linger for a week or more while sertraline clears in a day or two."
  text: >
    Both block the serotonin transporter. Fluoxetine carries a trifluoromethyl group and
    produces an active metabolite, norfluoxetine, that persists for a week or more, so its
    level falls very slowly when it stops. Sertraline carries two chlorines on a naphthalene
    core instead and clears in a day or two. That difference shapes how each behaves at the
    edges: fluoxetine is the more forgiving of a missed dose and the harder to stop cleanly,
    sertraline the reverse. Fluoxetine was the first SSRI to reach the market, in 1987 as
    Prozac, and sertraline followed as Zoloft and is now among the most prescribed medicines
    in the world.

sertraline/escitalopram:
  answer: "Both are SSRIs, but escitalopram is far more selective for the serotonin transporter, while sertraline also acts on the dopamine transporter."
  text: >
    These are the two most prescribed SSRIs. Sertraline also has meaningful activity at the
    dopamine transporter and at sigma receptors, which escitalopram essentially lacks.
    Escitalopram is the isolated active half of citalopram, so it is a single-isomer molecule
    where sertraline is not, and it is the heavier at 324.4 against 306.2. In practice their
    side effect profiles overlap heavily and differ in the details. Both are prescription
    medicines and neither is available over the counter anywhere in the US or Europe.

escitalopram/citalopram:
  answer: "Citalopram is a mix of two mirror-image forms and escitalopram is the active one isolated, so half the amount does roughly the same work."
  text: >
    The two forms are mirror images of one molecule. The inactive half does not simply sit
    there: it appears to blunt the active half slightly, which is the argument for separating
    them. Everything else is identical, same formula C20H21FN2O, same weight of 324.4, same
    serotonin transporter. Half the amount of escitalopram does roughly what a full amount of
    citalopram does, which is why the numbers on the two prescriptions look different for what
    is chemically the same substance. Citalopram carries a stronger warning about heart rhythm
    at higher amounts than escitalopram does.

duloxetine/venlafaxine:
  answer: "Duloxetine and venlafaxine are both SNRIs, but venlafaxine acts mostly on serotonin at lower amounts while duloxetine hits both transmitters from the start."
  text: >
    Both block the reuptake of serotonin and norepinephrine rather than serotonin alone.
    Venlafaxine is strongly serotonergic at lower amounts and only recruits norepinephrine as
    the amount rises, so its character changes across its range. Duloxetine hits both from the
    start, which is part of why it is used for nerve pain and fibromyalgia as well as for
    depression. Venlafaxine has a notably short half-life and produces a well-known
    discontinuation syndrome when stopped abruptly; duloxetine is somewhat gentler on that
    front. Structurally duloxetine carries a thiophene ring and a naphthalene ether at 297.4,
    and venlafaxine is a simpler phenol ether at 277.4.

bupropion/sertraline:
  answer: "Sertraline is an SSRI that acts on serotonin, while bupropion acts on dopamine and norepinephrine and leaves serotonin essentially alone."
  text: >
    These two are both antidepressants and they work on entirely different neurotransmitters.
    Sertraline is an SSRI and acts on serotonin; bupropion acts on dopamine and norepinephrine
    reuptake and leaves serotonin essentially alone. That difference drives most of what
    separates them in practice: bupropion does not carry the sexual side effects or the weight
    gain associated with SSRIs, and it is activating rather than calming, while it does lower
    the seizure threshold in a way SSRIs do not. Bupropion is also sold under a second name as
    a smoking cessation aid, which sertraline is not. Bupropion is much the smaller molecule
    at 239.74 against 306.2.

amitriptyline/nortriptyline:
  answer: "Nortriptyline is amitriptyline minus one methyl group, made from it by the body, and it is the less sedating of the two tricyclics."
  text: >
    Taking amitriptyline therefore produces nortriptyline as an active metabolite. Both are
    tricyclic antidepressants that block serotonin and norepinephrine reuptake, and the
    missing methyl shifts the balance: nortriptyline leans more toward norepinephrine and
    carries fewer antihistamine and anticholinergic effects. That is why nortriptyline is
    generally the less sedating of the two and causes less dry mouth and constipation. Both
    are used at low levels for nerve pain and migraine prevention as well as for depression.
    Weights differ by the methyl group alone, 277.4 against 263.4.

quetiapine/olanzapine:
  answer: "Quetiapine binds the dopamine D2 receptor loosely and is heavily sedating, while olanzapine binds more firmly and is more strongly tied to weight gain."
  text: >
    Both are atypical antipsychotics that block dopamine D2 and serotonin 5-HT2A receptors.
    Quetiapine binds D2 loosely and comes off quickly, which is why it causes relatively few
    movement side effects and why it is heavily sedating at lower amounts through its
    antihistamine activity. Olanzapine binds more firmly and is the more reliably
    antipsychotic of the two, at the cost of a stronger association with weight gain and
    metabolic change. Both carry sedation, and both are prescription only. Quetiapine is a
    dibenzothiazepine at 383.5 and olanzapine a thienobenzodiazepine at 312.4, so they are
    structural cousins rather than the same skeleton.

aripiprazole/risperidone:
  answer: "Risperidone blocks the dopamine D2 receptor outright, while aripiprazole is a partial agonist that switches it on slightly, so it raises prolactin less."
  text: >
    Both are atypical antipsychotics and they treat the dopamine receptor in opposite ways.
    Risperidone is a straightforward D2 blocker with strong 5-HT2A blocking added, so at
    higher amounts it behaves much like an older antipsychotic, including a marked rise in
    prolactin. Aripiprazole is a partial agonist: it occupies the same receptor and produces a
    low level of activation, damping signalling where dopamine is high and supporting it where
    dopamine is low. That mechanism is why aripiprazole tends to be more activating and less
    prolactin raising, while risperidone is the more sedating. Aripiprazole is the heavier of
    the two at 448.4 against 410.5.

alprazolam/diazepam:
  answer: "Alprazolam acts fast and clears fast, while diazepam persists far longer through active metabolites that can stretch its effect over days."
  text: >
    Both are benzodiazepines and both work by making the brain's own GABA more effective at
    its receptor. Alprazolam acts fast and clears fast, with a half-life around 11 hours,
    which is why it is associated with acute panic and also with a sharper rebound as it
    leaves. Diazepam is absorbed very quickly but persists far longer, and it produces
    long-lived active metabolites including nordazepam that can stretch its effect over days.
    That is why diazepam is used to taper other benzodiazepines and alprazolam is not.
    Alprazolam is the more potent per unit weight by a wide margin. Structurally alprazolam
    carries a triazole ring fused to the benzodiazepine core that diazepam lacks.

clonazepam/alprazolam:
  answer: "Clonazepam lasts far longer than alprazolam, a half-life of 30 to 40 hours against about 11, so it is used for seizures and alprazolam for acute episodes."
  text: >
    Both are high-potency benzodiazepines with a triazolo or nitro group that sets them apart
    from the older members of the class, and both act on the same GABA-A receptor. Clonazepam
    lasts substantially longer, with a half-life in the range of 30 to 40 hours against
    alprazolam's 11, which is why it is used for seizure disorders and long-acting anxiety
    control where alprazolam is used for acute episodes. The shorter action of alprazolam is
    also why it is the more associated with between-dose rebound. Both are controlled
    substances in the US and in most of Europe. Clonazepam carries a nitro group and a
    chlorine at 315.7; alprazolam has the triazole ring at 308.8.

diazepam/lorazepam:
  answer: "Diazepam breaks down into several active metabolites that build up with repeated use, while lorazepam produces none, so its effect ends more cleanly."
  text: >
    Both are benzodiazepines and the useful distinction is what the liver has to do with them.
    Diazepam is broken down through oxidation into several active metabolites, so its effect
    outlasts the parent molecule and accumulates with repeated use, especially in older people
    and in anyone with reduced liver function. Lorazepam is conjugated directly and produces
    no active metabolite, so its effect ends more cleanly, which is why it is often preferred
    where liver function is a concern. Diazepam is the more fat-soluble of the two and reaches
    the brain faster, which matters when either is used for an acute seizure. Lorazepam is the
    heavier at 321.2 against 284.7.

melatonin/zolpidem:
  answer: "Melatonin is a hormone that signals night has come, while zolpidem is a prescription sedative acting on the GABA-A receptor that induces sleep directly."
  text: >
    Both are used for sleep and they are not the same kind of thing at all. Melatonin is a
    hormone the body produces in darkness, a signal that says night has come rather than a
    sedative, and it is sold over the counter in the US while being prescription-only in much
    of Europe. Zolpidem is a prescription sedative that acts on the GABA-A receptor, the same
    target as the benzodiazepines, and it induces sleep directly. That mechanistic difference
    shows in what each does to sleep architecture and in the risks attached: zolpidem carries
    well-documented associations with complex sleep behaviours and next-day impairment,
    melatonin does not. Melatonin's own half-life is very short at around 45 minutes.

zolpidem/temazepam:
  answer: "Temazepam is a full benzodiazepine that also eases anxiety and relaxes muscle, while zolpidem is not a benzodiazepine and targets sedation more selectively."
  text: >
    Both act on the GABA-A receptor and both are prescribed for insomnia. Temazepam is a full
    benzodiazepine and binds across the receptor subtypes, so it carries the anxiety-reducing
    and muscle-relaxing effects of the class along with the sedation. Zolpidem is an
    imidazopyridine, not a benzodiazepine at all, and favours the alpha-1 subtype that
    mediates sedation specifically, which is why it does comparatively little for anxiety.
    Zolpidem also acts and clears faster, with a half-life near 2.5 hours against temazepam's
    8 to 10. Both are controlled substances in the US.

# SEO run 2 (2026-10-28): "temazepam vs zopiclone" in Search Console with no page of its own.
temazepam/zopiclone:
  answer: "Temazepam is a benzodiazepine that also eases anxiety and relaxes muscle; zopiclone is a z-drug that targets sleep more narrowly and leaves a metallic taste."
  text: >
    Both are prescription sleep medicines that act on the GABA-A receptor, and neither carries an
    LD50 in this catalog. Temazepam is a true benzodiazepine, C16H13ClN2O2 at 300.74, sold as
    Restoril in the United States, and it binds across the receptor's subtypes, so it brings the
    anxiety-easing and muscle-relaxing effects of the class along with the sedation. Zopiclone,
    C17H17ClN6O3 at 388.8 and sold as Zimovane in the UK, is a cyclopyrrolone, one of the
    z-drugs, which favour the subtype behind sedation and do less for anxiety. Zopiclone is
    cleared faster, with a half-life near 5 hours against temazepam's 8 to 10, and it is secreted
    into saliva, which is the bitter metallic taste people report the next morning. Zopiclone has
    never been approved in the United States, where its single active form, eszopiclone, is sold
    instead.

methylphenidate/amphetamine:
  answer: "Methylphenidate blocks dopamine reuptake, while amphetamine also pushes stored dopamine out of the neuron, which is why amphetamine tends to act more strongly."
  text: >
    These are the two stimulant families used for ADHD, sold as Ritalin and as Adderall, and
    they move dopamine by different mechanisms. Methylphenidate blocks the dopamine and
    norepinephrine transporters, so it stops reuptake and lets naturally released
    neurotransmitter linger. Amphetamine does that too and goes further: it enters the neuron
    and forces stored dopamine out through the transporter running in reverse, so it increases
    release rather than only preserving it. That extra step is why amphetamine tends to
    produce a stronger effect and why its abuse potential is generally rated higher.
    Methylphenidate is the heavier molecule at 233.31 against 135.21, and both are controlled
    substances.

lisdexamfetamine/dextroamphetamine:
  answer: "Lisdexamfetamine is dextroamphetamine with the amino acid lysine attached, and it does nothing until the blood cuts the lysine off."
  text: >
    Enzymes in the blood do that cutting. That conversion is the entire design: it happens at
    a rate the body sets rather than one a formulation sets, which gives a smoother rise and
    makes the molecule far less useful if crushed or injected. Once cleaved, what circulates
    is dextroamphetamine, so the two are the same drug arriving by different routes.
    Lisdexamfetamine is the much heavier molecule at 263.38 against 135.21 because of the
    attached lysine, and only part of that weight is the active portion. Both are controlled
    substances in the US.

donepezil/memantine:
  answer: "Donepezil makes the remaining acetylcholine last longer by blocking acetylcholinesterase, while memantine partly blocks the NMDA glutamate receptor."
  text: >
    Both are used in Alzheimer's disease and they act on opposite sides of the synapse.
    Donepezil blocks acetylcholinesterase, so the acetylcholine that is still being released
    lasts longer, which is a way of making the most of a declining supply. Memantine blocks
    the NMDA glutamate receptor partially, which is aimed at the excess glutamate signalling
    thought to damage neurons in later disease. Because the two mechanisms do not overlap,
    they are frequently used together rather than as alternatives. Donepezil is the larger
    molecule at 379.5 against memantine's 179.3, and memantine is an adamantane, the same cage
    structure as the antiviral amantadine.

# ── Cardiovascular and metabolic ───────────────────────────────────────────────
atorvastatin/rosuvastatin:
  answer: "Both are statins, but rosuvastatin is more potent per unit weight and is largely not cleared by CYP3A4, so it has fewer interactions than atorvastatin."
  text: >
    Both block HMG-CoA reductase, the rate-limiting enzyme in the body's own cholesterol
    assembly line. The larger practical difference is how each is cleared: atorvastatin is
    broken down by the liver enzyme CYP3A4, which is the enzyme grapefruit juice and many
    other medicines interfere with, and rosuvastatin is largely not, so it has fewer
    interactions. Rosuvastatin is also more water-loving, which keeps more of it in the liver
    where it is meant to act. Atorvastatin became the best-selling medicine of all time as
    Lipitor; rosuvastatin followed as Crestor. Atorvastatin is the heavier at 558.6 against
    481.5, and rosuvastatin carries a sulfonamide group that atorvastatin does not.

lisinopril/losartan:
  answer: "Lisinopril blocks the enzyme that makes angiotensin II and losartan blocks its receptor, which is why lisinopril can cause a dry cough and losartan does not."
  text: >
    Both lower blood pressure by interrupting the same hormone system at different points.
    Lisinopril is an ACE inhibitor: it blocks the enzyme that converts angiotensin I into
    angiotensin II, so less of the vessel-tightening hormone is made. Losartan is an
    angiotensin receptor blocker: the hormone is still made but cannot act on its receptor.
    That difference explains the best-known side effect split, because ACE also breaks down
    bradykinin, and the bradykinin that accumulates under lisinopril causes the persistent dry
    cough that losartan does not. Losartan is much the heavier molecule at 422.9 against 405.5
    and carries a tetrazole ring. Both are prescription medicines.

losartan/valsartan:
  answer: "Both block the angiotensin II receptor, but losartan depends partly on the liver making a more active metabolite, and valsartan is active as given."
  text: >
    Both keep angiotensin II from acting on its receptor, and they differ mainly in
    pharmacokinetics. Losartan is a prodrug in part: the liver converts some of it into a
    metabolite that is considerably more active than the parent, so its effect depends on that
    conversion. Valsartan is active as given. Losartan also has a mild uric-acid lowering
    effect that the rest of the class does not share, which is a genuinely distinctive
    property. Valsartan is the heavier at 435.5 against 422.9 and carries a carboxylic acid
    where losartan carries an alcohol. Both are prescription medicines and both belong to a
    class that came out of a large recall over nitrosamine contamination in the late 2010s.

amlodipine/lisinopril:
  answer: "Amlodipine relaxes artery walls by blocking calcium channels, while lisinopril works hormonally by cutting production of angiotensin II."
  text: >
    Both are first-line blood pressure medicines and they act on completely different systems.
    Amlodipine is a calcium channel blocker: it stops calcium entering the smooth muscle of
    artery walls, so the vessels relax directly. Lisinopril is an ACE inhibitor and works
    hormonally, reducing the production of angiotensin II. Their characteristic side effects
    follow from the mechanisms: amlodipine causes ankle swelling by dilating arterioles more
    than venules, and lisinopril causes a dry cough through bradykinin accumulation. Because
    the two routes are independent, they are often combined rather than substituted.
    Amlodipine is the heavier at 408.9 against 405.5 and carries two chlorine-bearing rings.

metoprolol/propranolol:
  answer: "Propranolol blocks beta-1 and beta-2 receptors alike and enters the brain readily, while metoprolol aims mainly at the heart's beta-1 receptors."
  text: >
    Both are beta blockers. Propranolol blocks beta-1 and beta-2 receptors alike, so alongside
    slowing the heart it also acts on airway and peripheral vessels, which is why it is used
    for tremor, migraine prevention and performance anxiety and why it is avoided in asthma.
    Metoprolol is relatively beta-1 selective, aiming at the heart and leaving the airways
    comparatively alone, though that selectivity fades at higher amounts. Propranolol is also
    far more fat-soluble, so it enters the brain readily, which is part of why it has a role
    in anxiety that metoprolol largely lacks. Metoprolol is the heavier at 267.36 against
    259.34.

hydrochlorothiazide/furosemide:
  answer: "Furosemide is a strong loop diuretic acting where most sodium is reabsorbed, while hydrochlorothiazide acts further along the kidney tubule and is gentler."
  text: >
    Both are diuretics, and where each acts decides how strong it is. Furosemide is a loop
    diuretic, blocking sodium reabsorption in the thick ascending limb where the bulk of it
    happens, so it produces a large and fast urine output and is used for fluid overload in
    heart failure. Hydrochlorothiazide acts further along in the distal tubule, where much
    less sodium is available to block, so it is gentler and is used for ongoing blood pressure
    control. They also differ on calcium: thiazides retain it and loop diuretics lose it,
    which matters for bone and for kidney stones. Furosemide is the heavier at 330.7 against
    297.7 and both carry a sulfonamide group.

metformin/semaglutide:
  answer: "Metformin is a tiny molecule that cuts glucose production in the liver, while semaglutide is a copy of the gut hormone GLP-1 that also curbs appetite."
  text: >
    These are both treatments for type 2 diabetes and they are barely comparable as molecules.
    Metformin is tiny, four carbons and five nitrogens at 129.16, descended from a compound in
    goat's rue, and it works mainly by reducing glucose production in the liver and improving
    insulin sensitivity. Semaglutide is a peptide of 31 amino acids at 4114, a modified copy
    of the gut hormone GLP-1 with a fatty acid chain attached so it binds albumin and lasts a
    week rather than minutes. Semaglutide slows stomach emptying and acts on appetite centres,
    which is why it also produces substantial weight loss, and metformin does so only
    slightly. Metformin is taken by mouth and remains the usual first-line choice; semaglutide
    is normally injected, with one oral formulation.

semaglutide/tirzepatide:
  answer: "Semaglutide acts on the GLP-1 receptor alone, while tirzepatide hits both the GIP and GLP-1 receptors, the basis for its larger reported weight loss."
  text: >
    Both are injectable peptides that copy gut hormones. Semaglutide is a GLP-1 receptor
    agonist; tirzepatide is a dual agonist, hitting both GIP and GLP-1 receptors, which is the
    basis for the larger average weight loss reported in head-to-head trials. Both carry a
    fatty acid chain that binds albumin and stretches their action to about a week. They are
    the two largest molecules in this catalog by a wide margin, semaglutide at 4114 and
    tirzepatide at 4813, so both are chains rather than small molecules and neither survives
    the stomach in its ordinary form. Semaglutide is sold as Ozempic and Wegovy, tirzepatide
    as Mounjaro and Zepbound.

# ── Skin, hair and infection ───────────────────────────────────────────────────
finasteride/minoxidil:
  answer: "Finasteride blocks the enzyme that makes DHT, the hormone behind male pattern hair loss, while minoxidil leaves hormones alone and widens scalp vessels."
  text: >
    Both are used for male pattern hair loss and they attack it from different directions.
    Finasteride blocks 5 alpha reductase, the enzyme that converts testosterone into
    dihydrotestosterone, and DHT is what miniaturises the follicle, so finasteride addresses
    the cause. Minoxidil does nothing to hormones at all: it was a blood pressure medicine
    whose side effect was hair growth, and applied to the scalp it widens vessels and appears
    to lengthen the growth phase of the follicle. Finasteride is a prescription steroid-like
    molecule taken by mouth at 372.5; minoxidil is sold over the counter as a topical liquid
    or foam at 209.25. Because the mechanisms do not overlap they are commonly used together.

isotretinoin/tretinoin:
  answer: "Isotretinoin and tretinoin share one formula and differ in one double bond; tretinoin is mostly used on skin and isotretinoin by mouth for severe acne."
  text: >
    The formula is C20H28O2 for both, and the weights are identical. Tretinoin is all-trans
    retinoic acid, the natural active form of vitamin A, used topically for acne and
    photoaging and given systemically for one type of leukaemia. Isotretinoin is the 13-cis
    isomer, used by mouth for severe acne, where it shrinks sebaceous glands in a way topical
    retinoids do not. Both are potent teratogens, which is why isotretinoin is dispensed under
    strict pregnancy-prevention programmes in the US and Europe. That is the practical meaning
    of the pair: the same atoms, one bond flipped, and two very different regulatory regimes.

aciclovir/valaciclovir:
  answer: "Valaciclovir is aciclovir with the amino acid valine attached, which the body removes, so swallowed valaciclovir delivers far more aciclovir to the blood."
  text: >
    The body removes that valine almost completely on first pass through the liver, so what
    circulates is aciclovir. The attachment exists purely to solve an absorption problem:
    aciclovir taken by mouth is poorly absorbed, and valaciclovir raises the amount that
    reaches the blood several fold. Both therefore work the same way, being activated only
    inside virus-infected cells by a viral enzyme and then jamming the viral DNA polymerase,
    which is what makes them so selective. Valaciclovir is the heavier molecule at 324.34
    against 225.2 because of the added valine, and fewer doses are needed. Aciclovir's
    discovery won a share of the 1988 Nobel Prize in Medicine.

amoxicillin/azithromycin:
  answer: "Amoxicillin is a penicillin that blocks bacterial cell wall building, while azithromycin is a macrolide that stops protein synthesis and lingers for days."
  text: >
    Both are common antibiotics and they belong to different classes with different targets.
    Amoxicillin is a penicillin: it carries the four-membered beta-lactam ring that blocks
    bacterial cell wall construction, which is why it is inactivated by beta-lactamase enzymes
    and why it is often paired with clavulanic acid. Azithromycin is a macrolide, a large
    15-membered ring that binds the bacterial ribosome and stops protein synthesis.
    Azithromycin accumulates inside tissue and clears very slowly, which is why a short course
    keeps working for days after the last dose, while amoxicillin clears in hours and must be
    taken repeatedly. Azithromycin is far the larger molecule at 749.0 against 365.4.
    Penicillin allergy is the usual reason a prescriber reaches for one class over the other.

doxycycline/azithromycin:
  answer: "Doxycycline and azithromycin both block bacterial protein making, but azithromycin is far larger and lingers in tissue, which is why its courses are short."
  text: >
    They bind different parts of the ribosome. Doxycycline is a tetracycline and blocks the
    30S subunit; azithromycin is a macrolide and blocks the 50S. Both penetrate tissue well
    and both cover the atypical organisms that cell-wall antibiotics miss, which is why they
    overlap in respiratory and sexually transmitted infections. Doxycycline causes
    photosensitivity and stains developing teeth, which is why it is avoided in young
    children, and azithromycin does not. Azithromycin is the much larger molecule at 749.0
    against 444.4, and its very long tissue half-life is why courses are short.

sildenafil/tadalafil:
  answer: "Sildenafil and tadalafil are both PDE5 inhibitors, but sildenafil acts for about four to six hours while tadalafil's effect can span a day and a half."
  text: >
    Both keep cyclic GMP from being broken down so blood vessels stay relaxed. Sildenafil acts
    for roughly four to six hours; tadalafil's half-life is around 17.5 hours and its effect
    can span a day and a half, which is why it acquired the weekend nickname. Sildenafil is
    the more affected by a fatty meal, which slows its absorption, and tadalafil much less so.
    Their side effect profiles follow their off-target selectivity: sildenafil has some
    activity at PDE6 in the retina, which produces the occasional blue tinge to vision, while
    tadalafil has more at PDE11, which is associated with back and muscle ache. Both were
    developed for cardiovascular indications before their current ones and both remain in use
    for pulmonary hypertension.

gabapentin/pregabalin:
  answer: "Gabapentin and pregabalin bind the same calcium channel subunit, but pregabalin is absorbed predictably and gabapentin less so as the amount rises."
  text: >
    Both are built on the skeleton of GABA, the brain's main inhibitory neurotransmitter, and
    neither actually acts on the GABA receptor. Both bind the alpha-2-delta subunit of voltage
    gated calcium channels instead, reducing the release of excitatory neurotransmitters,
    which is how they work in nerve pain and in some seizure types. The practical difference
    is absorption: gabapentin is taken up by a saturable transporter, so absorption falls as
    the amount rises and the response is hard to predict, while pregabalin is absorbed
    proportionally and predictably. Pregabalin is the smaller molecule at 159.23 against
    171.24 and is a controlled substance in the US and the UK where gabapentin's status
    varies.

# SEO run 2 (2026-10-28): "gaba vs gabapentin" in Search Console with no page of its own.
gamma-aminobutyric-acid/gabapentin:
  answer: "Gabapentin is GABA with a cyclohexane ring built onto its middle carbon, which lets it reach the brain, though it never acts on the GABA receptor itself."
  text: >
    GABA is the brain's main inhibitory neurotransmitter, a small amino acid of C4H9NO2 at
    103.12 that the body makes itself. Gabapentin, C9H17NO2 at 171.24, was designed as GABA with
    a cyclohexane ring attached to its middle carbon, the idea being a version that could cross
    from the blood into the brain, which GABA swallowed as a supplement does poorly. The ring
    worked for that, but the molecule turned out not to act on GABA receptors at all: it binds
    the alpha-2-delta subunit of voltage-gated calcium channels instead, reducing the release of
    excitatory neurotransmitters, which is how it treats seizures and nerve pain. GABA is sold as
    a supplement, gabapentin as a prescription medicine, Neurontin, approved by the FDA in 1993.
    The name is the only thing the two share in practice: one is the messenger, the other a
    medicine named after it.

prednisone/dexamethasone:
  answer: "Dexamethasone is several times more potent than prednisone, lasts far longer and needs no liver activation, while prednisone holds more sodium and water."
  text: >
    Both are corticosteroids that suppress inflammation through the glucocorticoid receptor.
    Prednisone is inactive as swallowed and must be converted by the liver into prednisolone,
    which dexamethasone does not require. They also differ in mineralocorticoid effect:
    prednisone retains some, so it holds sodium and water more than dexamethasone, which has
    essentially none, and that is why dexamethasone is preferred where fluid retention is a
    problem. Dexamethasone lasts far longer, with a biological effect measured in a day and a
    half against prednisone's half day. Dexamethasone carries a fluorine that prednisone
    lacks, at 392.5 against 358.4.

sumatriptan/naratriptan:
  answer: "Sumatriptan acts fast and clears in about 2.5 hours, while naratriptan is slower to start and lasts longer, with a half-life near 6 hours."
  text: >
    Both are triptans, agonists at serotonin 5-HT1B and 1D receptors, and both act on migraine
    by constricting cranial vessels and damping the trigeminal signalling that carries the
    pain. Sumatriptan was the first of the class and acts fast; naratriptan is slower to take
    effect and lasts considerably longer, with a half-life around 6 hours against
    sumatriptan's 2.5. That makes naratriptan the one aimed at long or recurring attacks and
    sumatriptan the one aimed at speed. Naratriptan is also generally the better tolerated of
    the two, with fewer reports of the chest tightness triptans are known for. Sumatriptan is
    available over the counter in some countries and naratriptan mostly is not.

# ── Fuels, fats and simple molecules ───────────────────────────────────────────
oleic-acid/linoleic-acid:
  answer: "Oleic acid has one double bond and the body can make it, while linoleic acid has two, oxidises faster and is essential, so it has to come from food."
  text: >
    Both are eighteen-carbon fatty acids, C18H34O2 against C18H32O2. Oleic acid has a single
    cis double bond and is monounsaturated; linoleic acid has two and is the parent of the
    omega-6 family. That second bond makes linoleic acid more prone to oxidation, which is why
    sunflower and corn oil go rancid faster than olive oil and why olive oil keeps longer on a
    shelf and holds up to moderate heat. Linoleic acid is essential: the human body cannot
    introduce a double bond that far along the chain, so it must come from food, while oleic
    acid the body makes for itself. Oleic acid is most of olive oil and is why it stays liquid
    in a fridge where butter does not.

palmitic-acid/stearic-acid:
  answer: "Stearic acid is two carbons longer than palmitic acid, so it melts at a higher temperature, and unlike palmitic acid it has little effect on blood cholesterol."
  text: >
    Both are saturated fatty acids with no double bonds at all, C16H32O2 against C18H36O2.
    That length difference raises stearic acid's melting point, which is why it is the one
    that gives a candle and a bar of soap their body and why cocoa butter is solid at room
    temperature and melts in the mouth. Palmitic acid is the most common saturated fat in the
    food supply and in human tissue, and is the one the body makes first when it synthesises
    fat. Their metabolic reputations differ: stearic acid is largely converted to oleic acid
    in the liver and has little effect on blood cholesterol, while palmitic acid raises LDL,
    which is unusual for two molecules so nearly identical.

butane/propane:
  answer: "Butane, C4H10, has one more carbon than propane, C3H8, and boils near freezing, so propane stays a usable gas in cold weather and butane does not."
  text: >
    Both are alkanes sold as bottled fuel. Propane boils at about minus 42 degrees Celsius and
    butane at about minus 1, which means propane stays a usable gas in cold weather and butane
    will not vaporise properly near freezing. That is the whole reason a winter camping stove
    takes propane and a lighter takes butane. Butane is the heavier at 58.12 against 44.1 and
    liquefies under gentler pressure, which is why it can be held in a thin clear lighter body
    while propane needs a steel cylinder. Butane delivers slightly more energy per unit volume
    as a liquid, and propane more per unit weight.

methane/propane:
  answer: "Methane must be piped as a gas because it only liquefies near minus 162 degrees Celsius, while propane liquefies under modest pressure and can be bottled."
  text: >
    Both are alkanes burned as fuel. Methane is the simplest hydrocarbon, CH4, and boils at
    about minus 162 degrees Celsius, so keeping it liquid needs cryogenic equipment and mains
    gas is delivered as a gas through pipes instead. Propane liquefies under modest pressure
    at ordinary temperatures, which is why a barbecue bottle can hold days of fuel in a few
    kilograms. Propane also carries more energy per unit volume, so a burner designed for one
    will not run correctly on the other without a jet change. Methane is much the lighter at
    16.04 against 44.1 and rises when it leaks; propane is heavier than air and pools, which
    is a real difference in how a leak behaves.

benzene/toluene:
  answer: "Toluene is benzene with a methyl group; benzene is a known human carcinogen, while toluene is not classified as one because the body can oxidise that group."
  text: >
    The formulas show the one group, C7H8 against C6H6, and it changes the hazard picture
    completely. Benzene is a known human carcinogen that damages bone marrow and causes
    leukaemia, and its use in consumer products is tightly restricted for that reason. Toluene
    is not classified as a carcinogen, because the body can oxidise that methyl group and
    excrete the result, a route benzene has no equivalent of. Toluene is still a neurotoxin on
    repeated inhalation, which is what makes solvent abuse dangerous, and it is the smell of
    paint thinner and permanent marker. Benzene's reported oral LD50 is 3306 mg/kg in rats, a
    figure that understates how differently the two behave over long exposure.

formaldehyde/acetaldehyde:
  answer: "Formaldehyde is the simplest aldehyde, used in resins and embalming, while acetaldehyde is what ethanol becomes in the body and drives much of a hangover."
  text: >
    Both are small aldehydes, both are reactive, and both are classified as carcinogenic to
    humans, but they arrive by different routes. Formaldehyde is the simplest of all aldehydes
    at 30.03, used in resins, embalming fluid and disinfectants, and it cross-links proteins
    on contact, which is precisely what preservation and what irritation both are.
    Acetaldehyde at 44.05 is what ethanol becomes as the body breaks it down, and it is
    responsible for much of a hangover and for the flushing reaction in people whose version
    of the clearing enzyme works slowly. Their reported oral LD50 values differ by more than
    sixfold, 100 mg/kg in rats for formaldehyde against 661 mg/kg for acetaldehyde. The body
    produces both in small amounts as a normal part of metabolism.

caffeine/theanine:
  answer: "Caffeine is an alkaloid that blocks adenosine and produces alertness, while theanine is a tea amino acid that takes the edge off caffeine's jitteriness."
  text: >
    These two arrive together in tea and are usually discussed as an offsetting pair. Caffeine
    is an alkaloid that blocks adenosine receptors and produces alertness. Theanine is an
    amino acid found almost nowhere but the tea plant, structurally close to glutamate, and it
    appears to raise alpha wave activity and take the edge off caffeine's jitteriness without
    cancelling the alertness. That combination is the usual explanation for why a cup of green
    tea feels different from a coffee of similar caffeine content. They are unrelated
    molecules, C8H10N4O2 against C7H14N2O3, and theanine is the lighter at 174.2. Theanine has
    no reported stimulant effect on its own.

# ── Catalog tranche 2026-10-A: each new medicine beside the one people compare it with ──
armodafinil/modafinil:
  answer: "Modafinil is an even mix of two mirror-image forms and armodafinil is the R form alone, which clears more slowly, so its effect runs later into the day."
  text: >
    Armodafinil and modafinil share one formula, C15H15NO2S, and one weight, 273.4, because
    they are the same molecule. Modafinil is an even mix of two mirror-image forms, and
    armodafinil is the R form on its own. The R form is the one that lingers: it clears from
    the body more slowly than its partner, so armodafinil's effect runs later into the day.
    Both are prescription wakefulness medicines, sold as Provigil and Nuvigil, used for
    narcolepsy and shift work sleep disorder. The mirror image sits at the sulfur atom, which
    carries an oxygen and two different groups.

dexmethylphenidate/methylphenidate:
  answer: "Methylphenidate is a mix of two mirror-image forms, and dexmethylphenidate is the active d-threo form isolated, so the same molecule does the work."
  text: >
    The two share the formula C14H19NO2 and a weight of 233.3. The Ritalin molecule is a mix
    of two mirror-image forms, and nearly all of its effect on dopamine and norepinephrine
    comes from the d-threo form that Focalin isolates. Removing the inactive half changes how
    much is in a tablet, not how the active molecule works. Both are prescription stimulants
    for ADHD and controlled substances in the United States and the UK.

eszopiclone/zopiclone:
  answer: "Zopiclone is an even mix of two mirror-image forms, and eszopiclone is the active S form isolated, the version approved in the United States."
  text: >
    The two share the formula C17H17ClN6O3 and a weight of 388.8. Zopiclone, sold as Zimovane
    and Imovane in the UK and Europe, is an even mix of both forms, while eszopiclone, sold as
    Lunesta, is the active form isolated and the version approved in the United States.
    Neither is a benzodiazepine, but both act at the same GABA-A receptor, which is why they
    are grouped with zolpidem as the Z-drugs. They share a famous side effect, a bitter
    metallic taste, because the molecule is secreted into saliva.

testosterone-enanthate/testosterone-cypionate:
  answer: "Testosterone enanthate and testosterone cypionate differ only in the fatty tail on the same oxygen, and both release plain testosterone once inside."
  text: >
    The tails are a straight seven-carbon enanthate chain and a cyclopentylpropionate group.
    That makes cypionate one carbon heavier, C27H40O3 at 412.6 against C26H40O3 at 400.6. The
    tail holds the molecule in an oily injection depot, and the body clips it off to release
    plain testosterone, so the two behave almost identically once inside. Cypionate is the
    common injectable in the United States, sold as Depo-Testosterone, while enanthate is more
    widely used elsewhere and in the Xyosted autoinjector.

fluticasone-propionate/budesonide:
  answer: "Fluticasone propionate carries three fluorines and a sulfur and is the more potent, while budesonide has neither and also comes as a capsule for the gut."
  text: >
    Fluticasone propionate and budesonide are corticosteroids made to work on the surface they
    are sprayed or inhaled onto, and both are sold for hay fever without a prescription in the
    United States, as Flonase and Rhinocort. Fluticasone carries three fluorine atoms and a
    sulfur, C25H31F3O5S at 500.6, where budesonide has neither, C25H34O6 at 430.5. Fluticasone
    is the more potent at the receptor. Most of either that is swallowed is broken down by the
    liver on its first pass, which keeps the amount reaching the rest of the body small.
    Budesonide also comes as a capsule for the gut in Crohn's disease, a form fluticasone does
    not have.

ramipril/lisinopril:
  answer: "Ramipril is a prodrug the liver must convert into ramiprilat, while lisinopril is active as swallowed and leaves the body unchanged."
  text: >
    Ramipril and lisinopril are ACE inhibitors, two of the most widely prescribed blood
    pressure medicines, and both descend from a peptide found in the venom of a Brazilian pit
    viper. The main chemical difference is that ramipril is a prodrug: it is an ethyl ester
    that the liver must cut to make ramiprilat, the active form, while lisinopril is active as
    swallowed. Lisinopril is also unusual in its class for not being processed by the liver at
    all, and it leaves the body unchanged in urine. Their formulas are C23H32N2O5 at 416.5 and
    C21H31N3O5 at 405.5. Both are prescription medicines, sold as Tritace and Altace, and as
    Zestril and Prinivil.

nifedipine/amlodipine:
  answer: "Amlodipine lasts well over a day, while nifedipine clears within hours, which is why nifedipine is mostly made in slow-release forms."
  text: >
    Both are dihydropyridine calcium channel blockers, built on the same six-membered ring,
    and both widen arteries by keeping calcium out of the muscle in their walls. The
    difference that matters is time: amlodipine has a half-life of well over a day, while
    nifedipine clears within hours, which is why nifedipine is mostly made in slow-release
    forms. Amlodipine carries a chlorine and a longer side chain, C20H25ClN2O5 at 408.9, while
    nifedipine carries a nitro group, C17H18N2O6 at 346.3. Nifedipine came first, in the
    1970s, and amlodipine followed in the late 1980s to become one of the most prescribed
    medicines in the world. Both are prescription medicines, sold as Adalat and Procardia, and
    as Norvasc.

diltiazem/verapamil:
  answer: "Diltiazem and verapamil both act on the heart as well as blood vessels, but verapamil, a phenylalkylamine, has the stronger effect on heart rhythm."
  text: >
    That sets them apart from amlodipine and the other dihydropyridines. That is why both are
    used to slow some fast heart rhythms, not only for blood pressure and angina. They come
    from different chemical families: diltiazem is a benzothiazepine with a sulfur in its
    ring, C22H26N2O4S at 414.5, while verapamil is a phenylalkylamine, C27H38N2O4 at 454.6.
    Verapamil has the stronger effect on the heart's rhythm, and diltiazem sits between it and
    the dihydropyridines. Both are prescription medicines, sold as Cardizem and as Calan.

atenolol/propranolol:
  answer: "Propranolol blocks beta receptors in the heart, lungs and vessels and enters the brain, while atenolol prefers the heart's receptors and barely enters it."
  text: >
    Propranolol was the first beta blocker. Atenolol is also far more water-soluble, so it
    barely crosses into the brain, while propranolol enters readily, which is part of why
    propranolol is used for tremor, migraine prevention and the physical side of stage fright.
    Their formulas are C14H22N2O3 at 266.3 and C16H21NO2 at 259.3. Atenolol leaves the body
    mostly unchanged through the kidneys, while propranolol is processed by the liver. Both
    are prescription medicines, sold as Tenormin and Inderal.

simvastatin/atorvastatin:
  answer: "Simvastatin is made from a fungal compound and swallowed as an inactive lactone, while atorvastatin is fully synthetic and active as taken."
  text: >
    Both are statins that block HMG-CoA reductase, the enzyme at the top of the body's
    cholesterol assembly line, but they come from different starting points. Simvastatin is
    made from lovastatin, a compound produced by a fungus, and it is swallowed as an inactive
    lactone that the liver opens up. Atorvastatin is fully synthetic, carries a fluorine atom
    and is active as taken: C33H35FN2O5 at 558.6 against simvastatin's C25H38O5 at 418.6.
    Atorvastatin, sold as Lipitor, became the best-selling medicine of all time, and
    simvastatin, sold as Zocor, was the statin of the landmark trials of the 1990s.

liraglutide/semaglutide:
  answer: "Liraglutide and semaglutide both copy GLP-1, but semaglutide's longer fatty chain and one changed amino acid stretch its effect from about a day to a week."
  text: >
    GLP-1 is a gut hormone that signals fullness and helps release insulin, and each copy is
    fitted with a fatty acid so it rides on albumin in the blood and lasts far longer than the
    natural hormone. Liraglutide came first, approved for diabetes in 2009 as Victoza and
    later for weight loss as Saxenda. Semaglutide, from the same company, carries a longer
    fatty chain and one changed amino acid that resists breakdown, which stretches its effect
    from about a day to about a week. That is the difference in the formulas, C172H265N43O51
    at about 3,751 against C187H291N45O59 at about 4,114. Semaglutide is sold as Ozempic and
    Wegovy, and as Rybelsus, a tablet.

oxazepam/diazepam:
  answer: "Oxazepam is one of the molecules diazepam turns into in the body, and it is cleared within hours where diazepam and nordazepam stay for days."
  text: >
    The liver strips diazepam's methyl group and adds a hydroxyl, and the result is a
    benzodiazepine in its own right. That is the whole difference in the formulas,
    C15H11ClN2O2 at 286.7 against C16H13ClN2O at 284.7. Diazepam and its first breakdown
    product, nordazepam, stay in the body for days, while oxazepam is cleared within hours by
    being joined to a sugar acid. Because oxazepam skips the liver's oxidising enzymes, its
    clearance changes less when the liver is impaired. Both are prescription medicines, sold
    as Serax and Valium.

betamethasone/dexamethasone:
  answer: "Betamethasone and dexamethasone differ only in one methyl group, which points up from the ring in one and down in the other."
  text: >
    Betamethasone and dexamethasone have the same formula, C22H29FO5, the same weight of
    392.5, and the same atoms connected in the same order. That one flipped group makes them
    stereoisomers rather than one molecule. Both are long-acting corticosteroids with a
    fluorine atom that makes them many times stronger than the body's own cortisol.
    Dexamethasone became famous in 2020 as the first treatment shown to reduce deaths from
    severe COVID-19, and betamethasone is widely used in skin creams such as Betnovate. Both
    are prescription medicines, sold as Decadron and as Celestone.

tamoxifen/letrozole:
  answer: "Tamoxifen blocks the estrogen receptor so estrogen cannot act, while letrozole blocks aromatase, the enzyme that makes estrogen, so less of it exists."
  text: >
    Tamoxifen and letrozole both deprive hormone-sensitive breast cancer of estrogen, from
    opposite ends. Tamoxifen blocks the estrogen receptor in breast tissue, so the hormone is
    present but cannot act there, while letrozole blocks aromatase, the enzyme that makes
    estrogen, so less of it exists at all. That is why letrozole is used after menopause, when
    aromatase in fat tissue is the main source, while tamoxifen works before and after it.
    They look nothing alike: tamoxifen, C26H29NO at 371.5, is built on a triphenylethylene
    skeleton, and letrozole, C17H11N5 at 285.3, carries a triazole ring and two nitrile
    groups. Both are prescription medicines, sold as Nolvadex and Femara.

ropinirole/pramipexole:
  answer: "Ropinirole is an indolone processed by the liver, while pramipexole carries a sulfur in an aminothiazole ring and leaves largely unchanged through the kidneys."
  text: >
    Ropinirole and pramipexole are the two dopamine agonists most used for Parkinson's disease
    and restless legs syndrome, and both act on the D2 and D3 dopamine receptors directly
    rather than being turned into dopamine like L-DOPA. They are not built alike: ropinirole,
    C16H24N2O at 260.4, is an indolone, while pramipexole, C10H17N3S at 211.3, carries a
    sulfur in an aminothiazole ring. Ropinirole is processed by the liver, while pramipexole
    leaves the body largely unchanged through the kidneys. Both labels list the same
    well-known side effect, impulse control problems such as compulsive gambling. Both are
    prescription medicines, sold as Requip and as Mirapex.

oxcarbazepine/carbamazepine:
  answer: "Oxcarbazepine is carbamazepine with one added oxygen, and it does far less to speed up the liver enzymes that clear other medicines."
  text: >
    Oxcarbazepine was designed as a gentler carbamazepine on a shared tricyclic dibenzazepine
    skeleton, C15H12N2O2 at 252.3 against C15H12N2O at 236.3. That one atom changes the route
    through the body. The liver turns carbamazepine into an epoxide, and carbamazepine speeds
    up the liver enzymes that clear it and many other medicines, while oxcarbazepine is
    reduced to a different active form and does far less of that. Both block sodium channels
    in nerve cells and are used for epilepsy and nerve pain, and both are prescription
    medicines, sold as Tegretol and Trileptal.

dutasteride/finasteride:
  answer: "Finasteride blocks one form of 5-alpha reductase while dutasteride blocks both, lowering DHT further, and dutasteride stays in the body for weeks."
  text: >
    Finasteride and dutasteride both block 5-alpha reductase, the enzyme that turns
    testosterone into the more potent DHT, and both are used for an enlarged prostate.
    Finasteride blocks one form of the enzyme, type 2, while dutasteride blocks both type 1
    and type 2, which lowers DHT further. The chemical difference is six fluorine atoms:
    dutasteride replaces finasteride's tert-butyl group with a ring carrying two
    trifluoromethyl groups, C27H30F6N2O2 at 528.5 against C23H36N2O2 at 372.5. Dutasteride
    also stays in the body for weeks, against hours for finasteride. Finasteride is also sold
    as Propecia for hair loss, while dutasteride is sold as Avodart.

brexpiprazole/aripiprazole:
  answer: "Brexpiprazole is the successor to aripiprazole: it switches on dopamine D2 receptors less and acts more strongly on serotonin receptors."
  text: >
    The two share one design: both partly switch on dopamine D2 receptors rather than blocking
    them outright, which sets them apart from older antipsychotics. Brexpiprazole switches
    them on less and acts more strongly on serotonin receptors. Both are built around a
    piperazine ring; aripiprazole carries two chlorine atoms, C23H27Cl2N3O2 at 448.4, where
    brexpiprazole carries a sulfur in a benzothiophene ring, C25H27N3O2S at 433.6. Both are
    used for schizophrenia and alongside antidepressants for depression, and both are
    prescription medicines, sold as Abilify and Rexulti.

hyoscine-butylbromide/scopolamine:
  answer: "Hyoscine butylbromide is scopolamine with a charged nitrogen, so it stays in the gut and relaxes its muscle, while scopolamine reaches the brain."
  text: >
    Hyoscine and scopolamine are two names for the same nightshade alkaloid, and hyoscine
    butylbromide is that molecule with a butyl group and a bromide added at its nitrogen. The
    change gives the nitrogen a permanent positive charge, C21H30BrNO4 at 440.4 against
    C17H21NO4 at 303.4, and a charged molecule barely crosses into the brain or through the
    gut wall. So scopolamine acts on the brain and is used against motion sickness, as the
    small patch worn behind the ear, while hyoscine butylbromide stays in the gut and relaxes
    its muscle, which is why it is sold as Buscopan for stomach cramps. Both block the same
    acetylcholine receptors.

cortisone/cortisol:
  answer: "Cortisone is cortisol with a ketone where cortisol has a hydroxyl group, and it does nothing at the receptor until the body turns it back into cortisol."
  text: >
    The difference is two hydrogen atoms at a single carbon, C21H28O5 at 360.4 against
    C21H30O5 at 362.5. That one change switches the hormone off: cortisone does nothing at the
    receptor until an enzyme in the liver and in fat turns it back into cortisol. The body
    runs the conversion both ways, and the kidney turns cortisol into cortisone to keep it off
    the kidney's own salt-balance receptors. Cortisone was the first steroid medicine, and its
    effect on rheumatoid arthritis won the 1950 Nobel Prize in medicine; cortisol is now used
    directly, as hydrocortisone.

fluorouracil/uracil:
  answer: "Fluorouracil is uracil with one fluorine in place of a hydrogen, a fake RNA building block that jams DNA synthesis in fast-dividing cancer cells."
  text: >
    Uracil is one of the four building blocks of RNA, and the formulas show the swap,
    C4H3FN2O2 at 130.1 against C4H4N2O2 at 112.1. Fluorine is close enough in size to hydrogen
    that cells take the fake building block up and process it like the real one. Once inside,
    it jams thymidylate synthase, the enzyme cells need to make DNA's thymine, and it is built
    into RNA in uracil's place, which stops fast-dividing cancer cells. Uracil is made by
    every living cell, while fluorouracil, known as 5-FU, was designed in 1957 as one of the
    first rationally planned cancer medicines.

adapalene/tretinoin:
  answer: "Tretinoin is retinoic acid, the active form of vitamin A, while adapalene is a far more stable, lab-designed molecule that acts at the same receptors."
  text: >
    Adapalene was built to act at those receptors without being a vitamin A molecule at all.
    Tretinoin, C20H28O2 at 300.4, has a long chain of alternating double bonds that light and
    air break down, while adapalene, C28H28O3 at 412.5, replaces it with rigid aromatic rings
    and is far more stable. Adapalene binds mainly two of the three receptor types. That
    stability is part of why adapalene, as Differin, became the first retinoid sold without a
    prescription in the United States in 2016, while tretinoin, as Retin-A, remains
    prescription only there.
