    - {slug: caryophyllene, presence: natural, presence_note: "Part of the peppercorn's essential oil."}
    - {slug: limonene, presence: natural, presence_note: "Part of the peppercorn's essential oil."}
    - {slug: alpha-pinene, presence: natural, presence_note: "Part of the peppercorn's essential oil."}
    - {slug: myrcene, presence: natural, presence_note: "Part of the peppercorn's essential oil."}
    - {slug: linalool, presence: natural, presence_note: "Part of the peppercorn's essential oil."}

table-sugar:
