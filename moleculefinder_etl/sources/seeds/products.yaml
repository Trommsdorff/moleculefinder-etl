# What's in it: the product seed (growth plan run C1, 2026-10-22). HAND-MAINTAINED.
#
# One row per product, food or drink: slug (the URL, /whats-in/<slug>; permanent once live), name
# (shown as the product's name and nothing more: no logo, no packaging, no claim beyond its
# ingredient list), kind (food, drink, medicine, cosmetic, household, chemistry, moment) and ONE
# source item:
#   dailymed: <set id>   the product's SPL label on DailyMed (public domain): its ingredient list,
#                        active/inactive split and OTC "Purpose" lines. Pick the brand owner's
#                        label, not a repackager's; scripts/draft_products.py drafts candidates.
#   wikidata: <QID>      a food or drink's "has part(s)" (P527) and "made from material" (P186) (CC0)
#   world: <slug>        one of the ten everyday worlds (worlds.yaml)
#   curated: <hub slug>  a MoleculeFinder curated food hub (food_hubs.yaml plus the curated overlays:
#                        the membership /in/<hub> lists). Amendment, 2026-10-22.
#   class: <slug>        a class of everyday chemicals in product_classes.yaml (PFAS), kind chemistry,
#                        standing alone. Run C2, 2026-10-22.
# A food or drink row may name more than one of curated, world and wikidata (never with dailymed): the
# page is their union, curated first, then the world, then Wikidata, one entry per molecule.
#
# THE GATE (Garrett, 2026-10-22): a product page exists only when MoleculeFinder already holds at
# least THREE of its molecules, matched by code (a label ingredient's UNII against PubChem's UNII
# synonyms, a Wikidata part's QID against the record's wikidata_qid; no name matching, no Wikipedia
# prose, no Open Food Facts). A row here is a candidate, not a page: every row that fails is listed
# with its reason in data/seed/products_gate.json, which the weekly run rewrites. 300 to 500 pages
# is the expected result, not a quota.
#
# No em or en dashes in names (house rule; the compiler refuses one).

