# Food hub membership (build plan 2026-09-05, phase 2.3)
# ------------------------------------------------------------------------------
# WHY: 14 of the 17 /in/<food> hubs had two molecules or fewer. /in/coffee was a
# one-molecule page (caffeine) competing with /roam/morning-coffee, which has seven.
#
# HOW, and a deliberate departure from the plan. The plan said to populate a thin
# food hub "from the world's member list". Taken literally that ships false claims:
# the `spicy-dinner` world contains piperine, gingerol, allicin and allyl
# isothiocyanate, which come from pepper, ginger, garlic and mustard, NOT from chili
# peppers, and the `morning-coffee` world contains adenosine and paraxanthine, which
# are in the DRINKER, not the drink. A world is an experience; a food hub is a
# factual "this is in that". So the membership is hand-curated here instead, drawing
# on the world rosters where the world genuinely is the food (coffee, chocolate,
# wine) and on the food itself where it is not.
#
# Every entry is a documented component or a standard ingredient of the food named.
# Additive and idempotent: it never removes a membership a curated/*.yaml overlay
# already set, and every slug is validated against the snapshot, so a typo fails the
# build rather than shipping a dangling hub.
#
# `name` overrides the titleized slug where title case would look wrong.
#
# PRESENCE (build plan everyday chemistry 2026-11, phase 1; Garrett's rulings b and g, 2026-11-09).
# Every entry says, by hand, how its molecule comes to be in the food or drink: presence natural, added,
# body, formed (with formed_when: roasted, baked, cooked, cured, aged or fermentation) or none (with a
# written presence_note). presence_note is the one-line reason. transform/presence.py holds the closed
# list; an entry with no mark, or a bad one, stops the build and fails pytest.

coffee:
  name: Coffee
  molecules:
    - {slug: caffeine, presence: natural, presence_note: "Made by the coffee plant; it carries into the brewed cup."}   # the reason most people drink it
    - {slug: chlorogenic-acid, presence: natural, presence_note: "A polyphenol of the coffee bean; roasting breaks part of it down."}   # the most abundant polyphenol in a cup
    - {slug: caffeic-acid, presence: natural, presence_note: "Half of chlorogenic acid in the bean, and freed from it as the bean roasts."}   # chlorogenic acid's other half
    - {slug: theobromine, presence: natural, presence_note: "Present in trace amounts in the coffee bean."}   # trace, alongside caffeine
    - {slug: theophylline, presence: natural, presence_note: "Present in trace amounts in the coffee bean."}   # trace, alongside caffeine
    - {slug: niacin, presence: formed, formed_when: roasted, presence_note: "Formed from trigonelline as the beans roast."}   # formed from trigonelline during roasting
    - {slug: guaiacol, presence: formed, formed_when: roasted, presence_note: "Formed from ferulic acid as the beans roast."}   # roast smoke note
    - {slug: furfural, presence: formed, formed_when: roasted, presence_note: "Formed from the bean's sugars as it roasts."}   # roast note, and a staling marker
    - {slug: hydroxymethylfurfural, presence: formed, formed_when: roasted, presence_note: "Formed from the bean's sugars as it roasts."}   # forms as the sugars caramelize in the roast
    - {slug: acrylamide, presence: formed, formed_when: roasted, presence_note: "Formed from asparagine and sugars as the beans roast."}   # forms from asparagine and sugars in the roast
    - {slug: water, presence: added, presence_note: "The brewing water, about 98 percent of the cup."}   # about 98 percent of the cup by weight
    - {slug: potassium, presence: natural, presence_note: "A mineral the bean carries into the cup."}   # coffee is a leading dietary source in many diets
    - {slug: magnesium, presence: natural, presence_note: "A mineral the bean carries into the cup."}
    - {slug: acetaldehyde, presence: formed, formed_when: roasted, presence_note: "A volatile formed as the beans roast; it fades as coffee stales."}   # a roast volatile, and it fades as the coffee stales

