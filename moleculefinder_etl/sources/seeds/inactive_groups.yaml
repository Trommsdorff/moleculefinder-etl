# Codes a label carries whose name sits near a group above, which the group does NOT take, with the
# reason. The page lists them. `near` is the group a reader may expect them in.
kept_apart:
  - unii: Y6O7T4G8P9
    near: silicon-dioxide
    gsrs_name: "HYDRATED SILICA"
    gsrs_status: approved
    arguable: true
    reason: "The registry links hydrated silica to silicon dioxide as its hydrate, which would put it in the group by the rule. It is a different material in use (a precipitated silica), so it is kept apart and shown."
  - unii: 5K3991GVWI
    near: polyethylene-glycol
    gsrs_name: "POLYETHYLENE OXIDE 2000000"
    gsrs_status: approved
    arguable: true
    reason: "The same polymer as polyethylene glycol at a far greater chain length, sold and named as a different material. Kept apart and shown."
  - unii: 2165RE0K14
    near: hydroxypropyl-cellulose
    gsrs_name: "LOW-SUBSTITUTED HYDROXYPROPYL CELLULOSE, UNSPECIFIED"
    gsrs_status: approved
    arguable: true
    reason: "Hydroxypropyl cellulose with far fewer hydroxypropyl groups, a separate pharmacopoeia material that does not dissolve in water. Kept apart and shown."
  - unii: NZ94SDL6WR
    near: hydroxypropyl-cellulose
    gsrs_name: "LOW-SUBSTITUTED HYDROXYPROPYL CELLULOSE (11% HYDROXYPROPYL; 120000 MW)"
    gsrs_status: FAILED
    arguable: true
    reason: "Low-substituted hydroxypropyl cellulose, kept apart for the same reason."
  - unii: 8M707QY5GH
    near: sucrose
    gsrs_name: "RAW SUGAR"
    gsrs_status: approved
    arguable: true
    reason: "Mostly sucrose, but a less refined material with other parts of the cane left in. Kept apart and shown."
  - unii: 8KW3E207O2
    near: sorbitol
    gsrs_name: "SORBITOL SOLUTION"
    gsrs_status: approved
    arguable: true
    reason: "Sorbitol dissolved in water, a mixture rather than a form of sorbitol. Kept apart and shown."
  - unii: 87Y6436BKR
    near: hypromellose
    gsrs_name: "HYPROMELLOSE PHTHALATE (24% PHTHALATE, 55 CST)"
    gsrs_status: approved
    reason: "An ester made from hypromellose: chemically changed, so its own group."
  - unii: G4U024CQK6
    near: hypromellose
    gsrs_name: "HYPROMELLOSE PHTHALATE (31% PHTHALATE, 40 CST)"
    gsrs_status: FAILED
    reason: "An ester made from hypromellose: chemically changed, so its own group."
  - unii: A7ZHS2RJ34
    near: hypromellose
    gsrs_name: "HYPROMELLOSE ACETATE SUCCINATE, UNSPECIFIED"
    gsrs_status: approved
    reason: "An ester made from hypromellose: chemically changed, so its own group."
  - unii: 3J2P07GVB6
    near: cellulose
    gsrs_name: "CELLULOSE ACETATE"
    gsrs_status: FAILED
    reason: "An ester made from cellulose: chemically changed, so its own group."
  - unii: 05JZI7B19X
    near: carboxymethylcellulose-sodium
    gsrs_name: "CARBOXYMETHYLCELLULOSE"
    gsrs_status: approved
    reason: "The registry's record for carboxymethylcellulose itself, not its sodium salt, so its own group."
  - unii: UTY7PDF93L
    near: carboxymethylcellulose-sodium
    gsrs_name: "CARBOXYMETHYLCELLULOSE CALCIUM"
    gsrs_status: FAILED
    reason: "The calcium salt, not the sodium salt, so its own group."
  - unii: D9C330MD8B
    near: povidone
    gsrs_name: "COPOVIDONE K25-31"
    gsrs_status: approved
    reason: "A copolymer of povidone's building block with another, so its own group."
