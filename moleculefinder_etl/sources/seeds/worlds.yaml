# Everyday Worlds — the 10 curated starter worlds for /roam (build spec §3).
#
# Each world is an experience-first landing page: a recognizable moment (coffee, rain,
# sleep) unpacked into the molecules inside it. `molecules` is the exact §3 list, mapped
# to the snapshot's real slugs. `journey` is an ordered narrative subset for the guided
# strip (screen 2). `tint` is the world's dominant Scope B bucket (its --bucket-* hue).
#
# Every molecule slug below is verified present in the current 489 snapshot. The compiler
# (transform/relationships.py) re-validates every slug against the snapshot at build time
# and fails loudly on a typo, so this file can never ship a dangling reference.
#
# Captions and blurbs are neutral, no health advice, no em-dashes (house rules).
#
# PRESENCE (build plan everyday chemistry 2026-11, phase 1; Garrett's rulings b and g, 2026-11-09).
# Every entry says, by hand, how its molecule comes to be in the world: presence natural, added,
# body, formed (with formed_when: roasted, baked, cooked, cured, aged or fermentation) or none (with a
# written presence_note). presence_note is the one-line reason. transform/presence.py holds the closed
# list; an entry with no mark, or a bad one, stops the build and fails pytest.

worlds:
  - slug: morning-coffee
    title: Morning coffee
    blurb: What's in your cup, and why it wakes you up.
    tint: food-flavor
    molecules:
      - {slug: caffeine, presence: natural, presence_note: "Made by the coffee plant; it carries into the brewed cup."}
      - {slug: chlorogenic-acid, presence: natural, presence_note: "A polyphenol of the coffee bean; roasting breaks part of it down."}
      - {slug: theobromine, presence: natural, presence_note: "Present in trace amounts in the coffee bean."}
      - {slug: niacin, presence: formed, formed_when: roasted, presence_note: "Formed from trigonelline as the beans roast."}
      - {slug: paraxanthine, presence: body, presence_note: "Your liver makes it from caffeine."}
      - {slug: adenosine, presence: body, presence_note: "Your body makes it; caffeine blocks its receptors."}
      - {slug: theophylline, presence: natural, presence_note: "Present in trace amounts in the coffee bean."}
    journey:
      - {slug: caffeine, caption: in your cup}
      - {slug: adenosine, caption: blocks}
      - {slug: paraxanthine, caption: becomes}
      - {slug: chlorogenic-acid, caption: also in the cup}

  - slug: spicy-dinner
    title: A spicy dinner
    blurb: The molecules that make food burn.
    tint: plant-compound
    molecules:
      - {slug: capsaicin, presence: natural, presence_note: "Made by the chili pepper."}
      - {slug: piperine, presence: natural, presence_note: "Made by the pepper plant, in the peppercorn."}
      - {slug: gingerol, presence: natural, presence_note: "Made by the ginger root."}
      - {slug: shogaol, presence: formed, formed_when: cooked, presence_note: "Formed from gingerol when ginger is dried or cooked."}
      - {slug: allicin, presence: formed, formed_when: crushed, presence_note: "Formed by an enzyme when garlic is crushed or cut; intact garlic holds alliin instead."}
      - {slug: allyl-isothiocyanate, presence: formed, formed_when: crushed, presence_note: "Formed by an enzyme when mustard seed or horseradish is crushed and wetted."}
    journey:
      - {slug: capsaicin, caption: the chili burn}
      - {slug: piperine, caption: milder cousin}
      - {slug: gingerol, caption: ginger heat}
      - {slug: allicin, caption: garlic bite}

  - slug: chocolate
    title: Chocolate
    blurb: Why chocolate feels good.
    tint: food-flavor
    molecules:
      - {slug: theobromine, presence: natural, presence_note: "From the cocoa bean."}
      - {slug: caffeine, presence: natural, presence_note: "From the cocoa bean, in smaller amounts than theobromine."}
      - {slug: phenethylamine, presence: formed, formed_when: fermentation, presence_note: "Made by microbes as the cocoa ferments; roasting forms more."}
      - {slug: anandamide, presence: natural, presence_note: "Reported in small amounts in the cocoa bean."}
      - {slug: tryptophan, presence: natural, presence_note: "An amino acid of the cocoa proteins."}
      - {slug: tyramine, presence: formed, formed_when: fermentation, presence_note: "Made by microbes from the bean's amino acids as the cocoa ferments."}
    journey:
      - {slug: theobromine, caption: chocolate's stimulant}
      - {slug: caffeine, caption: cousin}
      - {slug: phenethylamine, caption: mood lift}
      - {slug: anandamide, caption: bliss molecule}

  - slug: after-the-rain
    title: The smell after rain
    blurb: Petrichor, molecule by molecule.
    tint: scent-aroma
    molecules:
      - {slug: geosmin, presence: natural, presence_note: "Made by soil bacteria; rain lifts it into the air."}
      - {slug: dimethyl-sulfide, presence: natural, presence_note: "Made by microbes in soil and water."}
      - {slug: methanethiol, presence: natural, presence_note: "Made by microbes in soil and water."}
    journey:
      - {slug: geosmin, caption: the petrichor note}
      - {slug: dimethyl-sulfide, caption: also earthy}
      - {slug: methanethiol, caption: sulfur note}

  - slug: falling-asleep
    title: Falling asleep
    blurb: The chemistry of a good night.
    tint: body-endogenous
    molecules:
      - {slug: melatonin, presence: body, presence_note: "Your pineal gland makes it as darkness falls."}
      - {slug: adenosine, presence: body, presence_note: "Your body makes it; it builds up through the waking day."}
      - {slug: gamma-aminobutyric-acid, presence: body, presence_note: "Your brain makes it from glutamate."}
      - {slug: glycine, presence: body, presence_note: "Your body makes it."}
      - {slug: serotonin, presence: body, presence_note: "Your body makes it from tryptophan."}
      - {slug: tryptophan, presence: none, presence_note: "An essential amino acid: it comes from food, and the body cannot make it."}
      - {slug: 5-hydroxytryptophan, presence: body, presence_note: "Your body makes it from tryptophan."}
    journey:
      - {slug: tryptophan, caption: starts in dinner}
      - {slug: 5-hydroxytryptophan, caption: becomes}
      - {slug: serotonin, caption: becomes}
      - {slug: melatonin, caption: becomes}

  - slug: glass-of-wine
    title: A glass of wine
    blurb: What's in the glass.
    tint: food-flavor
    molecules:
      - {slug: ethanol, presence: formed, formed_when: fermentation, presence_note: "Made by yeast from the grape sugars."}
      - {slug: resveratrol, presence: natural, presence_note: "From the grape skins."}
      - {slug: tartaric-acid, presence: natural, presence_note: "The main acid of the grape."}
      - {slug: malic-acid, presence: natural, presence_note: "An acid of the grape; malolactic fermentation turns part of it into lactic acid."}
      - {slug: cyanidin, presence: natural, presence_note: "From the grape skins, as a glycoside among the red pigments."}
    journey:
      - {slug: ethanol, caption: the alcohol}
      - {slug: cyanidin, caption: the color}
      - {slug: tartaric-acid, caption: the tartness}

  - slug: fresh-bread
    title: Fresh-baked bread
    blurb: The smell of the oven.
    tint: food-flavor
    molecules:
      - {slug: maltol, presence: formed, formed_when: baked, presence_note: "Formed in the crust as it bakes."}
      - {slug: furaneol, presence: formed, formed_when: baked, presence_note: "Formed in the crust as it bakes."}
      - {slug: hydroxymethylfurfural, presence: formed, formed_when: baked, presence_note: "Formed from the sugars as the crust browns."}
      - {slug: acetic-acid, presence: formed, formed_when: fermentation, presence_note: "Made by bacteria in a sourdough; yeast make a little."}
      - {slug: acrylamide, presence: formed, formed_when: baked, presence_note: "Formed in the crust as it browns."}
    journey:
      - {slug: maltol, caption: warm crust aroma}
      - {slug: furaneol, caption: strawberry note}
      - {slug: hydroxymethylfurfural, caption: browning}

  - slug: sunscreen-summer-skin
    title: Sunscreen and summer skin
    blurb: Molecules between you and the sun.
    tint: body-endogenous
    molecules:
      - {slug: zinc-oxide, presence: added, presence_note: "The mineral filter the maker adds to sunscreen."}
      - {slug: melanin, presence: body, presence_note: "The pigment your skin makes in sunlight."}
      - {slug: cholecalciferol, presence: body, presence_note: "Your skin makes it when sunlight reaches it."}
      - {slug: retinol, presence: added, presence_note: "An ingredient the maker adds to skincare."}
      - {slug: salicylic-acid, presence: added, presence_note: "An ingredient the maker adds to skincare."}
      - {slug: hyaluronic-acid, presence: body, presence_note: "Your skin makes it; skincare products also add it."}
    journey:
      - {slug: zinc-oxide, caption: mineral block}
      - {slug: melanin, caption: your own sunscreen}
      - {slug: cholecalciferol, caption: sunlight makes}
      - {slug: retinol, caption: skincare}

  - slug: citrus
    title: Citrus
    blurb: A fresh orange, unpacked.
    tint: plant-compound
    molecules:
      - {slug: limonene, presence: natural, presence_note: "The main part of the peel oil."}
      - {slug: citral, presence: natural, presence_note: "Part of the peel oil."}
      - {slug: ascorbic-acid, presence: natural, presence_note: "Made by the fruit."}
      - {slug: citric-acid, presence: natural, presence_note: "The main acid of citrus juice."}
      - {slug: hesperidin, presence: natural, presence_note: "A flavonoid of the white pith and peel."}
      - {slug: naringin, presence: natural, presence_note: "The bitter flavonoid of grapefruit."}
    journey:
      - {slug: limonene, caption: the orange scent}
      - {slug: citral, caption: peel aroma}
      - {slug: citric-acid, caption: the tang}
      - {slug: hesperidin, caption: the flavonoid}

  - slug: your-workout
    title: Your workout
    blurb: What powers and burns your muscles.
    tint: body-endogenous
    molecules:
      - {slug: adenosine-triphosphate, presence: body, presence_note: "Every cell makes it."}
      - {slug: creatine, presence: body, presence_note: "Your body makes it and stores it in muscle; food supplies some too."}
      - {slug: lactic-acid, presence: body, presence_note: "Your muscles make it from glucose as they work."}
      - {slug: beta-hydroxybutyric-acid, presence: body, presence_note: "Your liver makes it from fat."}
      - {slug: epinephrine, presence: body, presence_note: "Your adrenal glands make it."}
      - {slug: carnitine, presence: body, presence_note: "Your body makes it; food supplies some too."}
    journey:
      - {slug: adenosine-triphosphate, caption: your fuel}
      - {slug: creatine, caption: recharged by}
      - {slug: lactic-acid, caption: the burn}
      - {slug: beta-hydroxybutyric-acid, caption: backup fuel}
