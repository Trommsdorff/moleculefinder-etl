    text: {board: sweetest, pin: "3d216ae355eb"}
  - go: "Compare sucralose and aspartame"
    to: {pair: sucralose-vs-aspartame}
    pair_drawing: sucralose-vs-aspartame
    text: {answer: sucralose-vs-aspartame, pin: "846711065687"}
members:
  - {hub: table-sugar}
  - {product: diet-soda}
  - {product: soft-drinks}
  - {product: sugar-free-gum}
  - {hub: stevia}
