  alcohol:              {article: an, phrase: alcohol, hub: Alcohols}
  aldehyde:             {article: an, phrase: aldehyde, hub: Aldehydes}
  alkaloid:             {article: a, phrase: plant alkaloid, hub: Plant alkaloids}
  alkene:               {article: an, phrase: alkene, hub: Alkenes}
  amide:                {article: an, phrase: amide, hub: Amides}
  amine:                {article: an, phrase: amine, hub: Amines}
  amino-acid:           {article: an, phrase: amino acid, hub: Amino acids}
  biguanide:            {article: a, phrase: biguanide, hub: Biguanides}
  carotenoid:           {article: a, phrase: carotenoid pigment, hub: Carotenoids}
  ester:                {article: an, phrase: ester, hub: Esters}
  fatty-acid:           {article: a, phrase: fatty acid, hub: Fatty acids}
  flavonoid:            {article: a, phrase: flavonoid, hub: Flavonoids}
  glycoside:            {article: a, phrase: glycoside, hub: Glycosides}
  inorganic:            {article: an, phrase: inorganic compound, hub: Inorganic compounds}
