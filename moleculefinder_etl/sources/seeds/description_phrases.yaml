# Description phrases — the vocabulary of the templated description floor
# (BUILD-PLAN-traffic-2026-09-05 phase 1, layer A).
#
# WHY THIS EXISTS. Until 2026-09 the meta description, the on-page "What is X?"
# answer and the FAQPage JSON-LD all came from the Wikidata one-line description,
# which for 292 of 498 molecules is literally "chemical compound". 498 pages
# carried 164 distinct descriptions, mean length 30 characters. Search engines
# read that as thin, duplicated content, and it is the reason the site ranked on
# page five for its own head terms.
#
# `assemble.build_description` composes a sentence per molecule from fields that
# exist on EVERY record (title, formula, weight, scope family, scope bucket, GHS,
# and whichever measured value the molecule carries). The wording lives here, not
# in the code, so it stays consistent and editable and a future tranche of
# molecules inherits it for free.
#
# HOUSE RULES for anything added below: no em-dashes in visible site copy; no
# medical advice and no dosing; state what a thing IS, never what a reader should
# do about it. Phrases must read naturally in the slot they fill:
#
#   {Title} ({formula}, {weight} g/mol) is {article} {family} {bucket}.
#      {hazard}. {measured value}. {structure}.

# ── families: scope_family -> the noun phrase and its article ────────────────
# Every scope_family present in the canon needs an entry. An unmapped family
# falls back to "compound", which is exactly the generic wording this file
# exists to eliminate, so `mfetl transform` logs a warning naming it.
families:
  alcohol:              {article: an, phrase: alcohol, hub: Alcohols}
  aldehyde:             {article: an, phrase: aldehyde, hub: Aldehydes}
  alkaloid:             {article: a, phrase: plant alkaloid, hub: Plant alkaloids}
  alkene:               {article: an, phrase: alkene, hub: Alkenes}
  amide:                {article: an, phrase: amide, hub: Amides}
  amine:                {article: an, phrase: amine, hub: Amines}
  amino-acid:           {article: an, phrase: amino acid, hub: Amino acids}
  biguanide:            {article: a, phrase: biguanide, hub: Biguanides}
  carotenoid:           {article: a, phrase: carotenoid pigment, hub: Carotenoids}
  ester:                {article: an, phrase: ester, hub: Esters}
  fatty-acid:           {article: a, phrase: fatty acid, hub: Fatty acids}
  flavonoid:            {article: a, phrase: flavonoid, hub: Flavonoids}
  glycoside:            {article: a, phrase: glycoside, hub: Glycosides}
  inorganic:            {article: an, phrase: inorganic compound, hub: Inorganic compounds}
  ketone:               {article: a, phrase: ketone, hub: Ketones}
  neurotransmitter:     {article: a, phrase: neurotransmitter, hub: Neurotransmitters}
  nucleobase:           {article: a, phrase: nucleobase, hub: Nucleobases}
  organic-acid:         {article: an, phrase: organic acid, hub: Organic acids}
  otc:                  {article: an, phrase: over-the-counter medicine, hub: Over-the-counter medicines}
  peptide:              {article: a, phrase: peptide, hub: Peptides}
  phenolic:             {article: a, phrase: phenolic compound, hub: Phenolic compounds}
  phospholipid-mixture: {article: a, phrase: phospholipid mixture, hub: Phospholipid mixtures}
  pigment-polymer:      {article: a, phrase: pigment polymer, hub: Pigment polymers}
  polysaccharide:       {article: a, phrase: polysaccharide, hub: Polysaccharides}
  protein:              {article: a, phrase: protein, hub: Proteins}
  protein-mixture:      {article: a, phrase: protein mixture, hub: Protein mixtures}
  steroid-hormone:      {article: a, phrase: steroid hormone, hub: Steroid hormones}
  sugar:                {article: a, phrase: sugar, hub: Sugars}
  sugar-alcohol:        {article: a, phrase: sugar alcohol, hub: Sugar alcohols}
  sulfur:               {article: a, phrase: sulfur compound, hub: Sulfur compounds}
  surfactant:           {article: a, phrase: surfactant, hub: Surfactants}
  sweetener:            {article: a, phrase: sweetener, hub: Sweeteners}
  terpene:              {article: a, phrase: terpene, hub: Terpenes}
  terpenoid:            {article: a, phrase: terpenoid, hub: Terpenoids}
  vitamin:              {article: a, phrase: vitamin, hub: Vitamins}
  # "other" is the catch-all the Scope B CSV uses when no family fits (87 rows).
  # Deliberately vague rather than wrong; the bucket clause carries the meaning.
  other:                {article: a, phrase: compound, hub: Other compounds}

# ── buckets: scope_bucket -> the clause that follows the family phrase ────────
buckets:
  body-endogenous:    that occurs naturally in the human body
  everyday-chemistry: used in everyday household chemistry
  food-flavor:        found in everyday food and flavor
  nutrient-vitamin:   counted among the everyday nutrients
  otc-medicine:       sold over the counter
  plant-compound:     made by plants
  scent-aroma:        carried in everyday scent and aroma
  sweetener:          used to sweeten food and drink

# ── GHS pictogram -> the plain-English hazard word for the label clause ───────
# Ordered by how much a reader cares; build_description names at most two.
ghs_pictograms:
  GHS01: explosive
  GHS06: acutely toxic
  GHS05: corrosive
  GHS02: flammable
  GHS08: a health hazard
  GHS03: oxidizing
  GHS04: a compressed gas
  GHS09: hazardous to the environment
  GHS07: an irritant

# ── functional group -> the phrase used in the "its structure carries" clause ─
functional_groups:
  alcohols:          a hydroxyl group
  aldehydes:         an aldehyde group
  amides:            an amide bond
  amines:            an amine group
  aromatics:         an aromatic ring
  carboxylic-acids:  a carboxylic acid group
  esters:            an ester group
  ethers:            an ether linkage
  halogenated:       a halogen atom
  ketones:           a ketone group
  phenols:           a phenol group
  phosphates:        a phosphate group
  thiols:            a thiol group
