# ── Phase 6 additions (2026-09-07) ─────────────────────────────────────────────
# The build plan asked for curated foods on the 60 highest-demand molecules still showing
# "Not yet mapped". After tranche 1 that list is mostly prescription medicines and pure
# elements, which have no food and never will, so the honest half of the job is here (the
# foods that genuinely exist, including several of those elements as dietary minerals) and
# the other half is in product_hubs.yaml and in the web's fallback for medicines.
#
# Same rule as above and it is the whole discipline of this file: every entry is a
# documented component or a standard ingredient of the food named. Where a molecule is in
# a food only as a contaminant or a trace, it is left out rather than implied.

red-meat:
  name: Red meat
  molecules:
    - {slug: creatine, presence: natural, presence_note: "Stored in the animal's muscle."}   # muscle stores it; beef is the densest common source
    - {slug: carnosine, presence: natural, presence_note: "A dipeptide of the animal's muscle."}   # a dipeptide concentrated in skeletal muscle
    - {slug: taurine, presence: natural, presence_note: "Present in the animal's muscle."}   # abundant in muscle tissue
    - {slug: cholesterol, presence: natural, presence_note: "Part of every animal cell membrane."}   # in every animal cell membrane
    - {slug: vitamin-b12, presence: natural, presence_note: "Made by microbes and stored in the animal's tissues."}   # essentially absent from plants
    - {slug: iron, presence: natural, presence_note: "Mostly as haem iron in the muscle."}   # haem iron, the readily absorbed form
    - {slug: zinc, presence: natural, presence_note: "A mineral of the meat."}
    - {slug: coenzyme-q10, presence: natural, presence_note: "Present in the animal's tissues, highest in heart."}   # highest in heart and other organ meat
    - {slug: palmitic-acid, presence: natural, presence_note: "Part of the fats of the meat."}   # the main saturated fat in beef fat
    - {slug: stearic-acid, presence: natural, presence_note: "Part of the fats of the meat."}
    - {slug: oleic-acid, presence: natural, presence_note: "Part of the fats of the meat."}   # about half the fat in beef is monounsaturated

fish:
  name: Fish
  molecules:
    - {slug: docosahexaenoic-acid, presence: natural, presence_note: "Part of the fats of oily fish."}   # the long-chain omega-3 oily fish is eaten for
    - {slug: taurine, presence: natural, presence_note: "Present in the fish's muscle."}
    - {slug: creatine, presence: natural, presence_note: "Stored in the fish's muscle."}
    - {slug: vitamin-b12, presence: natural, presence_note: "Stored in the fish's tissues."}
    - {slug: selenium, presence: natural, presence_note: "A mineral of the fish."}
    - {slug: iodine, presence: natural, presence_note: "Sea fish take it up from seawater, as iodide."}   # sea fish concentrate it from seawater
    - {slug: cholesterol, presence: natural, presence_note: "Part of every animal cell membrane."}
    - {slug: histamine, presence: none, presence_note: "Formed by bacteria from histidine when fish is not kept cold; fresh fish holds little."}   # forms in poorly chilled scombroid fish

eggs:
  name: Eggs
  molecules:
    - {slug: cholesterol, presence: natural, presence_note: "Part of the yolk."}   # the yolk is one of the densest dietary sources
    - {slug: choline, presence: natural, presence_note: "Part of the yolk, as phosphatidylcholine."}   # as phosphatidylcholine in the yolk
    - {slug: lutein, presence: natural, presence_note: "A pigment of the yolk."}   # with zeaxanthin, the yellow of the yolk
    - {slug: zeaxanthin, presence: natural, presence_note: "A pigment of the yolk."}
    - {slug: biotin, presence: natural, presence_note: "Present in the yolk."}
    - {slug: riboflavin, presence: natural, presence_note: "Present in the egg."}
    - {slug: vitamin-b12, presence: natural, presence_note: "Present in the yolk."}
    - {slug: tryptophan, presence: natural, presence_note: "An amino acid of the egg's proteins."}

milk:
  name: Milk
  molecules:
    - {slug: lactose, presence: natural, presence_note: "The sugar of milk."}   # the sugar that gives milk its name
    - {slug: casein, presence: natural, presence_note: "The main protein of milk."}   # about 80 percent of milk protein
    - {slug: calcium, presence: natural, presence_note: "A mineral of milk."}
    - {slug: riboflavin, presence: natural, presence_note: "Present in milk."}
    - {slug: vitamin-b12, presence: natural, presence_note: "Present in milk."}
    - {slug: tryptophan, presence: natural, presence_note: "An amino acid of the milk proteins."}
    - {slug: water, presence: natural, presence_note: "About 87 percent of milk."}   # roughly 87 percent of milk by weight

cheese:
  name: Cheese
  molecules:
