# The MoleculeFinder dataset as published (Garrett uploaded version 2026.10 on 2026-10-23, Zenodo
# dates it 2026-10-24; version 2026.10.1 on 2026-10-24). Every package `mfetl dataset` builds
# carries these, and it REFUSES to build if any field is empty: a package that cannot say where it
# is published is not shipped. The citation is always the concept DOI; each version's own DOI goes
# beside it. Versions are listed oldest first; the last is the latest, and zenodo_record is its page.
# A new version: `mfetl zenodo` publishes it and appends it here with the DOI Zenodo reserved, and
# moves zenodo_record (never edit by hand). The site names only concept_doi, so it needs no change.
concept_doi: 10.5281/zenodo.23605767    # Zenodo's "Cite all versions" DOI: always the latest version
zenodo_record: https://zenodo.org/records/24407566
kaggle: trommsdorff/moleculefinder-molecules-in-everyday-products
# The Hugging Face dataset repo, owner/name, once Garrett creates it (the links kit, 2026-10-29;
# `docs/outreach/LINKS-KIT-2026-10.md` in the web repo). Empty is allowed. When set, run
# `mfetl dataset --card` so the card links it, re-upload the card, and add the same URL to the web
# repo's lib/dataset.ts. Keep this line ABOVE `versions:` (record_version appends to the file's end).
huggingface: Trommsdorff/moleculefinder-molecules-in-everyday-products
# The version the dataset should be at (2026-11-20). Cutting a new version is changing this one line (a
# session, on Garrett's word). When it is newer than Zenodo's latest, the Mac's weekly refresh, once the site's
# data is live, builds that version from the live snapshot and publishes it (`mfetl zenodo --release`).
# Keep it ABOVE `versions:`.
release: "2026.11"
versions:                                # each published version's own DOI
  "2026.10": 10.5281/zenodo.23605768
  "2026.10.1": 10.5281/zenodo.23620892
  "2026.11": 10.5281/zenodo.24407566
